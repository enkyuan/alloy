id: ts-runtime-no-stream-string-concatenation
language: TypeScript
severity: error
message: Accumulate provider text in the bounded DeltaAccumulator.
files:
  - "kaji/ts/src/runtime/runtime.ts"
rule:
  all:
    - any:
        - pattern: response += $DELTA
        - pattern: content += $DELTA
        - pattern: text += $DELTA
    - inside:
        any:
          - pattern:
              context: |
                for await (const $CHUNK of this.provider.generateStream($$$ARGS)) {
                  $$$BODY
                }
              selector: for_in_statement
          - pattern:
              context: |
                for await (const $CHUNK of $SCOPE.consume(this.provider.generateStream($$$ARGS))) {
                  $$$BODY
                }
              selector: for_in_statement
          - all:
              - pattern:
                  context: |
                    for await (const $CHUNK of $STREAM) {
                      $$$BODY
                    }
                  selector: for_in_statement
              - follows:
                  any:
                    - pattern: const $STREAM = this.provider.generateStream($$$ARGS)
                    - pattern: let $STREAM = this.provider.generateStream($$$ARGS)
                    - pattern: var $STREAM = this.provider.generateStream($$$ARGS)
                    - pattern: "const $STREAM: $TYPE = this.provider.generateStream($$$ARGS)"
                    - pattern: "let $STREAM: $TYPE = this.provider.generateStream($$$ARGS)"
                    - pattern: "var $STREAM: $TYPE = this.provider.generateStream($$$ARGS)"
                    - pattern: $STREAM = this.provider.generateStream($$$ARGS)
                  stopBy: end
          - all:
              - pattern:
                  context: |
                    for await (const $CHUNK of $SCOPE.consume($STREAM)) {
                      $$$BODY
                    }
                  selector: for_in_statement
              - follows:
                  any:
                    - pattern: const $STREAM = this.provider.generateStream($$$ARGS)
                    - pattern: let $STREAM = this.provider.generateStream($$$ARGS)
                    - pattern: var $STREAM = this.provider.generateStream($$$ARGS)
                    - pattern: "const $STREAM: $TYPE = this.provider.generateStream($$$ARGS)"
                    - pattern: "let $STREAM: $TYPE = this.provider.generateStream($$$ARGS)"
                    - pattern: "var $STREAM: $TYPE = this.provider.generateStream($$$ARGS)"
                    - pattern: $STREAM = this.provider.generateStream($$$ARGS)
                  stopBy: end
        stopBy: end
