id: kaji-no-module-secret-read
language: TypeScript
severity: error
message: Auth and registry modules must not read secrets or start I/O during import.
files:
  - "kaji/ts/src/auth/**/*.ts"
  - "kaji/ts/registry/**/*.ts"
  - "kaji/src/kaji/integrations/registry/**/*.ts"
rule:
  all:
    - any:
        - pattern: process.env.$KEY
        - pattern: process.env[$KEY]
        - pattern: Bun.env.$KEY
        - pattern: Bun.env[$KEY]
        - pattern: Deno.env.get($$$ARGS)
        - pattern: fetch($$$ARGS)
        - pattern: globalThis.fetch($$$ARGS)
        - pattern: httpRequest($$$ARGS)
        - pattern: httpsRequest($$$ARGS)
        - pattern: createServer($$$ARGS)
        - pattern: $SERVER.listen($$$ARGS)
        - pattern: new MacOSKeychainTokenStorage($$$ARGS)
        - pattern: new GoogleOAuthClient($$$ARGS)
        - pattern: $KEYCHAIN.getPassword($$$ARGS)
        - pattern: $KEYCHAIN.load($$$ARGS)
    - not:
        inside:
          any:
            - kind: function_declaration
            - kind: function_expression
            - kind: arrow_function
            - kind: method_definition
          stopBy: end
