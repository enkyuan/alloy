id: kaji-copied-imports-public-subpath
language: TypeScript
severity: error
message: Copied providers must import fixed-origin contracts from kaji-sdk/integrations.
files:
  - "kaji/packages/typescript/registry/github/**/*.ts"
  - "kaji/packages/python/src/kaji/integrations/registry/github/**/*.ts"
rule:
  all:
    - kind: import_statement
    - has:
        any:
          - pattern: createGitHubRequester
          - pattern: createGmailRequester
          - pattern: FixedOriginRequester
          - pattern: BoundedResponse
          - pattern: snapshotIntegrationResult
        stopBy: end
    - not:
        regex: '(?s).*from\s+["'']kaji-sdk/integrations["'']\s*;?$'
