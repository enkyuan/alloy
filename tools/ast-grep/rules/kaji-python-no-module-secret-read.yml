id: kaji-python-no-module-secret-read
language: Python
severity: error
message: Python auth and registry modules must not read secrets or start I/O during import.
files:
  - "kaji/src/kaji/integrations/oauth.py"
  - "kaji/src/kaji/integrations/keychain.py"
  - "kaji/src/kaji/integrations/registry/**/*.py"
rule:
  all:
    - any:
        - pattern: os.getenv($$$ARGS)
        - pattern: os.environ[$KEY]
        - pattern: os.environ.get($$$ARGS)
        - pattern: keyring.get_password($$$ARGS)
        - pattern: httpx.get($$$ARGS)
        - pattern: httpx.post($$$ARGS)
        - pattern: httpx.request($$$ARGS)
        - pattern: asyncio.start_server($$$ARGS)
        - pattern: webbrowser.open($$$ARGS)
    - not:
        inside:
          any:
            - kind: function_definition
            - kind: lambda
          stopBy: end
