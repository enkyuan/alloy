id: ts-provider-no-tool-argument-string-concatenation
language: TypeScript
severity: error
message: Accumulate streamed tool arguments in LinearStringParts, never repeated string concatenation.
files:
  - "kaji/ts/src/providers/openai.ts"
  - "kaji/ts/src/providers/anthropic.ts"
rule:
  all:
    - any:
        - pattern: arguments += $FRAGMENT
        - pattern: argsRaw += $FRAGMENT
        - pattern: rawArguments += $FRAGMENT
        - pattern: $CALL.arguments += $FRAGMENT
        - pattern: $CALL.argsRaw += $FRAGMENT
        - pattern: arguments = $BASE + $FRAGMENT
        - pattern: argsRaw = $BASE + $FRAGMENT
        - pattern: rawArguments = $BASE + $FRAGMENT
        - pattern: $CALL.arguments = $BASE + $FRAGMENT
        - pattern: $CALL.argsRaw = $BASE + $FRAGMENT
    - inside:
        stopBy: end
        any:
          - kind: for_statement
          - kind: for_in_statement
          - kind: while_statement
