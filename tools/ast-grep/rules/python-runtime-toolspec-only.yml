id: python-runtime-toolspec-only
language: Python
message: Runtime tools must use ToolSpec from kaji.runtime.tools.registry; the removed kaji.types.tool surface is not supported.
severity: error
files:
  - "kaji/packages/py/src/runtime/tools/**/*.py"
rule:
  any:
    - pattern: import kaji.types.tool
    - pattern: import kaji.types.tool.$M
    - pattern: from kaji.types.tool import $$$
    - pattern: from kaji.types.tool.$M import $$$
