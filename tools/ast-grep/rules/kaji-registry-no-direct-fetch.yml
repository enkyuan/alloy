id: kaji-registry-no-direct-fetch
language: TypeScript
severity: error
message: Copied registry code must use the provider-fixed bounded requester.
files:
  - "kaji/packages/typescript/registry/**/*.ts"
  - "kaji/packages/python/src/kaji/integrations/registry/**/*.ts"
rule:
  any:
    - pattern: fetch($$$ARGS)
    - pattern: global.fetch($$$ARGS)
    - pattern: globalThis.fetch($$$ARGS)
    - pattern: window.fetch($$$ARGS)
    - pattern: self.fetch($$$ARGS)
