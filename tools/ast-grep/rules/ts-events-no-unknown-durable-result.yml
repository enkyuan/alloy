id: ts-events-no-unknown-durable-result
language: TypeScript
severity: error
message: Durable event result fields must use the bounded JSON schema, never z.unknown().
files:
  - "kaji/ts/src/events/**/*.ts"
rule:
  all:
    - pattern: z.unknown()
    - inside:
        pattern:
          context: "({ result: z.unknown() })"
          selector: pair
        stopBy: end
    - inside:
        pattern: event($SCHEMA)
        stopBy: end
