id: kaji-registry-no-direct-fetch
valid:
  - |
      const response = await requester.request(path, init, context);
  - |
      const response = await transport.request(target, init);
invalid:
  - |
      const response = await fetch(url, init);
  - |
      return globalThis.fetch(url);
  - |
      window.fetch(url);
  - |
      await self.fetch(url, init);
  - |
      return global.fetch(url, init);
