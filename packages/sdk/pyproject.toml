[tool.poetry]
name = "agentkit"
version = "0.1.0"
description = "An embeddable SDK for building agentic platforms (text + voice)."
authors = ["enkyuan <yuan.enkng@gmail.com>"]
readme = "agentkit/README.md"
packages = [{ include = "agentkit" }]

[tool.poetry.dependencies]
python = "^3.11"
# Core SDK deps only. The FastAPI server, Postgres drivers, and auth deps live
# in the separate `agentkit-serve` distribution. `sqlalchemy` stays here because
# the core uses it (core/database.py Base, types/sqlalchemy.py EncryptedText).
sqlalchemy = ">=2.0.44,<3.0.0"
pydantic = {extras = ["email"], version = "^2.12.0"}
pydantic-settings = ">=2.11.0,<3.0.0"
httpx = ">=0.27.0,<0.28.0"
redis = {extras = ["asyncio"], version = "^6.4.0"}
websockets = ">=13.0,<16.0"
google-api-python-client = ">=2.108.0,<3.0.0"
google-auth = ">=2.25.0,<3.0.0"
google-auth-oauthlib = ">=1.2.0,<2.0.0"
google-auth-httplib2 = ">=0.2.0,<1.0.0"
google-genai = ">=1.0.0,<2.0.0"
openai = ">=2.0.0,<3.0.0"
rich = ">=13.0.0,<14.0.0"
taskiq = "^0.11.20"

taskiq-redis = "^1.1.2"
loguru = "^0.7.3"
msgpack = "^1.1.2"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.poetry.group.dev.dependencies]
pyrefly = "^0.45.1"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
fakeredis = "^2.33.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = ["agentkit"]
branch = true
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
