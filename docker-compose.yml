services:
  # Modal API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: modal-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Use supabase network services (db, redis, kong)
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/postgres
      REDIS_URL: redis://modal-redis:6379/0

      JWT_SECRET: ${JWT_SECRET:-9LyTUmUlDZWHxjfw7JqyQGhNGbvdnp942L5D9chYa1c=}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzYwMjUwMDY1LCJleHAiOjQxMDI0NDQ4MDB9.j28GOOiKPcjJRp57BlAgpMEIG7sdYwgSiWGnYD45slA}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJpYXQiOjE3NjAyNTAwNjUsImV4cCI6NDEwMjQ0NDgwMH0.7PhMej5enJSiNAiH-vwMUuLtWY8MuPSTFTVwOpIcE_U}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-1021220745951-7mavjjtg16o9i91eb7rtcc6smpg3m1b9.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}

      DEBUG: "False"
      API_V1_PREFIX: /api/v1
      PROJECT_NAME: Modal API
    volumes:
      - ./apps/api:/app:ro
    networks:
      - modal_network

# Connect to the supabase network (or create if it doesn't exist)
networks:
  modal_network:
    name: modal_network
