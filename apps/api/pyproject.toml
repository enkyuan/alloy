[tool.poetry]
name = "modal-api"
version = "0.1.0"
description = ""
authors = ["enkyuan <yuan_enkang@outlook.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.119.0,<0.120.0"
uvicorn = ">=0.37.0,<0.38.0"
sqlalchemy = ">=2.0.44,<3.0.0"
alembic = ">=1.17.0,<2.0.0"
psycopg2-binary = ">=2.9.11,<3.0.0"
pydantic = {extras = ["email"], version = "^2.12.0"}
pydantic-settings = ">=2.11.0,<3.0.0"
python-jose = ">=3.5.0,<4.0.0"
passlib = ">=1.7.4,<2.0.0"
asyncpg = ">=0.30.0,<0.31.0"
httpx = ">=0.27.0,<0.28.0"
redis = {extras = ["asyncio"], version = "^6.4.0"}
python-multipart = ">=0.0.9,<0.1.0"
websockets = ">=12.0,<13.0"
google-api-python-client = ">=2.108.0,<3.0.0"
google-auth = ">=2.25.0,<3.0.0"
google-auth-oauthlib = ">=1.2.0,<2.0.0"
google-auth-httplib2 = ">=0.2.0,<1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
