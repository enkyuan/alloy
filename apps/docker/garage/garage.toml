# Garage single-node dev config
# Docs: https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/

metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "lmdb"

replication_factor = 1

[networking]
rpc_bind_addr  = "0.0.0.0:3901"
rpc_public_addr = "garage:3901"
rpc_secret     = "__GARAGE_RPC_SECRET__"   # overridden by GARAGE_RPC_SECRET env var at runtime

[s3_api]
s3_region        = "garage"
api_bind_addr    = "0.0.0.0:3900"
root_domain      = ".s3.localhost"

[s3_web]
bind_addr = "0.0.0.0:3903"
root_domain = ".web.localhost"
index     = "index.html"

[admin]
api_bind_addr = "0.0.0.0:3902"
