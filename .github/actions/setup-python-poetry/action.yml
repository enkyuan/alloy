name: Setup Python Poetry
description: Set up Python, install Poetry, cache virtualenvs, and install dependencies.

inputs:
  working-directory:
    description: Directory containing pyproject.toml.
    required: true
  python-version:
    description: Python version to install.
    required: false
    default: "3.11"
  install-args:
    description: Arguments passed to poetry install.
    required: false
    default: "--no-interaction --sync"
  lock:
    description: Whether to run poetry lock before installing.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      shell: bash
      run: pipx install poetry

    - name: Cache Poetry virtualenv
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry/virtualenvs
        key: poetry-${{ runner.os }}-py${{ inputs.python-version }}-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/poetry.lock', inputs.working-directory), format('{0}/pyproject.toml', inputs.working-directory)) }}
        restore-keys: |
          poetry-${{ runner.os }}-py${{ inputs.python-version }}-${{ inputs.working-directory }}-

    - name: Lock dependencies
      if: ${{ inputs.lock == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: poetry lock

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: poetry install ${{ inputs.install-args }}
