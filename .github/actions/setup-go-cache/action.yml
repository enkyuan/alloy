name: Setup Go Cache
description: Set up Go with module/build caching.

inputs:
  working-directory:
    description: Directory containing go.mod.
    required: true
  go-version:
    description: Go version to install.
    required: false
    default: "1.25"

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum
