name: Setup Bun Cache
description: Set up Bun and install workspace dependencies.

inputs:
  working-directory:
    description: Directory where bun install should run.
    required: true
  bun-version:
    description: Bun version to install.
    required: false
    default: latest
  install-args:
    description: Arguments passed to bun install.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun install cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ inputs.working-directory }}-${{ hashFiles('bun.lock', 'package.json', format('{0}/package.json', inputs.working-directory)) }}
        restore-keys: |
          bun-${{ runner.os }}-${{ inputs.working-directory }}-
          bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install ${{ inputs.install-args }}
