name: Kaji beta performance

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    tags:
      - "kaji-v*"
  workflow_dispatch:
    inputs:
      job:
        description: Protected performance job to run
        required: true
        default: benchmark
        type: choice
        options:
          - benchmark
          - soak
          - calibrate
          - all

concurrency:
  group: kaji-beta-performance-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KAJI_BENCHMARK_PINNED_RUNNER: "1"
  KAJI_BENCHMARK_RUNNER_IMAGE_DIGEST: ${{ vars.KAJI_BENCHMARK_RUNNER_IMAGE_DIGEST }}

jobs:
  benchmark:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      inputs.job == 'benchmark' ||
      inputs.job == 'all'
    runs-on: [self-hosted, linux, x64, kaji-benchmark]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji/sdk
          python-version: "3.11.9"
      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: .
          bun-version: "1.3.11"
          install-args: --frozen-lockfile
      - name: Compare five-sample medians
        run: uv run --project kaji/sdk python kaji/scripts/run_beta_benchmarks.py --full
      - name: Upload raw benchmark samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-beta-benchmarks-${{ github.run_id }}
          path: .artifacts/kaji-benchmarks/
          if-no-files-found: warn
          retention-days: 30

  soak:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      inputs.job == 'soak' ||
      inputs.job == 'all'
    runs-on: [self-hosted, linux, x64, kaji-benchmark]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji/sdk
          python-version: "3.11.9"
      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: .
          bun-version: "1.3.11"
          install-args: --frozen-lockfile
      - name: Run protected 30-minute soak
        run: uv run --project kaji/sdk python kaji/scripts/run_beta_soak.py --minutes 30
      - name: Upload soak and heap samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-beta-soak-${{ github.run_id }}
          path: .artifacts/kaji-soak/
          if-no-files-found: warn
          retention-days: 30

  calibrate:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'calibrate'
    runs-on: [self-hosted, linux, x64, kaji-benchmark]
    timeout-minutes: 30
    env:
      KAJI_BENCHMARK_CALIBRATION: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji/sdk
          python-version: "3.11.9"
      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: .
          bun-version: "1.3.11"
          install-args: --frozen-lockfile
      - name: Produce candidate baseline only
        run: uv run --project kaji/sdk python kaji/scripts/run_beta_benchmarks.py --calibrate
      - name: Upload candidate baseline and raw samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-beta-baseline-candidate-${{ github.run_id }}
          path: .artifacts/kaji-benchmarks/
          if-no-files-found: error
          retention-days: 30
