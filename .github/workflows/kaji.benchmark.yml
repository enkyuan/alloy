name: benchmark / kaji

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    tags:
      - "kaji-v*"
  workflow_dispatch:
    inputs:
      job:
        description: Protected performance job to run
        required: true
        default: all
        type: choice
        options:
          - benchmark
          - soak
          - all

concurrency:
  group: kaji-beta-performance-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-artifacts:
    name: release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      artifact-id: ${{ steps.release-artifacts.outputs.artifact-id }}
      artifact-digest: ${{ steps.release-artifacts.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Bind the candidate to the checked-out commit
        id: identity
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - name: Install frozen TypeScript dependencies for the release build
        working-directory: kaji/packages/typescript
        run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: .
          python-version: "3.14"
      - name: Build and verify one release artifact set
        env:
          KAJI_RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: uv run --project kaji/packages/python python kaji/scripts/beta_release_check.py --release
      - name: Upload exact release artifacts
        id: release-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
          if-no-files-found: error

  performance:
    name: performance evidence
    needs: release-artifacts
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/kaji.performance.yml
    with:
      candidate-commit: ${{ needs.release-artifacts.outputs.commit }}
      candidate-artifact-id: ${{ needs.release-artifacts.outputs.artifact-id }}
      candidate-artifact-digest: ${{ needs.release-artifacts.outputs.artifact-digest }}
      run-paired: ${{ github.event_name != 'workflow_dispatch' || inputs.job != 'soak' }}
      run-soak: ${{ github.event_name != 'workflow_dispatch' || inputs.job != 'benchmark' }}
