name: test / go

on:
  push:
    branches: [main]
    paths:
      - "agentpay/api/**"
      - "agentpay/consumer/**"
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/go.test.yml"
  pull_request:
    paths:
      - "agentpay/api/**"
      - "agentpay/consumer/**"
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/go.test.yml"

jobs:
  api:
    name: agentpay/api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-go-cache
        with:
          working-directory: agentpay/api

      - name: Run migrations
        run: go run ./cmd/migrate up

      - name: Test
        run: go test ./... -v -race -count=1

  consumer:
    name: agentpay/consumer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/consumer
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-go-cache
        with:
          working-directory: agentpay/consumer

      - name: Run migrations
        run: go run ./cmd/migrate up

      - name: Test
        run: go test ./... -v -race -count=1
