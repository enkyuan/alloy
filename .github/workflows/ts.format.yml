name: format / ts

on:
  push:
    branches: [main]
    paths:
      - "kaji/packages/typescript/**"
      - "apps/cli/**"
      - "apps/web/**"
      - "packages/shared/**"
      - "ryo/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.format.yml"
  pull_request:
    paths:
      - "kaji/packages/typescript/**"
      - "apps/cli/**"
      - "apps/web/**"
      - "packages/shared/**"
      - "ryo/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.format.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workspace: [kaji/packages/typescript, apps/cli, apps/web, ryo/auth, packages/ui, packages/shared]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: ${{ matrix.workspace }}

      - name: Check formatting
        run: bun run format:check
