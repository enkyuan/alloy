name: format / ts

on:
  push:
    branches: [main]
    paths:
      - "kaji/ts/**"
      - "ryo/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.format.yml"
  pull_request:
    paths:
      - "kaji/ts/**"
      - "ryo/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.format.yml"

permissions:
  contents: read

jobs:
  kaji-ts:
    name: kaji/ts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kaji/ts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts

      - name: Check formatting
        run: bun run format:check

  auth:
    name: ryo/auth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ryo/auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: ryo/auth

      - name: Check formatting
        run: bun run format:check

  ui:
    name: packages/ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: packages/ui

      - name: Check formatting
        run: bun run format:check
