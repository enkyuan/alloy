name: test / auth

on:
  push:
    branches: [main]
    paths:
      - "agentpay/auth/**"
      - ".github/workflows/auth.test.yml"
  pull_request:
    paths:
      - "agentpay/auth/**"
      - ".github/workflows/auth.test.yml"

jobs:
  auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/auth
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck
