name: test / ts

on:
  push:
    branches: [main]
    paths:
      - "kaji/ts/**"
      - "ryo/auth/**"
      - "packages/ui/**"
      - "kaji/contracts/**"
      - "kaji/scripts/**"
      - "kaji/benchmarks/**"
      - "kaji/RELEASE_MATRIX.md"
      - "docs/kaji/**"
      - "tools/ast-grep/**"
      - "sgconfig.yml"
      - "bun.lock"
      - "package.json"
      - "kaji/sdk/uv.lock"
      - ".github/actions/setup-bun-cache/**"
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/python.lint.yml"
      - ".github/workflows/python.format.yml"
      - ".github/workflows/python.test.yml"
      - ".github/workflows/ts.lint.yml"
      - ".github/workflows/ts.format.yml"
      - ".github/workflows/ts.test.yml"
      - ".github/workflows/ast-grep.yml"
      - ".github/workflows/kaji.benchmark.yml"
      - ".github/workflows/kaji.beta-pr.yml"
      - ".github/workflows/kaji.beta.yml"
      - ".github/workflows/kaji.beta-publish.yml"
  pull_request:
    paths:
      - "kaji/ts/**"
      - "ryo/auth/**"
      - "packages/ui/**"
      - "kaji/contracts/**"
      - "kaji/scripts/**"
      - "kaji/benchmarks/**"
      - "kaji/RELEASE_MATRIX.md"
      - "docs/kaji/**"
      - "tools/ast-grep/**"
      - "sgconfig.yml"
      - "bun.lock"
      - "package.json"
      - "kaji/sdk/uv.lock"
      - ".github/actions/setup-bun-cache/**"
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/python.lint.yml"
      - ".github/workflows/python.format.yml"
      - ".github/workflows/python.test.yml"
      - ".github/workflows/ts.lint.yml"
      - ".github/workflows/ts.format.yml"
      - ".github/workflows/ts.test.yml"
      - ".github/workflows/ast-grep.yml"
      - ".github/workflows/kaji.benchmark.yml"
      - ".github/workflows/kaji.beta-pr.yml"
      - ".github/workflows/kaji.beta.yml"
      - ".github/workflows/kaji.beta-publish.yml"

permissions:
  contents: read

jobs:
  kaji-ts:
    name: kaji/ts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kaji/ts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts
          bun-version: "1.3.11"
          install-args: --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Quickstart smoke
        run: bun run test:quickstart

      - name: Test
        run: bun run test

  kaji-ts-install-smoke:
    name: kaji/ts install smoke / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: kaji/ts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts
          bun-version: "1.3.11"
          install-args: --frozen-lockfile

      - name: Build, pack, and test installed package
        run: bun run build && bun scripts/smoke_package.mts

  auth:
    name: ryo/auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ryo/auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: ryo/auth

      - name: Typecheck
        run: bun run typecheck

  ui:
    name: packages/ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: packages/ui

      - name: Typecheck
        run: bun run typecheck
