name: test / ts

on:
  push:
    branches: [main]
    paths:
      - "kaji/ts/**"
      - "ryo/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.test.yml"
  pull_request:
    paths:
      - "kaji/ts/**"
      - "ryo/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.test.yml"

jobs:
  kaji-ts:
    name: kaji/ts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kaji/ts
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts
          bun-version: "1.3.11"
          install-args: --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Quickstart smoke
        run: bun run test:quickstart

      - name: Test
        run: bun run test

  kaji-ts-install-smoke:
    name: kaji/ts install smoke / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: kaji/ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts
          bun-version: "1.3.11"
          install-args: --frozen-lockfile

      - name: Build, pack, and test installed package
        run: bun run build && bun scripts/smoke_package.mts

  auth:
    name: ryo/auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ryo/auth
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: ryo/auth

      - name: Typecheck
        run: bun run typecheck

  ui:
    name: packages/ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: packages/ui

      - name: Typecheck
        run: bun run typecheck
