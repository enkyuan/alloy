name: test / ts

on:
  push:
    branches: [main]
    paths:
      - "agentkit/ts/**"
      - "agentpay/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.test.yml"
  pull_request:
    paths:
      - "agentkit/ts/**"
      - "agentpay/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.test.yml"

jobs:
  agentkit-ts:
    name: agentkit/ts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentkit/ts
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: agentkit/ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Quickstart smoke
        run: bun run test:quickstart

      - name: Test
        run: bun run test

  agentkit-ts-install-smoke:
    name: agentkit/ts install smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentkit/ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: agentkit/ts

      - name: Build package
        run: bun run build

      - name: Pack tarball
        run: npm pack

      - name: Install tarball in clean temp project
        run: |
          TARBALL=$(ls "$GITHUB_WORKSPACE"/agentkit/ts/agentkit-sdk-*.tgz | head -1)
          mkdir /tmp/agentkit-smoke
          cp "$GITHUB_WORKSPACE/agentkit/ts/scripts/smoke-install.mts" /tmp/agentkit-smoke/smoke-install.mts
          cd /tmp/agentkit-smoke
          npm init -y --quiet
          npm install --quiet "$TARBALL" zod
          npx --yes tsx ./smoke-install.mts

  auth:
    name: agentpay/auth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/auth
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: agentpay/auth

      - name: Typecheck
        run: bun run typecheck

  ui:
    name: packages/ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: packages/ui

      - name: Typecheck
        run: bun run typecheck
