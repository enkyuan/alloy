name: format / python

on:
  push:
    branches: [main]
    paths:
      - "agentkit/sdk/**"
      - "agentkit/serve/**"
      - ".github/workflows/format/python.yml"
  pull_request:
    paths:
      - "agentkit/sdk/**"
      - "agentkit/serve/**"
      - ".github/workflows/format/python.yml"

jobs:
  sdk:
    name: agentkit/sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentkit/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyrefly
        run: pip install pyrefly

      - name: Check formatting
        run: pyrefly check .

  serve:
    name: agentkit/serve
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentkit/serve
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyrefly
        run: pip install pyrefly

      - name: Check formatting
        run: pyrefly check .
