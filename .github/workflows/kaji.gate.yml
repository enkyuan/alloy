name: gate / kaji

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kaji-beta-pr-gate:
    name: beta release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji
          sync-args: --frozen

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: .
          bun-version: "1.3.11"
          install-args: --frozen-lockfile

      - name: Run the canonical local Kaji CI gate
        run: uv run --project kaji --no-sync python kaji/scripts/beta_release_check.py --gate
