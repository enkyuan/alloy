name: gate / kaji

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kaji-pr-gate:
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KAJI_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: .
          sync-args: --frozen

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: .
          bun-version: "1.3.11"
          install-args: --frozen-lockfile

      - name: Enforce Kaji filename conventions
        run: uv run --project kaji/packages/py --no-sync python -m kaji.tooling.quality.filenames

      - name: Run the canonical local Kaji CI gate
        run: uv run --project kaji/packages/py --no-sync python -m kaji.tooling.release.check --gate

      - name: Run Postgres EventStore integration tests
        run: |
          uv run --project kaji/packages/py --extra postgres pytest kaji/packages/py/tests/backends/test_postgres.py -q
          cd kaji/packages/ts && bun run test tests/backends/postgres.test.ts
