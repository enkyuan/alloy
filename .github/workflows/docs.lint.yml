name: lint / docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/docs.lint.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/docs.lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: apps/docs

      - name: Lint
        run: bun run lint
