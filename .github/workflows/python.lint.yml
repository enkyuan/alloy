name: lint / python

on:
  push:
    branches: [main]
    paths:
      - "kaji/**"
      - "kaji/packages/serve/**"
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/python.lint.yml"
  pull_request:
    paths:
      - "kaji/**"
      - "kaji/packages/serve/**"
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/python.lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: kaji
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kaji/packages/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: .
          # --no-editable installs kaji as a built wheel (src/ -> kaji/ remap
          # applied at install time) rather than via the runtime MetaPathFinder
          # that setuptools+editables uses for editable installs. Static type
          # checkers (ty, pyrefly, pyright) don't execute the redirector, so
          # they can only resolve `import kaji.X` against an on-disk kaji/
          # directory. The wheel install creates one in site-packages.
          # Select the kaji-sdk workspace member so its dev group (pytest,
          # jsonschema test extras, etc.) is installed — ty checks src/ AND
          # tests/, so it must resolve the test-only imports. A bare root sync
          # only pulls the root project's dev group under the uv workspace.
          sync-args: "--frozen --no-editable --package kaji-sdk"

      - name: Type check
        # Direct venv invocation (NOT `uv run`) — `uv run` re-syncs the venv
        # against the lockfile before executing, which overrides the
        # --no-editable sync done by setup-python-uv above. ty needs the
        # built-wheel install to resolve `import kaji.X` against an on-disk
        # kaji/ directory, since it doesn't read setuptools+editables'
        # runtime MetaPathFinder.
        #
        # --python pins the environment ty resolves imports against to the
        # synced root workspace venv. Without it, ty auto-discovers an
        # environment, which in the workspace layout can land on one missing
        # the kaji-sdk member's deps (pytest/pydantic/jsonschema) and fail
        # with unresolved-import even when the venv beside it is complete.
        run: ../../../.venv/bin/ty check --python ../../../.venv

      - name: Lint
        run: uv run ruff check src tests

  serve:
    name: kaji/packages/serve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kaji/packages/serve
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: .

      - name: Lint
        run: uv run ruff check src tests alembic
