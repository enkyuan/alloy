name: lint / python

on:
  push:
    branches: [main]
    paths:
      - "kaji/sdk/**"
      - "kaji/serve/**"
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/python.lint.yml"
  pull_request:
    paths:
      - "kaji/sdk/**"
      - "kaji/serve/**"
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/python.lint.yml"

jobs:
  sdk:
    name: kaji/sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kaji/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji/sdk
          # --no-editable installs kaji as a built wheel (src/ -> kaji/ remap
          # applied at install time) rather than via the runtime MetaPathFinder
          # that setuptools+editables uses for editable installs. Static type
          # checkers (ty, pyrefly, pyright) don't execute the redirector, so
          # they can only resolve `import kaji.X` against an on-disk kaji/
          # directory. The wheel install creates one in site-packages.
          sync-args: "--frozen --no-editable"

      - name: Type check
        # Direct venv invocation (NOT `uv run`) — `uv run` re-syncs the venv
        # against the lockfile before executing, which overrides the
        # --no-editable sync done by setup-python-uv above. ty needs the
        # built-wheel install to resolve `import kaji.X` against an on-disk
        # kaji/ directory, since it doesn't read setuptools+editables'
        # runtime MetaPathFinder.
        run: .venv/bin/ty check

      - name: Lint
        run: uv run ruff check src tests

  serve:
    name: kaji/serve
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kaji/serve
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji/serve

      - name: Lint
        run: uv run ruff check src tests alembic
