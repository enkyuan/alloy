name: test / python-sdk

on:
  push:
    branches: [main]
    paths:
      - "agentkit/sdk/**"
      - ".github/workflows/python-sdk.test.yml"
  pull_request:
    paths:
      - "agentkit/sdk/**"
      - ".github/workflows/python-sdk.test.yml"

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentkit/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-sdk-${{ runner.os }}-py3.11-${{ hashFiles('agentkit/sdk/poetry.lock') }}
          restore-keys: |
            poetry-sdk-${{ runner.os }}-py3.11-

      - name: Install dependencies
        run: poetry install --no-interaction --sync

      - name: Run tests
        run: poetry run pytest tests/ --cov=agentkit --cov-report=xml --cov-fail-under=35

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sdk
          path: agentkit/sdk/coverage.xml
          retention-days: 7
