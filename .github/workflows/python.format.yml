name: format / python

on:
  push:
    branches: [main]
    paths:
      - "kaji/**"
      - "kaji/packages/serve/**"
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/python.format.yml"
  pull_request:
    paths:
      - "kaji/**"
      - "kaji/packages/serve/**"
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/python.format.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: kaji
            working-directory: kaji/packages/py
          - package: kaji/packages/serve
            working-directory: kaji/packages/serve
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: .

      - name: Check formatting
        run: uv run ruff format --check .
