name: lint / ts

on:
  push:
    branches: [main]
    paths:
      - "agentkit/ts/**"
      - "agentpay/auth/**"
      - "packages/ui/**"
      - ".github/workflows/ts.lint.yml"
  pull_request:
    paths:
      - "agentkit/ts/**"
      - "agentpay/auth/**"
      - "packages/ui/**"
      - ".github/workflows/ts.lint.yml"

jobs:
  agentkit-ts:
    name: agentkit/ts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentkit/ts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  auth:
    name: agentpay/auth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/auth
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  ui:
    name: packages/ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck
