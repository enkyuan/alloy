name: lint / ts

on:
  push:
    branches: [main]
    paths:
      - "kaji/ts/**"
      - "agentpay/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.lint.yml"
  pull_request:
    paths:
      - "kaji/ts/**"
      - "agentpay/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.lint.yml"

jobs:
  kaji-ts:
    name: kaji/ts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kaji/ts
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts

      - name: Typecheck
        run: bun run typecheck

  auth:
    name: agentpay/auth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/auth
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: agentpay/auth

      - name: Typecheck
        run: bun run typecheck

  ui:
    name: packages/ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: packages/ui

      - name: Typecheck
        run: bun run typecheck
