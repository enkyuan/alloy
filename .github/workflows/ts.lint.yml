name: lint / ts

on:
  push:
    branches: [main]
    paths:
      - "kaji/ts/**"
      - "ryo/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.lint.yml"
  pull_request:
    paths:
      - "kaji/ts/**"
      - "ryo/auth/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ts.lint.yml"

permissions:
  contents: read

jobs:
  kaji-ts:
    name: kaji/ts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kaji/ts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts
          bun-version: "1.3.11"
          install-args: --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Registry typecheck
        run: bun run typecheck:registry

      - name: Validate registry
        run: bun run validate:registry

      - name: Check integrations
        run: bun run check:integrations

  auth:
    name: ryo/auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ryo/auth
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: ryo/auth

      - name: Typecheck
        run: bun run typecheck

  ui:
    name: packages/ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: packages/ui

      - name: Typecheck
        run: bun run typecheck
