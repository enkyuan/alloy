name: lint / go

on:
  push:
    branches: [main]
    paths:
      - "agentpay/api/**"
      - "agentpay/consumer/**"
      - ".github/workflows/go.lint.yml"
  pull_request:
    paths:
      - "agentpay/api/**"
      - "agentpay/consumer/**"
      - ".github/workflows/go.lint.yml"

jobs:
  api:
    name: agentpay/api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./...

  consumer:
    name: agentpay/consumer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/consumer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./...
