name: lint / go

on:
  push:
    branches: [main]
    paths:
      - "ryo/api/**"
      - "ryo/consumer/**"
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/go.lint.yml"
  pull_request:
    paths:
      - "ryo/api/**"
      - "ryo/consumer/**"
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/go.lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ryo/${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: [api, consumer]
    defaults:
      run:
        working-directory: ryo/${{ matrix.component }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-go-cache
        with:
          working-directory: ryo/${{ matrix.component }}

      - name: Vet
        run: go vet ./...
