name: lint / go

on:
  push:
    branches: [main]
    paths:
      - "agentpay/api/**"
      - "agentpay/consumer/**"
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/go.lint.yml"
  pull_request:
    paths:
      - "agentpay/api/**"
      - "agentpay/consumer/**"
      - ".github/actions/setup-go-cache/**"
      - ".github/workflows/go.lint.yml"

jobs:
  api:
    name: agentpay/api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/api
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-go-cache
        with:
          working-directory: agentpay/api

      - name: Vet
        run: go vet ./...

  consumer:
    name: agentpay/consumer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/consumer
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-go-cache
        with:
          working-directory: agentpay/consumer

      - name: Vet
        run: go vet ./...
