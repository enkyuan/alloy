name: ci

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk/**"
      - "packages/serve/**"
      - "packages/ts/**"
      - "agentpay/api/**"
      - ".github/workflows/sdk-tests.yml"
  pull_request:
    paths:
      - "packages/sdk/**"
      - "packages/serve/**"
      - "packages/ts/**"
      - "agentpay/api/**"
      - ".github/workflows/sdk-tests.yml"

jobs:
  # ─── Python SDK ────────────────────────────────────────────────────────────
  # No database, no server deps. Proves the SDK is infra-free.
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-sdk-${{ runner.os }}-py3.11-${{ hashFiles('packages/sdk/poetry.lock') }}
          restore-keys: |
            poetry-sdk-${{ runner.os }}-py3.11-

      - name: Install the SDK
        run: poetry install --no-interaction --sync

      - name: Run SDK tests
        run: poetry run pytest tests/ --cov=agentkit --cov-report=xml --cov-fail-under=35

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sdk
          path: packages/sdk/coverage.xml
          retention-days: 7

  # ─── Reference service ─────────────────────────────────────────────────────
  # Installs agentkit-serve (+ the SDK via its path dep) and runs
  # the DB- and API-backed tests against a real Postgres.
  serve:
    runs-on: ubuntu-latest
    needs: sdk

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    defaults:
      run:
        working-directory: packages/serve

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-serve-${{ runner.os }}-py3.11-${{ hashFiles('packages/serve/poetry.lock') }}
          restore-keys: |
            poetry-serve-${{ runner.os }}-py3.11-

      - name: Install agentkit-serve (+ SDK via path dep)
        run: poetry install --no-interaction --sync

      - name: Run serve tests
        run: poetry run pytest tests/ --cov=agentkit_serve --cov-report=xml --cov-fail-under=35

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-serve
          path: packages/serve/coverage.xml
          retention-days: 7

  # ─── TypeScript SDK ─────────────────────────────────────────────────────────
  ts-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test

  # ─── Go API ─────────────────────────────────────────────────────────────────
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentpay/api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agentpay/api/go.mod
          cache: true

      - name: Run migrations
        run: go run ./cmd/migrate up

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -race -count=1
