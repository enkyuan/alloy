name: sdk tests

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk/**"
      - "packages/serve/**"
      - ".github/workflows/sdk-tests.yml"
  pull_request:
    paths:
      - "packages/sdk/**"
      - "packages/serve/**"
      - ".github/workflows/sdk-tests.yml"

jobs:
  # Core SDK: no database, no server deps. Proves the SDK is infra-free.
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Minimum supported version (pyproject: python ^3.11).
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-sdk-${{ runner.os }}-py3.11-${{ hashFiles('packages/sdk/poetry.lock') }}

      - name: Install the SDK
        # Core SDK only — no server extra, no database. `import agentkit` must
        # work with no environment configured.
        run: poetry install --no-interaction

      - name: Run SDK tests
        run: poetry run pytest tests/ --cov-fail-under=35

  # Reference service: installs agentkit-serve (+ the SDK via its path dep) and
  # runs the DB- and API-backed tests against a real Postgres.
  serve:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image ships the `vector` extension the test DB needs.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    defaults:
      run:
        working-directory: packages/serve

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-serve-${{ runner.os }}-py3.11-${{ hashFiles('packages/serve/poetry.lock') }}

      - name: Install agentkit-serve (+ SDK via path dep)
        run: poetry install --no-interaction

      - name: Run serve tests
        run: poetry run pytest tests/ --cov-fail-under=35
