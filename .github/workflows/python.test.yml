name: test / python

on:
  push:
    branches: [main]
    paths:
      - "kaji/**"
      - "kaji/packages/serve/**"
      - "kaji/contracts/**"
      - "kaji/scripts/**"
      - "kaji/benchmarks/**"
      - "kaji/RELEASE_MATRIX.md"
      - "docs/kaji/**"
      - "tools/ast-grep/**"
      - "sgconfig.yml"
      - "package.json"
      - "bun.lock"
      - "uv.lock"
      - ".github/actions/setup-python-uv/**"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/python.lint.yml"
      - ".github/workflows/python.format.yml"
      - ".github/workflows/python.test.yml"
      - ".github/workflows/ts.lint.yml"
      - ".github/workflows/ts.format.yml"
      - ".github/workflows/ts.test.yml"
      - ".github/workflows/ast-grep.test.yml"
      - ".github/workflows/kaji.benchmark.yml"
      - ".github/workflows/kaji.performance.yml"
      - ".github/workflows/kaji.gate.yml"
      - ".github/workflows/kaji.rehearsal.yml"
      - ".github/workflows/kaji.publish.yml"
  pull_request:
    paths:
      - "kaji/**"
      - "kaji/packages/serve/**"
      - "kaji/contracts/**"
      - "kaji/scripts/**"
      - "kaji/benchmarks/**"
      - "kaji/RELEASE_MATRIX.md"
      - "docs/kaji/**"
      - "tools/ast-grep/**"
      - "sgconfig.yml"
      - "package.json"
      - "bun.lock"
      - "uv.lock"
      - ".github/actions/setup-python-uv/**"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/python.lint.yml"
      - ".github/workflows/python.format.yml"
      - ".github/workflows/python.test.yml"
      - ".github/workflows/ts.lint.yml"
      - ".github/workflows/ts.format.yml"
      - ".github/workflows/ts.test.yml"
      - ".github/workflows/ast-grep.test.yml"
      - ".github/workflows/kaji.benchmark.yml"
      - ".github/workflows/kaji.performance.yml"
      - ".github/workflows/kaji.gate.yml"
      - ".github/workflows/kaji.rehearsal.yml"
      - ".github/workflows/kaji.publish.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: kaji
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kaji
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/packages/ts

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: .

      - name: Run quickstart smoke
        run: uv run --project packages/py pytest packages/py/tests/test_quickstart.py -q

      - name: Run non-network tests
        run: uv run --project packages/py pytest packages/py/tests -m "not integration" --cov=kaji --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-sdk
          path: kaji/coverage.xml
          retention-days: 7

  sdk-install-smoke:
    name: kaji install smoke / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
          - python-version: "3.14"
    defaults:
      run:
        working-directory: kaji
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: .
          python-version: ${{ matrix.python-version }}

      - name: Build, verify, and install wheel and sdist
        run: |
          uv run --project packages/py --no-sync python scripts/release_smoke.py
          uv run --project packages/py --no-sync python scripts/verify_archives.py packages/py/dist

  serve:
    name: kaji/packages/serve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    defaults:
      run:
        working-directory: kaji/packages/serve
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: .

      - name: Run tests
        run: uv run pytest tests/ --cov=kaji_serve --cov-report=xml --cov-fail-under=35

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-serve
          path: kaji/packages/serve/coverage.xml
          retention-days: 7
