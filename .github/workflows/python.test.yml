name: test / python

on:
  push:
    branches: [main]
    paths:
      - "kaji/sdk/**"
      - "kaji/serve/**"
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/python.test.yml"
  pull_request:
    paths:
      - "kaji/sdk/**"
      - "kaji/serve/**"
      - ".github/actions/setup-python-uv/**"
      - ".github/workflows/python.test.yml"

jobs:
  sdk:
    name: kaji/sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kaji/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji/sdk

      - name: Run quickstart smoke
        run: uv run pytest tests/test_quickstart.py -q

      - name: Run non-network tests
        run: uv run pytest tests/ -m "not integration" --cov=kaji --cov-report=xml --cov-fail-under=35

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sdk
          path: kaji/sdk/coverage.xml
          retention-days: 7

  sdk-install-smoke:
    name: kaji/sdk install smoke / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
          - python-version: "3.14"
    defaults:
      run:
        working-directory: kaji/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji/sdk
          python-version: ${{ matrix.python-version }}

      - name: Build, verify, and install wheel and sdist
        run: |
          uv run --no-sync python scripts/release_smoke.py
          uv run --no-sync python scripts/verify_wheel.py

  serve:
    name: kaji/serve
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    defaults:
      run:
        working-directory: kaji/serve
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji/serve

      - name: Run tests
        run: uv run pytest tests/ --cov=kaji_serve --cov-report=xml --cov-fail-under=35

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-serve
          path: kaji/serve/coverage.xml
          retention-days: 7
