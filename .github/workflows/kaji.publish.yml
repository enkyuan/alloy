name: publish / kaji

on:
  push:
    tags:
      - "kaji-v*-beta.*"

permissions:
  contents: read

# A released beta version is immutable. Do not cancel or overlap work for the
# same tag, because a cross-registry publication cannot be rolled back atomically.
concurrency:
  group: kaji-beta-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag-name: ${{ steps.tag.outputs.tag-name }}
      tag-object: ${{ steps.tag.outputs.tag-object }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Verify exact signed annotated beta tag
        id: tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          EXPECTED_TAGGER_EMAIL: ${{ vars.KAJI_RELEASE_SIGNER_EMAIL }}
        with:
          script: |
            const expectedTaggerEmail = process.env.EXPECTED_TAGGER_EMAIL;
            if (!expectedTaggerEmail) {
              throw new Error("KAJI_RELEASE_SIGNER_EMAIL must name the approved signed tagger");
            }
            if (context.payload.repository?.private !== false) {
              throw new Error(
                "npm provenance requires the source repository to be public before beta publication",
              );
            }
            const tagName = context.ref.replace("refs/tags/", "");
            if (!/^kaji-v0\.2\.0-beta\.2$/.test(tagName)) {
              throw new Error(`unexpected beta tag: ${tagName}`);
            }
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tagName}`,
            });
            if (ref.data.object.type !== "tag") {
              throw new Error("beta tag must be annotated");
            }
            const tagObject = ref.data.object.sha;
            const tag = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: tagObject,
            });
            const verification = tag.data.verification;
            if (!verification || !verification.verified || verification.reason !== "valid") {
              throw new Error("beta tag signature is not verified");
            }
            if (tag.data.tag !== tagName) {
              throw new Error("annotated tag payload name does not match the pushed ref");
            }
            if (tag.data.tagger?.email !== expectedTaggerEmail) {
              throw new Error("signed beta tagger is not repository-approved");
            }
            if (tag.data.object.type !== "commit") {
              throw new Error("annotated beta tag must target a commit directly");
            }
            const releaseCommit = tag.data.object.sha;
            const defaultBranch = context.payload.repository?.default_branch;
            if (!defaultBranch) {
              throw new Error("repository default branch is unavailable");
            }
            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: releaseCommit,
              head: defaultBranch,
            });
            if (comparison.data.merge_base_commit.sha !== releaseCommit) {
              throw new Error(
                "signed beta tag commit must already be contained in the default branch",
              );
            }
            core.setOutput("tag-name", tagName);
            core.setOutput("tag-object", tagObject);
            core.setOutput("commit", releaseCommit);
            core.summary
              .addHeading("Verified immutable beta tag", 2)
              .addList([
                `Tag: ${tagName}`,
                `Annotated tag object: ${tagObject}`,
                `Peeled direct commit: ${releaseCommit}`,
                `Default branch containing commit: ${defaultBranch}`,
              ]);
            await core.summary.write();

  offline-gates:
    name: offline release gates
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.release-artifacts.outputs.artifact-id }}
      artifact-digest: ${{ steps.release-artifacts.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts
          bun-version: "1.3.11"
          install-args: --frozen-lockfile
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji
          python-version: "3.14"
      - name: Run offline release gates and retain the actual summary
        id: offline
        shell: bash
        env:
          KAJI_RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: |
          mkdir -p .artifacts/kaji-offline-evidence
          set +e
          uv run --project kaji python kaji/scripts/beta_release_check.py --release \
            > >(tee .artifacts/kaji-offline-evidence/offline-gates.log) 2>&1
          status=$?
          set -e
          jq --null-input \
            --arg commit "$KAJI_RELEASE_COMMIT" \
            --arg conclusion "$([ "$status" -eq 0 ] && printf passed || printf failed)" \
            --argjson exitCode "$status" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schemaVersion: 1, commit: $commit, conclusion: $conclusion,
              exitCode: $exitCode, workflowRun: $workflowRun}' \
            >.artifacts/kaji-offline-evidence/offline-gate-summary.json
          {
            echo "## Offline release gates"
            echo
            echo "- Commit: \`$KAJI_RELEASE_COMMIT\`"
            echo "- Exit code: \`$status\`"
            echo "- Conclusion: \`$([ "$status" -eq 0 ] && printf passed || printf failed)\`"
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload offline gate/test summary
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-offline-evidence
          path: .artifacts/kaji-offline-evidence
          if-no-files-found: error
      - name: Upload exact release artifacts
        if: ${{ steps.offline.outcome == 'success' }}
        id: release-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
          if-no-files-found: error

  performance:
    name: performance evidence
    needs: [verify-tag, offline-gates]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/kaji.performance.yml
    with:
      candidate-commit: ${{ needs.verify-tag.outputs.commit }}
      candidate-artifact-id: ${{ needs.offline-gates.outputs.artifact-id }}
      candidate-artifact-digest: ${{ needs.offline-gates.outputs.artifact-digest }}

  python-compat:
    name: Python ${{ matrix.python-version }} compatibility
    needs: [verify-tag, offline-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Initialize compatibility receipt before setup
        shell: bash
        env:
          KAJI_COMPAT_RECEIPT_DIR: ${{ runner.temp }}/kaji-python-compat-${{ matrix.python-version }}
          KAJI_COMPAT_RUNTIME_VERSION: ${{ matrix.python-version }}
        run: |
          mkdir -p "$KAJI_COMPAT_RECEIPT_DIR"
          jq --null-input \
            --arg commit "$EXPECTED_COMMIT" \
            --arg version "$KAJI_COMPAT_RUNTIME_VERSION" \
            '{schemaVersion: 1, commit: $commit, conclusion: "not_run",
              failureCode: "compatibility_not_completed", runtime: {kind: "python", requestedVersion: $version},
              releaseManifestSha256: null, artifactSha256: {}, artifacts: {wheel: null, sdist: null}}' \
            >"$KAJI_COMPAT_RECEIPT_DIR/compatibility-receipt.json"
      - name: Retain initial not-run compatibility receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-python-compat-${{ matrix.python-version }}-initial
          path: ${{ runner.temp }}/kaji-python-compat-${{ matrix.python-version }}
          if-no-files-found: error
      - id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
      - id: setup_python
        uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji
          python-version: ${{ matrix.python-version }}
      - id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
      - name: Verify exact candidate artifacts before Python smoke
        id: verify
        run: >-
          python3 kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$EXPECTED_COMMIT"
      - name: Install and smoke wheel and sdist
        id: smoke
        env:
          KAJI_COMPAT_RECEIPT_DIR: ${{ runner.temp }}/kaji-python-compat-${{ matrix.python-version }}
        run: >-
          uv run --project kaji --no-sync python kaji/scripts/release_smoke.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$EXPECTED_COMMIT"
          --output "$KAJI_COMPAT_RECEIPT_DIR/compatibility-receipt.json"
      - name: Normalize compatibility receipt
        if: ${{ always() }}
        shell: bash
        env:
          KAJI_COMPAT_RECEIPT_DIR: ${{ runner.temp }}/kaji-python-compat-${{ matrix.python-version }}
          KAJI_COMPAT_RUNTIME_KIND: python
          KAJI_COMPAT_RUNTIME_VERSION: ${{ matrix.python-version }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RUNTIME_SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          DEPENDENCY_SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$KAJI_COMPAT_RECEIPT_DIR"
          receipt="$KAJI_COMPAT_RECEIPT_DIR/compatibility-receipt.json"
          temporary="$KAJI_COMPAT_RECEIPT_DIR/compatibility-receipt.tmp"
          if [ "$CHECKOUT_OUTCOME" != success ]; then
            failure_code=checkout_not_completed
          elif [ "$RUNTIME_SETUP_OUTCOME" != success ]; then
            failure_code=runtime_setup_not_completed
          elif [ "$DEPENDENCY_SETUP_OUTCOME" != success ]; then
            failure_code=dependency_setup_not_completed
          elif [ "$DOWNLOAD_OUTCOME" != success ]; then
            failure_code=artifact_download_not_completed
          elif [ "$VERIFICATION_OUTCOME" != success ]; then
            failure_code=artifact_verification_not_completed
          elif [ "$SMOKE_OUTCOME" != success ]; then
            failure_code=compatibility_smoke_not_completed
          else
            failure_code=compatibility_receipt_not_terminal
          fi
          all_success=true
          for outcome in "$CHECKOUT_OUTCOME" "$RUNTIME_SETUP_OUTCOME" \
            "$DEPENDENCY_SETUP_OUTCOME" "$DOWNLOAD_OUTCOME" \
            "$VERIFICATION_OUTCOME" "$SMOKE_OUTCOME"; do
            if [ "$outcome" != success ]; then
              all_success=false
              break
            fi
          done
          smoke_began=true
          for outcome in "$CHECKOUT_OUTCOME" "$RUNTIME_SETUP_OUTCOME" \
            "$DEPENDENCY_SETUP_OUTCOME" "$DOWNLOAD_OUTCOME" \
            "$VERIFICATION_OUTCOME"; do
            if [ "$outcome" != success ]; then
              smoke_began=false
              break
            fi
          done
          terminal=false
          if [ -f "$receipt" ] && jq -e \
            --arg commit "$EXPECTED_COMMIT" \
            --arg kind "$KAJI_COMPAT_RUNTIME_KIND" \
            --arg version "$KAJI_COMPAT_RUNTIME_VERSION" '
            def nonempty: type == "string" and length > 0;
            def sha256: type == "string" and test("^[0-9a-f]{64}$");
            def safe_nonnegative_integer:
              type == "number" and . >= 0 and . <= 9007199254740991 and
              (tojson | test("^(0|[1-9][0-9]*)$"));
            def python_timing:
              type == "object" and keys == ["coldSetupToOutputMs", "warmRunMs"] and
              all(.[]; safe_nonnegative_integer);
            def typescript_timing:
              type == "object" and keys == ["coldSetupToOutputMs", "warmRunMs"] and
              all(.[]; safe_nonnegative_integer);
            def failure_kind:
              type == "string" and . as $kind |
              ["unsupported_host", "start", "exit", "timeout", "output_limit",
               "cleanup", "capture", "shutting_down", "unknown"] |
              index($kind) != null;
            def smoke_phase:
              type == "string" and
              test("^(npm:pack|node:version|npm:audit|exports:(esm|cjs)|cli:(help|help-cjs)|docs:(compile-typescript-current|run)|workspace:cleanup|(npm|bun):((package|bootstrap|generated)-install|cli-(init|owner-conflict|owner-qualified|add|inspect|list|replay)|github-package-proof|compile-typescript-(5[.]7|current)|github-types-compiler-version-(5[.]7|current)|github-types-(esm|cjs)-typescript-(5[.]7|current)|lifecycle-run|failure-history-run|docs-getting-started-run|docs-tthw-echo-run|cold-run|warm-run)|handoff:(npm-install|bun-install|typescript57-version|typescriptCurrent-version|typescript57-esm|typescript57-cjs|typescriptCurrent-esm|typescriptCurrent-cjs|npm-github-proof|bun-github-proof|archive-list|archive-types|archive-extract|policy-before-token|node-version|npm-version|node-esm|node-commonjs))$");
            def passed_keys:
              ["artifactSha256", "artifacts", "commit", "conclusion", "failureCode",
               "githubPackageProofs", "releaseManifestSha256", "runtime", "schemaVersion",
               "timings"];
            def failed_keys:
              ["artifactSha256", "artifacts", "commit", "conclusion", "failedPhase",
               "failureCode", "failureKind", "githubPackageProofs",
               "releaseManifestSha256", "runtime", "schemaVersion"];
            def github_tools: [
              "add_comment", "create_issue", "get_file", "get_issue", "list_issues",
              "search_code", "get_commit", "get_pull_request", "list_pull_request_files",
              "list_check_runs", "get_workflow_run", "list_workflow_jobs",
              "list_file_commits", "get_release", "list_deployments"
            ];
            def github_read_tools: github_tools[2:];
            def python_github_proof:
              . == {
                schemaVersion: 1, evidenceClass: "offline_exact_artifact_smoke",
                integration: "github", runtime: "python", network: "scripted",
                liveProvider: false, contractVersion: "1.0.0", caseCount: 23,
                toolCount: 6, approvalDeniedBeforeCredentialAccess: true,
                mutationRetries: 0, unknownMutationPreserved: true,
                sourceRuntimeDetected: false, conclusion: "passed", failureCode: null
              };
            def typescript_github_proof:
              . as $proof |
              ($proof.typescriptDeclarationChecks.typescriptCurrent.version // null) as $current |
              ($current | type == "string" and
                test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\\+([0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*))?$") and . != "5.7.3") and
              $proof == {
                schemaVersion: 5, evidenceClass: "offline_exact_artifact_smoke",
                integration: "github", runtime: "typescript", network: "blocked",
                liveProvider: false, sharedAbiVersion: "1.0.0",
                packageAbiSchemaVersion: "1.0.0", packageCatalogVersion: "0.2.0",
                apiFixtureVersion: "1.0.0", sharedFixtureCaseCount: 23,
                publicScenarioCount: 15,
                packageCatalog: {
                  schemaVersion: "1.0.0", catalogVersion: "0.2.0", toolCount: 15,
                  readToolCount: 13, tools: github_tools, readTools: github_read_tools,
                  providerAliases: [github_tools[] | "github_" + .],
                  catalogNames: [github_tools[] | "github." + .]
                },
                cliCopiedCatalog: {
                  manifestVersion: "0.1.0", toolCount: 6, readToolCount: 4,
                  tools: github_tools[0:6], readTools: github_read_tools[0:4]
                },
                esmSharedAbiMatched: true, cjsSharedAbiMatched: true,
                esmPackageAbiMatched: true, cjsPackageAbiMatched: true,
                esmClassIdentityMatched: true, cjsClassIdentityMatched: true,
                esmFactoryIdentityMatched: true, cjsFactoryIdentityMatched: true,
                esmRuntimeExports: ["GitHubIntegration", "createGithubIntegration", "inspectIntegration"],
                cjsRuntimeExports: ["GitHubIntegration", "createGithubIntegration", "inspectIntegration"],
                esmDeclarationExports: ["CreateGitHubIntegrationOptions", "GitHubIntegration",
                  "createGithubIntegration", "inspectIntegration"],
                cjsDeclarationExports: ["CreateGitHubIntegrationOptions", "GitHubIntegration",
                  "createGithubIntegration", "inspectIntegration"],
                typescriptDeclarationChecks: {
                  compilerOptions: {module: "NodeNext", moduleResolution: "NodeNext", skipLibCheck: false},
                  typescript57: {version: "5.7.3", mtsImport: "passed", ctsRequire: "passed"},
                  typescriptCurrent: {version: $current, mtsImport: "passed", ctsRequire: "passed"}
                },
                privateGitHubCompositionSourcesPacked: false,
                privateGitHubCompositionSourceImportsRejected: true,
                closedCallsDeniedBeforeCredentialAccess: true,
                approvalDeniedBeforeCredentialAccess: true,
                repositoryDeniedBeforeCredentialAccess: true,
                githubCatalogEventsVerified: ["requested", "started", "failed"],
                genericSyntheticCatalogEventsVerified: ["requested", "started", "completed"],
                githubFailureRecovery: {error_code: "INTEGRATION_AUTH_REQUIRED",
                  reason_code: "github_token_missing", recovery_code: "CONFIGURE_GITHUB_TOKEN",
                  doc_url: "https://kaji.dev/docs/integrations/recovery-v1#github-token"},
                githubObservabilitySinksVerified: true,
                unknownMutationPreserved: true, mutationRetries: 0,
                lifecycle: {
                  githubFailure: {stages: ["requested", "started", "failed"],
                    providerAlias: "github_get_file", catalogName: "github.get_file",
                    sameIdentityAtEveryStage: true},
                  syntheticCompletion: {stages: ["requested", "started", "completed"],
                    providerAlias: "synthetic_complete", catalogName: "synthetic.complete",
                    sameIdentityAtEveryStage: true}
                },
                policyBeforeRequest: {testFile: "kaji/ts/tests/github-registry.test.ts",
                  testName: "rejects approval for github_create_issue before token or HTTP",
                  tokenLookups: 0, requestAttempts: 0},
                aliasCollisionRejected: true, conclusion: "passed", failureCode: null
              };
            def github_proof($runtime):
              if $runtime == "python" then python_github_proof
              elif $runtime == "typescript" then typescript_github_proof
              else false end;
            (.schemaVersion == 1) and (.commit == $commit) and (
              (.conclusion == "failed" and (keys == failed_keys) and
               (.failureCode == "artifact_identity_failed" or
                .failureCode == "node_smoke_failed") and
               (.failedPhase | smoke_phase) and (.failureKind | failure_kind)) or
              (.conclusion == "passed" and (keys == passed_keys) and .failureCode == null and
               (.releaseManifestSha256 | sha256) and (
                if $kind == "python" then
                  (.artifactSha256 |
                    type == "object" and
                    keys == ["kaji_sdk-0.2.0b1-py3-none-any.whl", "kaji_sdk-0.2.0b1.tar.gz"] and
                    all(.[]; sha256)) and
                  (.runtime |
                    type == "object" and
                    (.implementation | nonempty) and
                    (.version | nonempty and startswith($version + ".")) and
                    (.executable | nonempty)) and
                  (.artifacts |
                    type == "object" and
                    (.wheel | nonempty) and
                    (.sdist | nonempty)) and
                  (.githubPackageProofs |
                    type == "object" and keys == ["sdist", "wheel"] and
                    (.sdist | github_proof("python")) and
                    (.wheel | github_proof("python"))) and
                  (.timings |
                    type == "object" and keys == ["sdist", "wheel"] and
                    all(.[]; python_timing))
                else
                  (.artifactSha256 |
                    type == "object" and
                    keys == ["kaji-sdk-0.2.0-beta.2.tgz"] and
                    all(.[]; sha256)) and
                  (.runtime |
                    type == "object" and
                    (.version | nonempty and startswith("v" + $version + "."))) and
                  (.artifacts |
                    type == "object" and
                    (.tarball | nonempty) and
                    (.package | nonempty)) and
                  (.githubPackageProofs |
                    type == "object" and keys == ["bun", "npm"] and
                    (.bun == .npm) and
                    (.bun | github_proof("typescript")) and
                    (.npm | github_proof("typescript"))) and
                  (.timings |
                    type == "object" and keys == ["bun", "npm"] and
                    all(.[]; typescript_timing))
                end
              ))
            )
          ' "$receipt" >/dev/null; then
            terminal=true
          fi
          if [ "$terminal" = true ] && [ "$all_success" != true ] && \
            [ "$(jq -r '.conclusion' "$receipt")" = passed ]; then
            terminal=false
          fi
          if [ "$terminal" = true ] && \
            [ "$(jq -r '.conclusion' "$receipt")" = failed ]; then
            jq --null-input \
              --arg commit "$EXPECTED_COMMIT" \
              --arg failureCode "$(jq -r '.failureCode' "$receipt")" \
              --arg failedPhase "$(jq -r '.failedPhase' "$receipt")" \
              --arg failureKind "$(jq -r '.failureKind' "$receipt")" \
              --arg kind "$KAJI_COMPAT_RUNTIME_KIND" \
              --arg version "$KAJI_COMPAT_RUNTIME_VERSION" \
              '{schemaVersion: 1, commit: $commit, conclusion: "failed",
                failureCode: $failureCode, failedPhase: $failedPhase,
                failureKind: $failureKind,
                runtime: {kind: $kind, requestedVersion: $version},
                releaseManifestSha256: null, artifactSha256: {}, artifacts: {},
                githubPackageProofs: {}}' >"$temporary"
            mv "$temporary" "$receipt"
          elif [ "$terminal" != true ]; then
            if [ "$smoke_began" = true ]; then
              jq --null-input \
                --arg commit "$EXPECTED_COMMIT" \
                --arg kind "$KAJI_COMPAT_RUNTIME_KIND" \
                --arg version "$KAJI_COMPAT_RUNTIME_VERSION" \
                '{schemaVersion: 1, commit: $commit, conclusion: "not_run",
                  failureCode: "compatibility_receipt_not_terminal",
                  runtime: {kind: $kind, requestedVersion: $version},
                  releaseManifestSha256: null, artifactSha256: {}, artifacts: {},
                  githubPackageProofs: {}}' >"$temporary"
            else
              jq --null-input \
                --arg commit "$EXPECTED_COMMIT" \
                --arg failureCode "$failure_code" \
                --arg kind "$KAJI_COMPAT_RUNTIME_KIND" \
                --arg version "$KAJI_COMPAT_RUNTIME_VERSION" \
                '{schemaVersion: 1, commit: $commit, conclusion: "failed",
                  failureCode: $failureCode, failedPhase: null, failureKind: "unknown",
                  runtime: {kind: $kind, requestedVersion: $version},
                  releaseManifestSha256: null, artifactSha256: {}, artifacts: {},
                  githubPackageProofs: {}}' >"$temporary"
            fi
            mv "$temporary" "$receipt"
          fi
          jq \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            '. + {workflowRun: $workflowRun, workflowRunAttempt: $workflowRunAttempt}' \
            "$receipt" >"$temporary"
          mv "$temporary" "$receipt"
          if [ "$all_success" = true ] && [ "$(jq -r '.conclusion' "$receipt")" != passed ]; then
            echo "compatibility steps succeeded without a passed terminal receipt" >&2
            exit 1
          fi
          if [ "$smoke_began" = true ] && [ "$terminal" != true ]; then
            echo "compatibility smoke ran without classified terminal evidence" >&2
            exit 1
          fi
      - name: Retain final compatibility receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-python-compat-${{ matrix.python-version }}
          path: ${{ runner.temp }}/kaji-python-compat-${{ matrix.python-version }}
          if-no-files-found: error

  node-compat:
    name: Node ${{ matrix.node-version }} compatibility
    needs: [verify-tag, offline-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Initialize compatibility receipt before setup
        shell: bash
        env:
          KAJI_COMPAT_RECEIPT_DIR: ${{ runner.temp }}/kaji-node-compat-${{ matrix.node-version }}
          KAJI_COMPAT_RUNTIME_VERSION: ${{ matrix.node-version }}
        run: |
          mkdir -p "$KAJI_COMPAT_RECEIPT_DIR"
          jq --null-input \
            --arg commit "$EXPECTED_COMMIT" \
            --arg version "$KAJI_COMPAT_RUNTIME_VERSION" \
            '{schemaVersion: 1, commit: $commit, conclusion: "not_run",
              failureCode: "compatibility_not_completed", runtime: {kind: "node", requestedVersion: $version},
              releaseManifestSha256: null, artifactSha256: {}, artifacts: {tarball: null, package: null}}' \
            >"$KAJI_COMPAT_RECEIPT_DIR/compatibility-receipt.json"
      - name: Retain initial not-run compatibility receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-node-compat-${{ matrix.node-version }}-initial
          path: ${{ runner.temp }}/kaji-node-compat-${{ matrix.node-version }}
          if-no-files-found: error
      - id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
      - id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - id: setup_bun
        uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts
          bun-version: "1.3.11"
          install-args: --frozen-lockfile
      - id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
      - name: Verify exact candidate artifacts before Node smoke
        id: verify
        run: >-
          python3 kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$EXPECTED_COMMIT"
      - name: Install and smoke ESM and CommonJS
        id: smoke
        env:
          KAJI_COMPAT_RECEIPT_DIR: ${{ runner.temp }}/kaji-node-compat-${{ matrix.node-version }}
        run: >-
          bun kaji/ts/scripts/smoke_package.mts
          .artifacts/kaji-release/kaji-sdk-0.2.0-beta.2.tgz
          --release-manifest .artifacts/kaji-release/manifest.json
          --expected-commit "$EXPECTED_COMMIT"
          --output "$KAJI_COMPAT_RECEIPT_DIR/compatibility-receipt.json"
      - name: Normalize compatibility receipt
        if: ${{ always() }}
        shell: bash
        env:
          KAJI_COMPAT_RECEIPT_DIR: ${{ runner.temp }}/kaji-node-compat-${{ matrix.node-version }}
          KAJI_COMPAT_RUNTIME_KIND: node
          KAJI_COMPAT_RUNTIME_VERSION: ${{ matrix.node-version }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RUNTIME_SETUP_OUTCOME: ${{ steps.setup_node.outcome }}
          DEPENDENCY_SETUP_OUTCOME: ${{ steps.setup_bun.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$KAJI_COMPAT_RECEIPT_DIR"
          receipt="$KAJI_COMPAT_RECEIPT_DIR/compatibility-receipt.json"
          temporary="$KAJI_COMPAT_RECEIPT_DIR/compatibility-receipt.tmp"
          if [ "$CHECKOUT_OUTCOME" != success ]; then
            failure_code=checkout_not_completed
          elif [ "$RUNTIME_SETUP_OUTCOME" != success ]; then
            failure_code=runtime_setup_not_completed
          elif [ "$DEPENDENCY_SETUP_OUTCOME" != success ]; then
            failure_code=dependency_setup_not_completed
          elif [ "$DOWNLOAD_OUTCOME" != success ]; then
            failure_code=artifact_download_not_completed
          elif [ "$VERIFICATION_OUTCOME" != success ]; then
            failure_code=artifact_verification_not_completed
          elif [ "$SMOKE_OUTCOME" != success ]; then
            failure_code=compatibility_smoke_not_completed
          else
            failure_code=compatibility_receipt_not_terminal
          fi
          all_success=true
          for outcome in "$CHECKOUT_OUTCOME" "$RUNTIME_SETUP_OUTCOME" \
            "$DEPENDENCY_SETUP_OUTCOME" "$DOWNLOAD_OUTCOME" \
            "$VERIFICATION_OUTCOME" "$SMOKE_OUTCOME"; do
            if [ "$outcome" != success ]; then
              all_success=false
              break
            fi
          done
          smoke_began=true
          for outcome in "$CHECKOUT_OUTCOME" "$RUNTIME_SETUP_OUTCOME" \
            "$DEPENDENCY_SETUP_OUTCOME" "$DOWNLOAD_OUTCOME" \
            "$VERIFICATION_OUTCOME"; do
            if [ "$outcome" != success ]; then
              smoke_began=false
              break
            fi
          done
          terminal=false
          if [ -f "$receipt" ] && jq -e \
            --arg commit "$EXPECTED_COMMIT" \
            --arg kind "$KAJI_COMPAT_RUNTIME_KIND" \
            --arg version "$KAJI_COMPAT_RUNTIME_VERSION" '
            def nonempty: type == "string" and length > 0;
            def sha256: type == "string" and test("^[0-9a-f]{64}$");
            def safe_nonnegative_integer:
              type == "number" and . >= 0 and . <= 9007199254740991 and
              (tojson | test("^(0|[1-9][0-9]*)$"));
            def python_timing:
              type == "object" and keys == ["coldSetupToOutputMs", "warmRunMs"] and
              all(.[]; safe_nonnegative_integer);
            def typescript_timing:
              type == "object" and keys == ["coldSetupToOutputMs", "warmRunMs"] and
              all(.[]; safe_nonnegative_integer);
            def failure_kind:
              type == "string" and . as $kind |
              ["unsupported_host", "start", "exit", "timeout", "output_limit",
               "cleanup", "capture", "shutting_down", "unknown"] |
              index($kind) != null;
            def smoke_phase:
              type == "string" and
              test("^(npm:pack|node:version|npm:audit|exports:(esm|cjs)|cli:(help|help-cjs)|docs:(compile-typescript-current|run)|workspace:cleanup|(npm|bun):((package|bootstrap|generated)-install|cli-(init|owner-conflict|owner-qualified|add|inspect|list|replay)|github-package-proof|compile-typescript-(5[.]7|current)|github-types-compiler-version-(5[.]7|current)|github-types-(esm|cjs)-typescript-(5[.]7|current)|lifecycle-run|failure-history-run|docs-getting-started-run|docs-tthw-echo-run|cold-run|warm-run)|handoff:(npm-install|bun-install|typescript57-version|typescriptCurrent-version|typescript57-esm|typescript57-cjs|typescriptCurrent-esm|typescriptCurrent-cjs|npm-github-proof|bun-github-proof|archive-list|archive-types|archive-extract|policy-before-token|node-version|npm-version|node-esm|node-commonjs))$");
            def passed_keys:
              ["artifactSha256", "artifacts", "commit", "conclusion", "failureCode",
               "githubPackageProofs", "releaseManifestSha256", "runtime", "schemaVersion",
               "timings"];
            def failed_keys:
              ["artifactSha256", "artifacts", "commit", "conclusion", "failedPhase",
               "failureCode", "failureKind", "githubPackageProofs",
               "releaseManifestSha256", "runtime", "schemaVersion"];
            def github_tools: [
              "add_comment", "create_issue", "get_file", "get_issue", "list_issues",
              "search_code", "get_commit", "get_pull_request", "list_pull_request_files",
              "list_check_runs", "get_workflow_run", "list_workflow_jobs",
              "list_file_commits", "get_release", "list_deployments"
            ];
            def github_read_tools: github_tools[2:];
            def python_github_proof:
              . == {
                schemaVersion: 1, evidenceClass: "offline_exact_artifact_smoke",
                integration: "github", runtime: "python", network: "scripted",
                liveProvider: false, contractVersion: "1.0.0", caseCount: 23,
                toolCount: 6, approvalDeniedBeforeCredentialAccess: true,
                mutationRetries: 0, unknownMutationPreserved: true,
                sourceRuntimeDetected: false, conclusion: "passed", failureCode: null
              };
            def typescript_github_proof:
              . as $proof |
              ($proof.typescriptDeclarationChecks.typescriptCurrent.version // null) as $current |
              ($current | type == "string" and
                test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\\+([0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*))?$") and . != "5.7.3") and
              $proof == {
                schemaVersion: 5, evidenceClass: "offline_exact_artifact_smoke",
                integration: "github", runtime: "typescript", network: "blocked",
                liveProvider: false, sharedAbiVersion: "1.0.0",
                packageAbiSchemaVersion: "1.0.0", packageCatalogVersion: "0.2.0",
                apiFixtureVersion: "1.0.0", sharedFixtureCaseCount: 23,
                publicScenarioCount: 15,
                packageCatalog: {
                  schemaVersion: "1.0.0", catalogVersion: "0.2.0", toolCount: 15,
                  readToolCount: 13, tools: github_tools, readTools: github_read_tools,
                  providerAliases: [github_tools[] | "github_" + .],
                  catalogNames: [github_tools[] | "github." + .]
                },
                cliCopiedCatalog: {
                  manifestVersion: "0.1.0", toolCount: 6, readToolCount: 4,
                  tools: github_tools[0:6], readTools: github_read_tools[0:4]
                },
                esmSharedAbiMatched: true, cjsSharedAbiMatched: true,
                esmPackageAbiMatched: true, cjsPackageAbiMatched: true,
                esmClassIdentityMatched: true, cjsClassIdentityMatched: true,
                esmFactoryIdentityMatched: true, cjsFactoryIdentityMatched: true,
                esmRuntimeExports: ["GitHubIntegration", "createGithubIntegration", "inspectIntegration"],
                cjsRuntimeExports: ["GitHubIntegration", "createGithubIntegration", "inspectIntegration"],
                esmDeclarationExports: ["CreateGitHubIntegrationOptions", "GitHubIntegration",
                  "createGithubIntegration", "inspectIntegration"],
                cjsDeclarationExports: ["CreateGitHubIntegrationOptions", "GitHubIntegration",
                  "createGithubIntegration", "inspectIntegration"],
                typescriptDeclarationChecks: {
                  compilerOptions: {module: "NodeNext", moduleResolution: "NodeNext", skipLibCheck: false},
                  typescript57: {version: "5.7.3", mtsImport: "passed", ctsRequire: "passed"},
                  typescriptCurrent: {version: $current, mtsImport: "passed", ctsRequire: "passed"}
                },
                privateGitHubCompositionSourcesPacked: false,
                privateGitHubCompositionSourceImportsRejected: true,
                closedCallsDeniedBeforeCredentialAccess: true,
                approvalDeniedBeforeCredentialAccess: true,
                repositoryDeniedBeforeCredentialAccess: true,
                githubCatalogEventsVerified: ["requested", "started", "failed"],
                genericSyntheticCatalogEventsVerified: ["requested", "started", "completed"],
                githubFailureRecovery: {error_code: "INTEGRATION_AUTH_REQUIRED",
                  reason_code: "github_token_missing", recovery_code: "CONFIGURE_GITHUB_TOKEN",
                  doc_url: "https://kaji.dev/docs/integrations/recovery-v1#github-token"},
                githubObservabilitySinksVerified: true,
                unknownMutationPreserved: true, mutationRetries: 0,
                lifecycle: {
                  githubFailure: {stages: ["requested", "started", "failed"],
                    providerAlias: "github_get_file", catalogName: "github.get_file",
                    sameIdentityAtEveryStage: true},
                  syntheticCompletion: {stages: ["requested", "started", "completed"],
                    providerAlias: "synthetic_complete", catalogName: "synthetic.complete",
                    sameIdentityAtEveryStage: true}
                },
                policyBeforeRequest: {testFile: "kaji/ts/tests/github-registry.test.ts",
                  testName: "rejects approval for github_create_issue before token or HTTP",
                  tokenLookups: 0, requestAttempts: 0},
                aliasCollisionRejected: true, conclusion: "passed", failureCode: null
              };
            def github_proof($runtime):
              if $runtime == "python" then python_github_proof
              elif $runtime == "typescript" then typescript_github_proof
              else false end;
            (.schemaVersion == 1) and (.commit == $commit) and (
              (.conclusion == "failed" and (keys == failed_keys) and
               (.failureCode == "artifact_identity_failed" or
                .failureCode == "node_smoke_failed") and
               (.failedPhase | smoke_phase) and (.failureKind | failure_kind)) or
              (.conclusion == "passed" and (keys == passed_keys) and .failureCode == null and
               (.releaseManifestSha256 | sha256) and (
                if $kind == "python" then
                  (.artifactSha256 |
                    type == "object" and
                    keys == ["kaji_sdk-0.2.0b1-py3-none-any.whl", "kaji_sdk-0.2.0b1.tar.gz"] and
                    all(.[]; sha256)) and
                  (.runtime |
                    type == "object" and
                    (.implementation | nonempty) and
                    (.version | nonempty and startswith($version + ".")) and
                    (.executable | nonempty)) and
                  (.artifacts |
                    type == "object" and
                    (.wheel | nonempty) and
                    (.sdist | nonempty)) and
                  (.githubPackageProofs |
                    type == "object" and keys == ["sdist", "wheel"] and
                    (.sdist | github_proof("python")) and
                    (.wheel | github_proof("python"))) and
                  (.timings |
                    type == "object" and keys == ["sdist", "wheel"] and
                    all(.[]; python_timing))
                else
                  (.artifactSha256 |
                    type == "object" and
                    keys == ["kaji-sdk-0.2.0-beta.2.tgz"] and
                    all(.[]; sha256)) and
                  (.runtime |
                    type == "object" and
                    (.version | nonempty and startswith("v" + $version + "."))) and
                  (.artifacts |
                    type == "object" and
                    (.tarball | nonempty) and
                    (.package | nonempty)) and
                  (.githubPackageProofs |
                    type == "object" and keys == ["bun", "npm"] and
                    (.bun == .npm) and
                    (.bun | github_proof("typescript")) and
                    (.npm | github_proof("typescript"))) and
                  (.timings |
                    type == "object" and keys == ["bun", "npm"] and
                    all(.[]; typescript_timing))
                end
              ))
            )
          ' "$receipt" >/dev/null; then
            terminal=true
          fi
          if [ "$terminal" = true ] && [ "$all_success" != true ] && \
            [ "$(jq -r '.conclusion' "$receipt")" = passed ]; then
            terminal=false
          fi
          if [ "$terminal" = true ] && \
            [ "$(jq -r '.conclusion' "$receipt")" = failed ]; then
            jq --null-input \
              --arg commit "$EXPECTED_COMMIT" \
              --arg failureCode "$(jq -r '.failureCode' "$receipt")" \
              --arg failedPhase "$(jq -r '.failedPhase' "$receipt")" \
              --arg failureKind "$(jq -r '.failureKind' "$receipt")" \
              --arg kind "$KAJI_COMPAT_RUNTIME_KIND" \
              --arg version "$KAJI_COMPAT_RUNTIME_VERSION" \
              '{schemaVersion: 1, commit: $commit, conclusion: "failed",
                failureCode: $failureCode, failedPhase: $failedPhase,
                failureKind: $failureKind,
                runtime: {kind: $kind, requestedVersion: $version},
                releaseManifestSha256: null, artifactSha256: {}, artifacts: {},
                githubPackageProofs: {}}' >"$temporary"
            mv "$temporary" "$receipt"
          elif [ "$terminal" != true ]; then
            if [ "$smoke_began" = true ]; then
              jq --null-input \
                --arg commit "$EXPECTED_COMMIT" \
                --arg kind "$KAJI_COMPAT_RUNTIME_KIND" \
                --arg version "$KAJI_COMPAT_RUNTIME_VERSION" \
                '{schemaVersion: 1, commit: $commit, conclusion: "not_run",
                  failureCode: "compatibility_receipt_not_terminal",
                  runtime: {kind: $kind, requestedVersion: $version},
                  releaseManifestSha256: null, artifactSha256: {}, artifacts: {},
                  githubPackageProofs: {}}' >"$temporary"
            else
              jq --null-input \
                --arg commit "$EXPECTED_COMMIT" \
                --arg failureCode "$failure_code" \
                --arg kind "$KAJI_COMPAT_RUNTIME_KIND" \
                --arg version "$KAJI_COMPAT_RUNTIME_VERSION" \
                '{schemaVersion: 1, commit: $commit, conclusion: "failed",
                  failureCode: $failureCode, failedPhase: null, failureKind: "unknown",
                  runtime: {kind: $kind, requestedVersion: $version},
                  releaseManifestSha256: null, artifactSha256: {}, artifacts: {},
                  githubPackageProofs: {}}' >"$temporary"
            fi
            mv "$temporary" "$receipt"
          fi
          jq \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            '. + {workflowRun: $workflowRun, workflowRunAttempt: $workflowRunAttempt}' \
            "$receipt" >"$temporary"
          mv "$temporary" "$receipt"
          if [ "$all_success" = true ] && [ "$(jq -r '.conclusion' "$receipt")" != passed ]; then
            echo "compatibility steps succeeded without a passed terminal receipt" >&2
            exit 1
          fi
          if [ "$smoke_began" = true ] && [ "$terminal" != true ]; then
            echo "compatibility smoke ran without classified terminal evidence" >&2
            exit 1
          fi
      - name: Retain final compatibility receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-node-compat-${{ matrix.node-version }}
          path: ${{ runner.temp }}/kaji-node-compat-${{ matrix.node-version }}
          if-no-files-found: error

  tthw-evidence:
    name: time-to-hello-world evidence
    needs: [verify-tag, offline-gates]
    if: ${{ always() && github.run_attempt == 1 && needs.verify-tag.result == 'success' && needs.offline-gates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kaji-beta
    env:
      KAJI_RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
    steps:
      - name: Initialize exact-commit TTHW status before setup
        shell: bash
        env:
          KAJI_TTHW_EVIDENCE_DIR: ${{ runner.temp }}/kaji-tthw-evidence
        run: |
          mkdir -p "$KAJI_TTHW_EVIDENCE_DIR"
          echo "TTHW validation did not start." >"$KAJI_TTHW_EVIDENCE_DIR/validation.log"
          jq --null-input \
            --arg commit "$KAJI_RELEASE_COMMIT" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            '{schemaVersion: 1, commit: $commit, conclusion: "not_run",
              failureCode: "tthw_not_completed", exitCode: null,
              releaseManifestSha256: null, artifactSha256: {}, workflowRun: $workflowRun,
              workflowRunAttempt: $workflowRunAttempt}' \
            >"$KAJI_TTHW_EVIDENCE_DIR/status.json"
      - name: Retain initial not-run TTHW status before setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-tthw-evidence-initial
          path: ${{ runner.temp }}/kaji-tthw-evidence
          if-no-files-found: error
      - id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
      - id: setup_python
        uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji
          python-version: "3.14"
      - id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
      - name: Revalidate exact current-run artifacts before TTHW validation
        id: verify
        env:
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: >-
          python3 kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$EXPECTED_COMMIT"
      - name: Validate protected exact-commit five-user TTHW evidence
        id: tthw
        shell: bash
        env:
          KAJI_TTHW_EVIDENCE_DIR: ${{ runner.temp }}/kaji-tthw-evidence
          KAJI_TTHW_EVIDENCE_JSON: ${{ secrets.KAJI_TTHW_EVIDENCE_JSON }}
        run: |
          raw_evidence="$RUNNER_TEMP/kaji-tthw-evidence.raw.json"
          trap 'rm -f "$raw_evidence"' EXIT
          printf '%s' "$KAJI_TTHW_EVIDENCE_JSON" >"$raw_evidence"
          set +e
          uv run --project kaji --no-sync python kaji/scripts/validate_tthw_evidence.py \
            "$raw_evidence" \
            --release-manifest .artifacts/kaji-release/manifest.json \
            --artifacts-dir .artifacts/kaji-release \
            > >(tee "$KAJI_TTHW_EVIDENCE_DIR/validation.log") 2>&1
          status=$?
          set -e
          manifest_sha="$(sha256sum .artifacts/kaji-release/manifest.json | cut -d ' ' -f 1)"
          artifact_hashes='{}'
          if [ "$status" -eq 0 ]; then
            cp "$raw_evidence" "$KAJI_TTHW_EVIDENCE_DIR/tthw-evidence.json"
            artifact_hashes="$(jq -c '.artifacts | map({key: .name, value: .sha256}) | from_entries' "$raw_evidence")"
          fi
          jq --null-input \
            --arg commit "$KAJI_RELEASE_COMMIT" \
            --arg conclusion "$([ "$status" -eq 0 ] && printf passed || printf failed)" \
            --argjson exitCode "$status" \
            --arg releaseManifestSha256 "$manifest_sha" \
            --argjson artifactSha256 "$artifact_hashes" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            '{schemaVersion: 1, commit: $commit, conclusion: $conclusion,
              failureCode: (if $exitCode == 0 then null else "tthw_validation_failed" end),
              exitCode: $exitCode, releaseManifestSha256: $releaseManifestSha256,
              artifactSha256: $artifactSha256, workflowRun: $workflowRun,
              workflowRunAttempt: $workflowRunAttempt}' \
            >"$KAJI_TTHW_EVIDENCE_DIR/status.json"
          exit "$status"
      - name: Normalize terminal TTHW status
        if: ${{ always() }}
        shell: bash
        env:
          KAJI_TTHW_EVIDENCE_DIR: ${{ runner.temp }}/kaji-tthw-evidence
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RUNTIME_SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
          TTHW_OUTCOME: ${{ steps.tthw.outcome }}
        run: |
          set -euo pipefail
          receipt="$KAJI_TTHW_EVIDENCE_DIR/status.json"
          temporary="$KAJI_TTHW_EVIDENCE_DIR/status.tmp"
          if [ "$CHECKOUT_OUTCOME" != success ]; then
            failure_code=checkout_not_completed
          elif [ "$RUNTIME_SETUP_OUTCOME" != success ]; then
            failure_code=runtime_setup_not_completed
          elif [ "$DOWNLOAD_OUTCOME" != success ]; then
            failure_code=artifact_download_not_completed
          elif [ "$VERIFICATION_OUTCOME" != success ]; then
            failure_code=artifact_verification_not_completed
          elif [ "$TTHW_OUTCOME" != success ]; then
            failure_code=tthw_validation_not_completed
          else
            failure_code=tthw_receipt_not_terminal
          fi
          if [ "$CHECKOUT_OUTCOME" = success ] && [ "$RUNTIME_SETUP_OUTCOME" = success ] && \
            [ "$DOWNLOAD_OUTCOME" = success ] && [ "$VERIFICATION_OUTCOME" = success ] && \
            [ "$TTHW_OUTCOME" = success ] && jq -e \
              --arg commit "$KAJI_RELEASE_COMMIT" \
              '.schemaVersion == 1 and .commit == $commit and .conclusion == "passed" and
               .failureCode == null and .exitCode == 0' "$receipt" >/dev/null; then
            exit 0
          fi
          if [ -f "$receipt" ] && jq -e --arg commit "$KAJI_RELEASE_COMMIT" \
            'type == "object" and .schemaVersion == 1 and .commit == $commit' \
            "$receipt" >/dev/null; then
            jq --arg failureCode "$failure_code" \
              --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
              '. + {conclusion: "failed", failureCode: $failureCode,
                    workflowRun: $workflowRun, workflowRunAttempt: $workflowRunAttempt}' \
              "$receipt" >"$temporary"
          else
            jq --null-input --arg commit "$KAJI_RELEASE_COMMIT" \
              --arg failureCode "$failure_code" \
              --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
              '{schemaVersion: 1, commit: $commit, conclusion: "failed",
                failureCode: $failureCode, exitCode: null, releaseManifestSha256: null,
                artifactSha256: {}, workflowRun: $workflowRun,
                workflowRunAttempt: $workflowRunAttempt}' >"$temporary"
          fi
          mv "$temporary" "$receipt"
          if [ "$TTHW_OUTCOME" = success ]; then
            echo "TTHW validation succeeded without a passed terminal receipt" >&2
            exit 1
          fi
      - name: Retain exact-commit TTHW evidence and status
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-tthw-evidence
          path: ${{ runner.temp }}/kaji-tthw-evidence
          if-no-files-found: error

  keyed-proof:
    name: keyed provider proof
    needs: [verify-tag, offline-gates, performance, tthw-evidence, python-compat, node-compat]
    if: ${{ always() && needs.verify-tag.result == 'success' && needs.offline-gates.result == 'success' && needs.performance.result == 'success' && needs.tthw-evidence.result == 'success' && needs.python-compat.result == 'success' && needs.node-compat.result == 'success' }}
    runs-on: ubuntu-latest
    # Four proofs are capped at three minutes each. Thirty minutes leaves setup
    # and final evidence upload outside the child-process budget.
    timeout-minutes: 30
    environment: kaji-beta
    env:
      KAJI_RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
      KAJI_RELEASE_ARTIFACT_ID: ${{ needs.offline-gates.outputs.artifact-id }}
      KAJI_RELEASE_ARTIFACT_DIGEST: ${{ needs.offline-gates.outputs.artifact-digest }}
      KAJI_PROVIDER_STATUS_FILE: ${{ github.workspace }}/provider-evidence.json
    steps:
      - name: Initialize exact-commit provider evidence before setup
        shell: bash
        env:
          KAJI_INITIAL_PROVIDER_STATUS_FILE: ${{ runner.temp }}/provider-evidence.initial.json
        run: |
          jq --null-input --arg commit "$KAJI_RELEASE_COMMIT" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg releaseArtifactId "$KAJI_RELEASE_ARTIFACT_ID" \
            --arg releaseArtifactDigest "$KAJI_RELEASE_ARTIFACT_DIGEST" \
            '{schemaVersion: 1, commit: $commit, conclusion: "not_run",
              failureCode: "provider_proof_not_completed", workflowRun: $workflowRun,
              workflowRunAttempt: $workflowRunAttempt, releaseArtifactId: $releaseArtifactId,
              releaseArtifactDigest: $releaseArtifactDigest,
              proofs: [
                {sdk: "python", provider: "openai", proof: "real_normalized_tool_loop", status: "not_run"},
                {sdk: "typescript", provider: "openai", proof: "real_normalized_tool_loop", status: "not_run"},
                {sdk: "python", provider: "anthropic", proof: "real_normalized_tool_loop", status: "not_run"},
                {sdk: "typescript", provider: "anthropic", proof: "real_normalized_tool_loop", status: "not_run"}
              ]}' >"$KAJI_INITIAL_PROVIDER_STATUS_FILE"
      - name: Retain initial not-run provider evidence before setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-provider-evidence-initial
          path: ${{ runner.temp }}/provider-evidence.initial.json
          if-no-files-found: error
      - id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
      - name: Restore not-run provider evidence after checkout
        if: ${{ always() }}
        env:
          KAJI_INITIAL_PROVIDER_STATUS_FILE: ${{ runner.temp }}/provider-evidence.initial.json
        run: cp "$KAJI_INITIAL_PROVIDER_STATUS_FILE" "$KAJI_PROVIDER_STATUS_FILE"
      - id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - id: setup_bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - id: setup_python
        uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji
          python-version: "3.14"
          sync-args: --frozen
      - id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
      - name: Verify exact candidate artifacts before provider proof
        id: verify
        run: >-
          python3 kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$KAJI_RELEASE_COMMIT"
      - name: Run protected provider proof
        id: provider
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          uv run --project kaji --no-sync python kaji/scripts/live_provider_proof.py
          --protected --artifacts-dir .artifacts/kaji-release
          --expected-commit "$KAJI_RELEASE_COMMIT"
      - name: Normalize terminal provider evidence
        if: ${{ always() }}
        shell: bash
        env:
          KAJI_INITIAL_PROVIDER_STATUS_FILE: ${{ runner.temp }}/provider-evidence.initial.json
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_SETUP_OUTCOME: ${{ steps.setup_node.outcome }}
          BUN_SETUP_OUTCOME: ${{ steps.setup_bun.outcome }}
          PYTHON_SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
          PROVIDER_OUTCOME: ${{ steps.provider.outcome }}
        run: |
          set -euo pipefail
          temporary="$RUNNER_TEMP/provider-evidence.tmp.json"
          if [ "$CHECKOUT_OUTCOME" != success ]; then
            failure_code=checkout_not_completed
          elif [ "$NODE_SETUP_OUTCOME" != success ] || [ "$BUN_SETUP_OUTCOME" != success ] || \
            [ "$PYTHON_SETUP_OUTCOME" != success ]; then
            failure_code=runtime_setup_not_completed
          elif [ "$DOWNLOAD_OUTCOME" != success ]; then
            failure_code=artifact_download_not_completed
          elif [ "$VERIFICATION_OUTCOME" != success ]; then
            failure_code=artifact_verification_not_completed
          elif [ "$PROVIDER_OUTCOME" != success ]; then
            failure_code=provider_proof_not_completed
          else
            failure_code=provider_receipt_not_terminal
          fi
          if [ "$CHECKOUT_OUTCOME" = success ] && [ "$NODE_SETUP_OUTCOME" = success ] && \
            [ "$BUN_SETUP_OUTCOME" = success ] && [ "$PYTHON_SETUP_OUTCOME" = success ] && \
            [ "$DOWNLOAD_OUTCOME" = success ] && [ "$VERIFICATION_OUTCOME" = success ] && \
            [ "$PROVIDER_OUTCOME" = success ] && jq -e --arg commit "$KAJI_RELEASE_COMMIT" \
              '.schemaVersion == 1 and .commit == $commit and .conclusion == "passed" and
               .failureCode == null and (.proofs | length == 4 and all(.[]; .status == "passed"))' \
              "$KAJI_PROVIDER_STATUS_FILE" >/dev/null; then
            jq --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg releaseArtifactId "$KAJI_RELEASE_ARTIFACT_ID" \
              --arg releaseArtifactDigest "$KAJI_RELEASE_ARTIFACT_DIGEST" \
              '. + {workflowRun: $workflowRun, workflowRunAttempt: $workflowRunAttempt,
                    releaseArtifactId: $releaseArtifactId,
                    releaseArtifactDigest: $releaseArtifactDigest}' \
              "$KAJI_PROVIDER_STATUS_FILE" >"$temporary"
            mv "$temporary" "$KAJI_PROVIDER_STATUS_FILE"
            exit 0
          fi
          if [ ! -f "$KAJI_PROVIDER_STATUS_FILE" ]; then
            cp "$KAJI_INITIAL_PROVIDER_STATUS_FILE" "$KAJI_PROVIDER_STATUS_FILE"
          fi
          jq --arg failureCode "$failure_code" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg releaseArtifactId "$KAJI_RELEASE_ARTIFACT_ID" \
            --arg releaseArtifactDigest "$KAJI_RELEASE_ARTIFACT_DIGEST" \
            '. + {conclusion: "failed", failureCode: $failureCode,
                  workflowRun: $workflowRun, workflowRunAttempt: $workflowRunAttempt,
                  releaseArtifactId: $releaseArtifactId,
                  releaseArtifactDigest: $releaseArtifactDigest}' \
            "$KAJI_PROVIDER_STATUS_FILE" >"$temporary"
          mv "$temporary" "$KAJI_PROVIDER_STATUS_FILE"
          if [ "$PROVIDER_OUTCOME" = success ]; then
            echo "provider proof succeeded without a passed terminal receipt" >&2
            exit 1
          fi
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-provider-evidence
          path: provider-evidence.json
          if-no-files-found: error

  supply-chain:
    name: supply-chain evidence
    needs: [verify-tag, offline-gates, performance, tthw-evidence, keyed-proof, python-compat, node-compat]
    if: ${{ always() && needs.verify-tag.result == 'success' && needs.offline-gates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji
          python-version: "3.14"
          sync-args: --frozen
      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts
          bun-version: "1.3.11"
          install-args: --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-offline-evidence
          path: .artifacts/kaji-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-provider-evidence
          path: .artifacts/kaji-evidence
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-tthw-evidence
          path: .artifacts/kaji-evidence/tthw
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-performance-evidence
          path: .artifacts/kaji-evidence
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-python-compat-3.11
          path: .artifacts/kaji-compat/python-3.11
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-python-compat-3.14
          path: .artifacts/kaji-compat/python-3.14
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-node-compat-22
          path: .artifacts/kaji-compat/node-22
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-node-compat-24
          path: .artifacts/kaji-compat/node-24
        continue-on-error: true
      - name: Uniquely name final compatibility receipts
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p .artifacts/kaji-evidence
          copy_receipt() {
            source=$1
            destination=$2
            if [ -f "$source" ]; then
              cp "$source" ".artifacts/kaji-evidence/$destination"
            fi
          }
          copy_receipt .artifacts/kaji-compat/python-3.11/compatibility-receipt.json compat-python-3.11.json
          copy_receipt .artifacts/kaji-compat/python-3.14/compatibility-receipt.json compat-python-3.14.json
          copy_receipt .artifacts/kaji-compat/node-22/compatibility-receipt.json compat-node-22.json
          copy_receipt .artifacts/kaji-compat/node-24/compatibility-receipt.json compat-node-24.json
      - name: Revalidate downloaded filenames, sizes, hashes, and commit
        env:
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: >-
          python kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$EXPECTED_COMMIT"
      - name: Rebuild and verify exact package contents against the clean checkout
        run: |
          bun --cwd kaji/ts run build
          python kaji/scripts/verify_npm_package.py \
            .artifacts/kaji-release/kaji-sdk-0.2.0-beta.2.tgz
          python3 kaji/scripts/verify_archives.py \
            .artifacts/kaji-release
      - name: Validate one canonical current-run evidence set
        id: evidence-validation
        env:
          KAJI_RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: >-
          uv run --project kaji --no-sync python kaji/scripts/validate_release_evidence.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$KAJI_RELEASE_COMMIT"
          --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
          --release-artifact-id "${{ needs.offline-gates.outputs.artifact-id }}"
          --release-artifact-digest "${{ needs.offline-gates.outputs.artifact-digest }}"
          --python-compat-311 .artifacts/kaji-evidence/compat-python-3.11.json
          --python-compat-314 .artifacts/kaji-evidence/compat-python-3.14.json
          --node-compat-22 .artifacts/kaji-evidence/compat-node-22.json
          --node-compat-24 .artifacts/kaji-evidence/compat-node-24.json
          --performance-status .artifacts/kaji-evidence/performance-status.json
          --benchmark-results .artifacts/kaji-evidence/paired-benchmark-results.json
          --soak-results .artifacts/kaji-evidence/soak-results.json
          --performance-image-data .artifacts/kaji-evidence/performance-imagedata.json
          --provider-evidence .artifacts/kaji-evidence/provider-evidence.json
          --tthw-status .artifacts/kaji-evidence/tthw/status.json
          --tthw-evidence .artifacts/kaji-evidence/tthw/tthw-evidence.json
          --workspace "$GITHUB_WORKSPACE"
          --output .artifacts/kaji-evidence/release-evidence-validation.json
      - name: Generate SBOM
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          path: .artifacts/kaji-release
          format: spdx-json
          output-file: .artifacts/kaji-evidence/sbom.spdx.json
          upload-artifact: false
      - name: Attest exact artifacts and retained evidence
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            .artifacts/kaji-release/kaji_sdk-0.2.0b1-py3-none-any.whl
            .artifacts/kaji-release/kaji_sdk-0.2.0b1.tar.gz
            .artifacts/kaji-release/kaji-sdk-0.2.0-beta.2.tgz
            .artifacts/kaji-release/manifest.json
            .artifacts/kaji-release/SHA256SUMS
            .artifacts/kaji-evidence/offline-gates.log
            .artifacts/kaji-evidence/offline-gate-summary.json
            .artifacts/kaji-evidence/provider-evidence.json
            .artifacts/kaji-evidence/tthw/status.json
            .artifacts/kaji-evidence/tthw/validation.log
            .artifacts/kaji-evidence/tthw/tthw-evidence.json
            .artifacts/kaji-evidence/paired-benchmark-results.json
            .artifacts/kaji-evidence/soak-results.json
            .artifacts/kaji-evidence/performance-status.json
            .artifacts/kaji-evidence/performance-imagedata.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-1.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-1-imagedata.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-2.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-2-imagedata.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-3.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-3-imagedata.json
            .artifacts/kaji-evidence/raw/soak/python.json
            .artifacts/kaji-evidence/raw/soak/typescript.json
            .artifacts/kaji-evidence/raw/soak/results.json
            .artifacts/kaji-evidence/compat-python-3.11.json
            .artifacts/kaji-evidence/compat-python-3.14.json
            .artifacts/kaji-evidence/compat-node-22.json
            .artifacts/kaji-evidence/compat-node-24.json
            .artifacts/kaji-evidence/release-evidence-validation.json
            .artifacts/kaji-evidence/sbom.spdx.json
      - name: Retain provenance bundle and attestation identity
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          test -n "$ATTESTATION_BUNDLE"
          test -f "$ATTESTATION_BUNDLE"
          test -n "$ATTESTATION_ID"
          test -n "$ATTESTATION_URL"
          cp "$ATTESTATION_BUNDLE" .artifacts/kaji-evidence/provenance.bundle.jsonl
          jq --null-input \
            --arg id "$ATTESTATION_ID" \
            --arg url "$ATTESTATION_URL" \
            --arg bundle "provenance.bundle.jsonl" \
            '{schemaVersion: 1, attestationId: $id, attestationUrl: $url, bundle: $bundle}' \
            >.artifacts/kaji-evidence/provenance.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-supply-chain-evidence
          path: .artifacts/kaji-evidence
          if-no-files-found: error

  registry-preflight:
    name: registry preflight
    needs: [verify-tag, supply-chain]
    if: ${{ always() && needs.verify-tag.result == 'success' && needs.supply-chain.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Forbid resuming a partial publication by rerunning the workflow
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "A publish workflow rerun may not resume immutable registry versions." >&2
            echo "Yank/deprecate any partial publication and create a new beta version." >&2
            exit 1
          fi
      - name: Require both exact beta versions to be absent
        run: |
          PYPI_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://pypi.org/pypi/kaji-sdk/0.2.0b1/json)"
          case "$PYPI_STATUS" in
            404) ;;
            200) echo "Python beta 0.2.0b1 already exists; aborting both publishers" >&2; exit 1 ;;
            *) echo "PyPI preflight failed with HTTP $PYPI_STATUS; aborting both publishers" >&2; exit 1 ;;
          esac
          set +e
          NPM_OUTPUT="$(npm view kaji-sdk@0.2.0-beta.2 version --json --registry=https://registry.npmjs.org/ 2>&1)"
          NPM_STATUS=$?
          set -e
          if [ "$NPM_STATUS" -eq 0 ]; then
            echo "npm beta 0.2.0-beta.2 already exists; aborting both publishers" >&2
            exit 1
          fi
          if ! printf '%s' "$NPM_OUTPUT" | grep -q E404; then
            echo "npm registry preflight was ambiguous; aborting both publishers" >&2
            exit 1
          fi

  publisher-preflight:
    name: publisher preflight
    needs: [verify-tag, supply-chain, registry-preflight]
    if: ${{ always() && github.run_attempt == 1 && needs.verify-tag.result == 'success' && needs.supply-chain.result == 'success' && needs.registry-preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: kaji-beta-publish
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Validate npm publisher identity and package ownership without mutation
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_NPM_PUBLISHER: ${{ vars.KAJI_NPM_PUBLISHER }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required" >&2; exit 1; }
          test -n "$EXPECTED_NPM_PUBLISHER" || {
            echo "KAJI_NPM_PUBLISHER must name the approved npm identity" >&2
            exit 1
          }
          IDENTITY="$(npm whoami --registry=https://registry.npmjs.org/)"
          [ "$IDENTITY" = "$EXPECTED_NPM_PUBLISHER" ] || {
            echo "npm identity does not match KAJI_NPM_PUBLISHER" >&2
            exit 1
          }
          set +e
          NPM_NAME_OUTPUT="$(npm view kaji-sdk name --json --registry=https://registry.npmjs.org/ 2>&1)"
          NPM_NAME_STATUS=$?
          set -e
          if [ "$NPM_NAME_STATUS" -eq 0 ]; then
            npm access list packages "$IDENTITY" --json --registry=https://registry.npmjs.org/ \
              >"$RUNNER_TEMP/npm-access.json"
            jq --exit-status \
              '.["kaji-sdk"] == "read-write" or .["kaji-sdk"] == "write"' \
              "$RUNNER_TEMP/npm-access.json" >/dev/null || {
                echo "npm identity lacks write access to the existing kaji-sdk package" >&2
                exit 1
              }
            echo "Verified npm publisher identity and existing kaji-sdk write access." \
              >>"$GITHUB_STEP_SUMMARY"
          elif printf '%s' "$NPM_NAME_OUTPUT" | grep -q E404; then
            echo "Verified npm publisher identity for the first unscoped kaji-sdk publication." \
              >>"$GITHUB_STEP_SUMMARY"
            echo "npm provides no non-mutating proof that a token may create a new unscoped package;" \
              "the protected publish remains the fail-closed authorization check." \
              >>"$GITHUB_STEP_SUMMARY"
          else
            echo "npm package ownership preflight was ambiguous" >&2
            exit 1
          fi
  publish-python:
    name: publish Python package
    needs: [verify-tag, supply-chain, registry-preflight, publisher-preflight]
    if: ${{ always() && github.run_attempt == 1 && needs.verify-tag.result == 'success' && needs.supply-chain.result == 'success' && needs.registry-preflight.result == 'success' && needs.publisher-preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kaji-beta-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
      - name: Revalidate downloaded filenames, sizes, hashes, and commit
        env:
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: >-
          python kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$EXPECTED_COMMIT"
      - name: Reverify Python archive contents against the clean checkout
        run: >-
          python3 kaji/scripts/verify_archives.py
          .artifacts/kaji-release
      - name: Isolate Python distributions
        run: |
          mkdir -p .artifacts/python-dist
          cp .artifacts/kaji-release/kaji_sdk-0.2.0b1-py3-none-any.whl .artifacts/python-dist/
          cp .artifacts/kaji-release/kaji_sdk-0.2.0b1.tar.gz .artifacts/python-dist/
      - name: Reverify signed tag immediately before PyPI publication
        uses: ./.github/actions/verify-kaji-beta-tag
        with:
          token: ${{ github.token }}
          tag: ${{ needs.verify-tag.outputs.tag-name }}
          tag_object: ${{ needs.verify-tag.outputs.tag-object }}
          commit: ${{ needs.verify-tag.outputs.commit }}
          tagger_email: ${{ vars.KAJI_RELEASE_SIGNER_EMAIL }}
      - name: Publish exact Python beta through trusted publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: .artifacts/python-dist

  publish-npm:
    name: publish npm package
    needs: [verify-tag, supply-chain, registry-preflight, publisher-preflight]
    if: ${{ always() && github.run_attempt == 1 && needs.verify-tag.result == 'success' && needs.supply-chain.result == 'success' && needs.registry-preflight.result == 'success' && needs.publisher-preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kaji-beta-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts
          bun-version: "1.3.11"
          install-args: --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
      - name: Revalidate downloaded filenames, sizes, hashes, and commit
        env:
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: >-
          python kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$EXPECTED_COMMIT"
      - name: Rebuild and verify npm archive contents against the clean checkout
        run: |
          bun --cwd kaji/ts run build
          python kaji/scripts/verify_npm_package.py \
            .artifacts/kaji-release/kaji-sdk-0.2.0-beta.2.tgz
      - name: Reverify signed tag immediately before npm publication
        uses: ./.github/actions/verify-kaji-beta-tag
        with:
          token: ${{ github.token }}
          tag: ${{ needs.verify-tag.outputs.tag-name }}
          tag_object: ${{ needs.verify-tag.outputs.tag-object }}
          commit: ${{ needs.verify-tag.outputs.commit }}
          tagger_email: ${{ vars.KAJI_RELEASE_SIGNER_EMAIL }}
      - name: Publish exact npm beta with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish .artifacts/kaji-release/kaji-sdk-0.2.0-beta.2.tgz --provenance --access public --tag beta --registry=https://registry.npmjs.org/

  publication-status:
    name: verify publication
    needs: [verify-tag, supply-chain, registry-preflight, publisher-preflight, publish-python, publish-npm]
    if: ${{ always() }}
    outputs:
      state: ${{ steps.classify.outputs.publication-state || steps.initial-status.outputs.publication-state }}
      incident: ${{ steps.classify.outputs.incident || steps.initial-status.outputs.incident }}
    runs-on: ubuntu-latest
    # Registry polling is capped at 15 minutes, leaving ample time to classify
    # and upload evidence after either convergence or timeout.
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Initialize fail-closed publication status before setup
        id: initial-status
        env:
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit || github.sha }}
          PYPI_PUBLISH_RESULT: ${{ needs.publish-python.result }}
          NPM_PUBLISH_RESULT: ${{ needs.publish-npm.result }}
        run: |
          mkdir -p .artifacts/kaji-publication-status
          jq --null-input \
            --arg commit "$RELEASE_COMMIT" \
            --arg pypiPublish "$PYPI_PUBLISH_RESULT" \
            --arg npmPublish "$NPM_PUBLISH_RESULT" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schemaVersion: 1, commit: $commit, state: "unpublished",
              previousState: "unpublished", releaseReady: false,
              installRecommendation: false,
              registries: {pypi: "unknown", npm: "unknown"},
              publishJobs: {pypi: $pypiPublish, npm: $npmPublish},
              registryVerification: "not_run",
              incident: {code: "classification_pending", recovery: "fix_forward_next_beta"},
              workflowRun: $workflowRun}' \
            >.artifacts/kaji-publication-status/publication-status.json
          {
            echo "# Kaji beta publication status"
            echo
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- State: **unpublished**"
            echo "- Retained evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Installation recommendation: WITHHELD: do not publish installation recommendations."
            echo "- Incident: classification pending; preserve this workflow evidence."
          } >.artifacts/kaji-publication-status/publication-status.md
          echo "publication-state=unpublished" >>"$GITHUB_OUTPUT"
          echo "incident=true" >>"$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/kaji-publication-status-initial"
          cp .artifacts/kaji-publication-status/publication-status.json \
            "$RUNNER_TEMP/kaji-publication-status-initial/"
          cp .artifacts/kaji-publication-status/publication-status.md \
            "$RUNNER_TEMP/kaji-publication-status-initial/"
      - name: Retain initial fail-closed publication status before setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-publication-status-initial
          path: ${{ runner.temp }}/kaji-publication-status-initial
          if-no-files-found: error
      # The first attempt is the only attempt allowed to transition from the
      # unpublished baseline. Reruns retain evidence but never query registries,
      # reduce state, or mutate the existing prerelease.
      - name: Guard workflow reruns before registry classification
        if: ${{ always() && github.run_attempt != 1 }}
        run: |
          jq --exit-status \
            '.state == "unpublished" and .releaseReady == false and
             .installRecommendation == false and
             .incident.code == "classification_pending" and
             .publishJobs.pypi == "skipped" and .publishJobs.npm == "skipped"' \
            .artifacts/kaji-publication-status/publication-status.json >/dev/null
          echo "Workflow reruns cannot create a publication transition or edit the prerelease." \
            >>"$GITHUB_STEP_SUMMARY"
      - id: checkout
        if: ${{ always() && github.run_attempt == 1 }}
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit || github.sha }}
      - name: Restore fail-closed publication status after checkout
        if: ${{ always() && github.run_attempt == 1 }}
        run: |
          mkdir -p .artifacts/kaji-publication-status
          cp "$RUNNER_TEMP/kaji-publication-status-initial/publication-status.json" \
            .artifacts/kaji-publication-status/
          cp "$RUNNER_TEMP/kaji-publication-status-initial/publication-status.md" \
            .artifacts/kaji-publication-status/
      - id: setup-node
        if: ${{ always() && github.run_attempt == 1 }}
        continue-on-error: true
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - id: setup-python
        if: ${{ always() && github.run_attempt == 1 }}
        continue-on-error: true
        uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji
          python-version: "3.14"
      - name: Install pinned registry-attestation verifiers
        id: verifiers
        if: ${{ always() && github.run_attempt == 1 }}
        continue-on-error: true
        run: |
          uv tool install pypi-attestations==0.0.29
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          npm install --global npm@11.16.0
      - id: artifacts
        if: ${{ always() && github.run_attempt == 1 }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
      - name: Revalidate artifacts before published-byte verification
        id: artifact-check
        if: ${{ always() && github.run_attempt == 1 && steps.checkout.outcome == 'success' && steps.artifacts.outcome == 'success' }}
        continue-on-error: true
        env:
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit || github.sha }}
        run: >-
          python3 kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$EXPECTED_COMMIT"
      - name: Poll bounded registry propagation and verify published bytes
        id: registry
        if: ${{ always() && github.run_attempt == 1 && needs.publish-python.result == 'success' && needs.publish-npm.result == 'success' && steps.verifiers.outcome == 'success' && steps.artifact-check.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout --signal=TERM --kill-after=10s 15m \
            python3 kaji/scripts/verify_published_packages.py \
            --artifacts-dir .artifacts/kaji-release \
            --output .artifacts/kaji-publication-status/registry-verification.json \
            --downloads-dir .artifacts/kaji-publication-status/downloaded \
            --repository "$GITHUB_REPOSITORY" \
            --attempts 8 --initial-delay 2 --max-delay 20
      - name: Reduce monotonic publication state
        id: classify
        if: ${{ always() && github.run_attempt == 1 }}
        env:
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit || github.sha }}
          PYPI_PUBLISH_RESULT: ${{ needs.publish-python.result }}
          NPM_PUBLISH_RESULT: ${{ needs.publish-npm.result }}
        run: |
          set +e
          mkdir -p .artifacts/kaji-publication-status
          PYPI_HTTP="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' https://pypi.org/pypi/kaji-sdk/0.2.0b1/json)"
          case "$PYPI_HTTP" in
            200) PYPI_STATE=present ;;
            404) PYPI_STATE=absent ;;
            *) PYPI_STATE=unknown ;;
          esac
          NPM_OUTPUT="$(timeout 30s npm view kaji-sdk@0.2.0-beta.2 version --json --registry=https://registry.npmjs.org/ 2>&1)"
          NPM_STATUS=$?
          if [ "$NPM_STATUS" -eq 0 ]; then
            NPM_STATE=present
          elif printf '%s' "$NPM_OUTPUT" | grep -q E404; then
            NPM_STATE=absent
          else
            NPM_STATE=unknown
          fi
          if [ -f .artifacts/kaji-publication-status/registry-verification.json ]; then
            REGISTRY_VERIFICATION="$(jq --raw-output .status \
              .artifacts/kaji-publication-status/registry-verification.json 2>/dev/null)"
            if [ "$REGISTRY_VERIFICATION" != byte_verified ]; then
              REGISTRY_VERIFICATION=failed
            fi
          else
            REGISTRY_VERIFICATION=not_run
          fi
          CLASSIFY_STATUS=127
          if [ -f kaji/scripts/verify_published_packages.py ]; then
            python3 kaji/scripts/verify_published_packages.py state \
              --previous-state unpublished \
              --pypi "$PYPI_STATE" \
              --npm "$NPM_STATE" \
              --registry-verification "$REGISTRY_VERIFICATION" \
              --pypi-publish-result "$PYPI_PUBLISH_RESULT" \
              --npm-publish-result "$NPM_PUBLISH_RESULT" \
              --commit "$RELEASE_COMMIT" \
              --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --output .artifacts/kaji-publication-status/publication-status.json \
              --markdown .artifacts/kaji-publication-status/publication-status.md
            CLASSIFY_STATUS=$?
          fi
          if [ "$CLASSIFY_STATUS" -ne 0 ]; then
            case "$PYPI_STATE/$NPM_STATE" in
              present/present) FALLBACK_STATE=both_published ;;
              present/absent) FALLBACK_STATE=pypi_only ;;
              absent/present) FALLBACK_STATE=npm_only ;;
              *) FALLBACK_STATE=unpublished ;;
            esac
            if [ "$FALLBACK_STATE" = unpublished ] && \
              [ "$PYPI_STATE" = absent ] && \
              [ "$NPM_STATE" = absent ] && \
              [ "$REGISTRY_VERIFICATION" = not_run ] && \
              [ "$PYPI_PUBLISH_RESULT" = skipped ] && \
              [ "$NPM_PUBLISH_RESULT" = skipped ]; then
              FALLBACK_INCIDENT=false
            else
              FALLBACK_INCIDENT=true
            fi
            jq --null-input \
              --arg commit "$RELEASE_COMMIT" \
              --arg state "$FALLBACK_STATE" \
              --arg pypi "$PYPI_STATE" --arg npm "$NPM_STATE" \
              --arg pypiPublish "$PYPI_PUBLISH_RESULT" \
              --arg npmPublish "$NPM_PUBLISH_RESULT" \
              --arg verification "$REGISTRY_VERIFICATION" \
              --argjson hasIncident "$FALLBACK_INCIDENT" \
              --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{schemaVersion: 1, commit: $commit, state: $state,
                previousState: "unpublished", releaseReady: false,
                installRecommendation: false,
                registries: {pypi: $pypi, npm: $npm},
                publishJobs: {pypi: $pypiPublish, npm: $npmPublish},
                registryVerification: $verification,
                incident: (if $hasIncident
                  then {code: "status_classifier_unavailable", recovery: "fix_forward_next_beta"}
                  else null
                  end),
                workflowRun: $workflowRun}' \
              >.artifacts/kaji-publication-status/publication-status.json
            {
              echo "# Kaji beta publication status"
              echo
              echo "- Commit: \`$RELEASE_COMMIT\`"
              echo "- State: **$FALLBACK_STATE**"
              echo "- PyPI/npm: \`$PYPI_STATE\` / \`$NPM_STATE\`"
              echo "- Publish jobs: \`$PYPI_PUBLISH_RESULT\` / \`$NPM_PUBLISH_RESULT\`"
              echo "- Retained evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "- Installation recommendation: WITHHELD: do not publish installation recommendations."
              if [ "$FALLBACK_INCIDENT" = true ]; then
                echo "- Incident: status_classifier_unavailable; preserve evidence and fix forward."
              else
                echo "- Incident: None; no publish job was attempted."
              fi
            } >.artifacts/kaji-publication-status/publication-status.md
          fi
          cat .artifacts/kaji-publication-status/publication-status.md >>"$GITHUB_STEP_SUMMARY" || true
          PUBLICATION_STATE="$(jq --raw-output .state .artifacts/kaji-publication-status/publication-status.json 2>/dev/null)"
          case "$PUBLICATION_STATE" in
            unpublished|pypi_only|npm_only|both_published|byte_verified) ;;
            *) PUBLICATION_STATE=unpublished ;;
          esac
          echo "publication-state=$PUBLICATION_STATE" >>"$GITHUB_OUTPUT"
          if jq --exit-status '.incident != null' \
            .artifacts/kaji-publication-status/publication-status.json >/dev/null 2>&1; then
            echo "incident=true" >>"$GITHUB_OUTPUT"
          else
            echo "incident=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Preserve publication outcome and recovery directions
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-publication-status
          path: .artifacts/kaji-publication-status
          if-no-files-found: error
      - name: Require exact byte-verified publication state
        if: ${{ always() && (steps.classify.outputs.publication-state || steps.initial-status.outputs.publication-state) != 'byte_verified' }}
        run: |
          echo "Publication is not byte_verified; installation recommendations remain withheld." >&2
          exit 1

  publication-incident:
    name: publication incident
    needs: [verify-tag, publication-status]
    if: ${{ always() && github.run_attempt == 1 && needs.verify-tag.result == 'success' && needs.publication-status.outputs.state != 'byte_verified' && needs.publication-status.outputs.incident == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-publication-status
          path: .artifacts/kaji-publication-status
      - name: Create or update fail-closed incident prerelease status
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ needs.verify-tag.outputs.tag-name }}
        run: |
          STATUS_JSON=.artifacts/kaji-publication-status/publication-status.json
          STATUS_MD=.artifacts/kaji-publication-status/publication-status.md
          jq --exit-status \
            '.state != "byte_verified" and .releaseReady == false and
             .installRecommendation == false and (.incident.code | type == "string")' \
            "$STATUS_JSON" >/dev/null
          grep --fixed-strings "Installation recommendation: WITHHELD" "$STATUS_MD" >/dev/null
          ENCODED_TAG="$(jq --null-input --raw-output --arg tag "$EXPECTED_TAG" '$tag | @uri')"
          RELEASE_JSON="$RUNNER_TEMP/kaji-incident-release.json"
          HTTP_STATUS="$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$RELEASE_JSON" --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$ENCODED_TAG")"
          case "$HTTP_STATUS" in
            200)
              jq --exit-status --arg tag "$EXPECTED_TAG" \
                '.tag_name == $tag and .name == ("Kaji " + $tag) and
                 .prerelease == true and .draft == false' \
                "$RELEASE_JSON" >/dev/null
              gh release edit "$EXPECTED_TAG" --repo "$GITHUB_REPOSITORY" \
                --prerelease --title "Kaji $EXPECTED_TAG" --notes-file "$STATUS_MD"
              ;;
            404)
              gh release create "$EXPECTED_TAG" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --prerelease --title "Kaji $EXPECTED_TAG" \
                --notes-file "$STATUS_MD"
              ;;
            *)
              echo "GitHub prerelease lookup failed with HTTP $HTTP_STATUS" >&2
              exit 1
              ;;
          esac

  release-evidence:
    name: release evidence
    needs: [verify-tag, tthw-evidence, supply-chain, publication-status]
    if: ${{ always() && needs.verify-tag.result == 'success' && needs.tthw-evidence.result == 'success' && needs.supply-chain.result == 'success' && needs.publication-status.result == 'success' && needs.publication-status.outputs.state == 'byte_verified' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-supply-chain-evidence
          path: .artifacts/kaji-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-publication-status
          path: .artifacts/kaji-publication-status
      - name: Revalidate exact artifacts before release attachment
        env:
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: >-
          python kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$EXPECTED_COMMIT"
      - name: Reverify signed tag immediately before release attachment
        uses: ./.github/actions/verify-kaji-beta-tag
        with:
          token: ${{ github.token }}
          tag: ${{ needs.verify-tag.outputs.tag-name }}
          tag_object: ${{ needs.verify-tag.outputs.tag-object }}
          commit: ${{ needs.verify-tag.outputs.commit }}
          tagger_email: ${{ vars.KAJI_RELEASE_SIGNER_EMAIL }}
      - name: Create or verify prerelease and attach only missing digest-matched assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ needs.verify-tag.outputs.tag-name }}
        run: >-
          python kaji/scripts/attach_release_assets.py
          --repo "$GITHUB_REPOSITORY"
          --tag "$EXPECTED_TAG"
          --title "Kaji $EXPECTED_TAG"
          .artifacts/kaji-release/kaji_sdk-0.2.0b1-py3-none-any.whl
          .artifacts/kaji-release/kaji_sdk-0.2.0b1.tar.gz
          .artifacts/kaji-release/kaji-sdk-0.2.0-beta.2.tgz
          .artifacts/kaji-release/manifest.json
          .artifacts/kaji-release/SHA256SUMS
          .artifacts/kaji-evidence/offline-gates.log
          .artifacts/kaji-evidence/offline-gate-summary.json
          .artifacts/kaji-evidence/provider-evidence.json
          .artifacts/kaji-evidence/tthw/status.json
          .artifacts/kaji-evidence/tthw/validation.log
          .artifacts/kaji-evidence/tthw/tthw-evidence.json
          .artifacts/kaji-evidence/paired-benchmark-results.json
          .artifacts/kaji-evidence/soak-results.json
          .artifacts/kaji-evidence/performance-status.json
          .artifacts/kaji-evidence/performance-imagedata.json
          .artifacts/kaji-evidence/compat-python-3.11.json
          .artifacts/kaji-evidence/compat-python-3.14.json
          .artifacts/kaji-evidence/compat-node-22.json
          .artifacts/kaji-evidence/compat-node-24.json
          .artifacts/kaji-evidence/release-evidence-validation.json
          .artifacts/kaji-evidence/sbom.spdx.json
          .artifacts/kaji-evidence/provenance.bundle.jsonl
          .artifacts/kaji-evidence/provenance.json
          .artifacts/kaji-publication-status/registry-verification.json
          .artifacts/kaji-publication-status/publication-status.json
          .artifacts/kaji-publication-status/publication-status.md
          .artifacts/kaji-publication-status/downloaded/registry-kaji_sdk-0.2.0b1-py3-none-any.whl
          .artifacts/kaji-publication-status/downloaded/registry-kaji_sdk-0.2.0b1-py3-none-any.whl.provenance.json
          .artifacts/kaji-publication-status/downloaded/registry-kaji_sdk-0.2.0b1-py3-none-any.whl.pypi-attestations.txt
