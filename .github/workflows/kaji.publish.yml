          set +e
          uv run --project kaji --no-sync python             kaji/scripts/validate_typescript_onboarding_evidence.py             --producer-archive "$KAJI_JOB_ROOT/work/archives/producer.zip"             --node22-archive "$KAJI_JOB_ROOT/work/archives/node22.zip"             --node24-archive "$KAJI_JOB_ROOT/work/archives/node24.zip"             --producer-artifact-id "$(jq -r '.[0].id' "$metadata")"             --producer-artifact-digest "$(jq -r '.[0].digest' "$metadata")"             --node22-source-artifact-id "$(jq -r '.[1].id' "$metadata")"             --node22-source-artifact-digest "$(jq -r '.[1].digest' "$metadata")"             --node24-source-artifact-id "$(jq -r '.[2].id' "$metadata")"             --node24-source-artifact-digest "$(jq -r '.[2].digest' "$metadata")"             --expected-run-id "$GITHUB_RUN_ID"             --expected-workflow-run "https://github.com/enkyuan/alloy/actions/runs/$GITHUB_RUN_ID"             --expected-workflow-ref "$EXPECTED_WORKFLOW_REF"             --expected-workflow-sha "$EXPECTED_COMMIT"             --output "$KAJI_JOB_ROOT/work/typescript-onboarding-evidence.json"             >"$KAJI_JOB_ROOT/work/validation.log" 2>&1
          status=$?
          set -e
          printf 'exit-code=%s\n' "$status" >>"$GITHUB_OUTPUT"
          exit "$status"
      - name: Verify authenticated candidate bytes
        id: candidate_verification
        if: ${{ steps.aggregate.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          KAJI_JOB_ROOT: ${{ runner.temp }}/kaji-typescript-onboarding-evidence
        run: |
          set -euo pipefail
          candidate="$KAJI_JOB_ROOT/work/candidate"
          mkdir -p "$candidate"
          unzip -q "$KAJI_JOB_ROOT/work/archives/producer.zip" -d "$candidate"
          uv run --project kaji --no-sync python kaji/scripts/verify_release_artifacts.py             --artifacts-dir "$candidate" --expected-commit "$EXPECTED_COMMIT"
      - name: Independently validate and recompute protected onboarding evidence
        id: aggregate_validation
        if: ${{ steps.candidate_verification.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          KAJI_JOB_ROOT: ${{ runner.temp }}/kaji-typescript-onboarding-evidence
        run: |
          set -euo pipefail
          metadata="$KAJI_JOB_ROOT/work/archive-metadata.json"
          uv run --project kaji --no-sync python -             "$KAJI_JOB_ROOT/work/typescript-onboarding-evidence.json"             "$KAJI_JOB_ROOT/work/archives/producer.zip"             "$KAJI_JOB_ROOT/work/archives/node22.zip"             "$KAJI_JOB_ROOT/work/archives/node24.zip"             "$(jq -r '.[0].id' "$metadata")" "$(jq -r '.[0].digest' "$metadata")"             "$(jq -r '.[1].id' "$metadata")" "$(jq -r '.[1].digest' "$metadata")"             "$(jq -r '.[2].id' "$metadata")" "$(jq -r '.[2].digest' "$metadata")"             "$GITHUB_RUN_ID" "$EXPECTED_COMMIT" "$EXPECTED_WORKFLOW_REF" <<'PY'
          import json
          from pathlib import Path
          import sys
          scripts_dir = Path("kaji/scripts").resolve(strict=True)
          sys.path.insert(0, str(scripts_dir))
          from validate_typescript_onboarding_evidence import (
              load_authenticated_archive,
              recompute_and_compare,
              validate_document,
          )
          evidence, producer_path, node22_path, node24_path = map(Path, sys.argv[1:5])
          producer_id, producer_digest = int(sys.argv[5]), sys.argv[6]
          node22_id, node22_digest = int(sys.argv[7]), sys.argv[8]
          node24_id, node24_digest = int(sys.argv[9]), sys.argv[10]
          run_id, commit, workflow_ref = int(sys.argv[11]), sys.argv[12], sys.argv[13]
          common = dict(run_id=run_id, run_attempt=1, head_sha=commit, expired=False)
          producer = load_authenticated_archive(
              producer_path, name="kaji-beta-artifacts",
              artifact_id=producer_id, digest=producer_digest, **common,
          )
          node22 = load_authenticated_archive(
              node22_path, name="kaji-node-compat-22",
              artifact_id=node22_id, digest=node22_digest, **common,
          )
          node24 = load_authenticated_archive(
              node24_path, name="kaji-node-compat-24",
              artifact_id=node24_id, digest=node24_digest, **common,
          )
          document = json.loads(evidence.read_text("utf-8"))
          validate_document(document)
          recompute_and_compare(
              document, producer_archive=producer, node22_archive=node22,
              node24_archive=node24,
              expected_workflow_run=f"https://github.com/enkyuan/alloy/actions/runs/{run_id}",
              expected_workflow_ref=workflow_ref, expected_workflow_sha=commit,
          )
          PY
      - name: Normalize terminal onboarding evidence
        id: normalize
        if: ${{ always() }}
        shell: bash
        env:
          KAJI_JOB_ROOT: ${{ runner.temp }}/kaji-typescript-onboarding-evidence
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RUNTIME_SETUP_OUTCOME: ${{ steps.runtime_setup.outcome }}
          LOOKUP_OUTCOME: ${{ steps.artifact_lookup.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.archive_download.outcome }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          AGGREGATE_EXIT: ${{ steps.aggregate.outputs.exit-code }}
          CANDIDATE_OUTCOME: ${{ steps.candidate_verification.outcome }}
          VALIDATION_OUTCOME: ${{ steps.aggregate_validation.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$KAJI_JOB_ROOT/final"
          if [ -f "$KAJI_JOB_ROOT/work/validation.log" ]; then
            sed -n '1,40p' "$KAJI_JOB_ROOT/work/validation.log" >"$KAJI_JOB_ROOT/final/validation.log"
          else
            printf '%s\n' "Onboarding did not reach aggregate validation." >"$KAJI_JOB_ROOT/final/validation.log"
          fi
          interrupted=false
          for outcome in "$INITIALIZE_OUTCOME" "$CHECKOUT_OUTCOME" "$RUNTIME_SETUP_OUTCOME"             "$LOOKUP_OUTCOME" "$DOWNLOAD_OUTCOME" "$AGGREGATE_OUTCOME"             "$CANDIDATE_OUTCOME" "$VALIDATION_OUTCOME"; do
            if [ "$outcome" = cancelled ]; then interrupted=true; fi
          done
          if [ "$AGGREGATE_EXIT" = 130 ] || [ "$AGGREGATE_EXIT" = 143 ]; then
            interrupted=true
          fi
          if [ "$interrupted" = true ]; then
            failure_code=onboarding_interrupted
          elif [ "$CHECKOUT_OUTCOME" != success ]; then
            failure_code=checkout_not_completed
          elif [ "$RUNTIME_SETUP_OUTCOME" != success ]; then
            failure_code=runtime_setup_not_completed
          elif [ "$LOOKUP_OUTCOME" != success ]; then
            failure_code=artifact_lookup_not_completed
          elif [ "$DOWNLOAD_OUTCOME" != success ]; then
            failure_code=archive_download_not_completed
          elif [ "$AGGREGATE_OUTCOME" != success ]; then
            case "$AGGREGATE_EXIT" in
              2) failure_code=onboarding_aggregate_write_ambiguous ;;
              3) failure_code=onboarding_aggregate_write_unrecoverable ;;
              4) failure_code=onboarding_aggregate_cleanup_ambiguous ;;
              *) failure_code=archive_authentication_not_completed ;;
            esac
          elif [ "$CANDIDATE_OUTCOME" != success ]; then
            failure_code=candidate_verification_not_completed
          elif [ "$VALIDATION_OUTCOME" != success ]; then
            failure_code=aggregate_validation_not_completed
          else
            failure_code=onboarding_receipt_not_terminal
          fi
          if [ "$CHECKOUT_OUTCOME" = success ] && [ "$RUNTIME_SETUP_OUTCOME" = success ] &&              [ "$LOOKUP_OUTCOME" = success ] && [ "$DOWNLOAD_OUTCOME" = success ] &&              [ "$AGGREGATE_OUTCOME" = success ] && [ "$CANDIDATE_OUTCOME" = success ] &&              [ "$VALIDATION_OUTCOME" = success ]; then
            evidence="$KAJI_JOB_ROOT/work/typescript-onboarding-evidence.json"
            aggregate_sha="$(sha256sum "$evidence" | cut -d' ' -f1)"
            manifest_sha="$(jq -r '.releaseManifestSha256' "$evidence")"
            [[ "$aggregate_sha" =~ ^[0-9a-f]{64}$ ]]
            [[ "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
            jq --null-input               --arg commit "$EXPECTED_COMMIT"               --arg workflowRun "https://github.com/enkyuan/alloy/actions/runs/$GITHUB_RUN_ID"               --arg workflowRef "$EXPECTED_WORKFLOW_REF"               --arg releaseManifestSha256 "$manifest_sha"               --arg aggregateSha256 "$aggregate_sha"               '{schemaVersion: 1, kind: "kaji-typescript-onboarding-status",
                commit: $commit, workflowRun: $workflowRun,
                workflowRunAttempt: 1, workflowRef: $workflowRef,
                releaseManifestSha256: $releaseManifestSha256,
                aggregateSha256: $aggregateSha256, conclusion: "passed",
                failureCode: null, exitCode: 0}' >"$KAJI_JOB_ROOT/final/status.json"
            cp "$evidence" "$KAJI_JOB_ROOT/final/typescript-onboarding-evidence.json"
            exit 0
          fi
          exit_code=null
          if [[ "$AGGREGATE_EXIT" =~ ^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$ ]]; then
            exit_code="$AGGREGATE_EXIT"
          fi
          jq --null-input             --arg commit "$EXPECTED_COMMIT"             --arg workflowRun "https://github.com/enkyuan/alloy/actions/runs/$GITHUB_RUN_ID"             --arg workflowRef "$EXPECTED_WORKFLOW_REF"             --arg failureCode "$failure_code"             --argjson exitCode "$exit_code"             '{schemaVersion: 1, kind: "kaji-typescript-onboarding-status",
              commit: $commit, workflowRun: $workflowRun,
              workflowRunAttempt: 1, workflowRef: $workflowRef,
              releaseManifestSha256: null, aggregateSha256: null,
              conclusion: "failed", failureCode: $failureCode,
              exitCode: $exitCode}' >"$KAJI_JOB_ROOT/final/status.json"
          exit 1
      - name: Retain terminal protected onboarding evidence
        id: onboarding_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-typescript-onboarding-evidence
          path: |
            ${{ runner.temp }}/kaji-typescript-onboarding-evidence/final/status.json
            ${{ runner.temp }}/kaji-typescript-onboarding-evidence/final/validation.log
            ${{ runner.temp }}/kaji-typescript-onboarding-evidence/final/typescript-onboarding-evidence.json
          if-no-files-found: error
      - name: Expose validated onboarding artifact bindings
        id: expose
        if: ${{ steps.normalize.outcome == 'success' && steps.onboarding_upload.outcome == 'success' }}
        shell: bash
        env:
          PRODUCER_ID: ${{ steps.artifact_lookup.outputs.producer-artifact-id }}
          PRODUCER_DIGEST: ${{ steps.artifact_lookup.outputs.producer-artifact-digest }}
          NODE22_ID: ${{ steps.artifact_lookup.outputs.node22-artifact-id }}
          NODE22_DIGEST: ${{ steps.artifact_lookup.outputs.node22-artifact-digest }}
          NODE24_ID: ${{ steps.artifact_lookup.outputs.node24-artifact-id }}
          NODE24_DIGEST: ${{ steps.artifact_lookup.outputs.node24-artifact-digest }}
          ONBOARDING_ID: ${{ steps.onboarding_upload.outputs.artifact-id }}
          ONBOARDING_ACTION_DIGEST: ${{ steps.onboarding_upload.outputs.artifact-digest }}
          KAJI_JOB_ROOT: ${{ runner.temp }}/kaji-typescript-onboarding-evidence
        run: |
          set -euo pipefail
          for id in "$PRODUCER_ID" "$NODE22_ID" "$NODE24_ID" "$ONBOARDING_ID"; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]]
            [ "$id" -le 9007199254740991 ]
          done
          [ "$PRODUCER_ID" != "$NODE22_ID" ]
          [ "$PRODUCER_ID" != "$NODE24_ID" ]
          [ "$NODE22_ID" != "$NODE24_ID" ]
          for digest in "$PRODUCER_DIGEST" "$NODE22_DIGEST" "$NODE24_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          [[ "$ONBOARDING_ACTION_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          manifest_sha="$(jq -r '.releaseManifestSha256' "$KAJI_JOB_ROOT/final/status.json")"
          aggregate_sha="$(jq -r '.aggregateSha256' "$KAJI_JOB_ROOT/final/status.json")"
          [[ "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$aggregate_sha" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'producer-artifact-id=%s\n' "$PRODUCER_ID"
            printf 'producer-artifact-digest=%s\n' "$PRODUCER_DIGEST"
            printf 'node22-source-artifact-id=%s\n' "$NODE22_ID"
            printf 'node22-source-artifact-digest=%s\n' "$NODE22_DIGEST"
            printf 'node24-source-artifact-id=%s\n' "$NODE24_ID"
            printf 'node24-source-artifact-digest=%s\n' "$NODE24_DIGEST"
            printf 'onboarding-artifact-id=%s\n' "$ONBOARDING_ID"
            printf 'onboarding-artifact-digest=sha256:%s\n' "$ONBOARDING_ACTION_DIGEST"
            printf 'release-manifest-sha256=%s\n' "$manifest_sha"
            printf 'aggregate-sha256=%s\n' "$aggregate_sha"
          } >>"$GITHUB_OUTPUT"

  keyed-proof:
    name: keyed provider proof
    needs: [verify-tag, offline-gates, performance, typescript-onboarding-evidence, python-compat, node-compat]
    if: ${{ github.run_attempt == 1 && !cancelled() && needs.verify-tag.result == 'success' && needs.offline-gates.result == 'success' && needs.performance.result == 'success' && needs.typescript-onboarding-evidence.result == 'success' && needs.python-compat.result == 'success' && needs.node-compat.result == 'success' }}
    runs-on: ubuntu-latest
    # Two proofs are capped at three minutes each. Thirty minutes leaves setup
    # and final evidence upload outside the child-process budget.
    timeout-minutes: 30
    environment: kaji-beta
    env:
      KAJI_RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
      KAJI_RELEASE_ARTIFACT_ID: ${{ needs.offline-gates.outputs.artifact-id }}
      KAJI_RELEASE_ARTIFACT_DIGEST: ${{ needs.offline-gates.outputs.artifact-digest }}
      KAJI_PROVIDER_STATUS_FILE: ${{ github.workspace }}/provider-evidence.json
    steps:
      - name: Initialize exact-commit provider evidence before setup
        shell: bash
        env:
          KAJI_INITIAL_PROVIDER_STATUS_FILE: ${{ runner.temp }}/provider-evidence.initial.json
        run: |
          jq --null-input --arg commit "$KAJI_RELEASE_COMMIT" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg releaseArtifactId "$KAJI_RELEASE_ARTIFACT_ID" \
            --arg releaseArtifactDigest "$KAJI_RELEASE_ARTIFACT_DIGEST" \
            '{schemaVersion: 1, commit: $commit, conclusion: "not_run",
              failureCode: "provider_proof_not_completed", workflowRun: $workflowRun,
              workflowRunAttempt: $workflowRunAttempt, releaseArtifactId: $releaseArtifactId,
              releaseArtifactDigest: $releaseArtifactDigest,
              proofs: [
                {sdk: "python", provider: "openai", proof: "real_normalized_tool_loop", status: "not_run"},
                {sdk: "typescript", provider: "openai", proof: "real_normalized_tool_loop", status: "not_run"}
              ]}' >"$KAJI_INITIAL_PROVIDER_STATUS_FILE"
      - name: Retain initial not-run provider evidence before setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-provider-evidence-initial
          path: ${{ runner.temp }}/provider-evidence.initial.json
          if-no-files-found: error
      - id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - name: Restore not-run provider evidence after checkout
        if: ${{ always() }}
        env:
          KAJI_INITIAL_PROVIDER_STATUS_FILE: ${{ runner.temp }}/provider-evidence.initial.json
        run: cp "$KAJI_INITIAL_PROVIDER_STATUS_FILE" "$KAJI_PROVIDER_STATUS_FILE"
      - id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - id: setup_bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - id: setup_python
        uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji
          python-version: "3.14"
          sync-args: --frozen
      - id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-beta-artifacts
          path: .artifacts/kaji-release
      - name: Verify exact candidate artifacts before provider proof
        id: verify
        run: >-
          python3 kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$KAJI_RELEASE_COMMIT"
      - name: Run protected provider proof
        id: provider
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          uv run --project kaji --no-sync python kaji/scripts/live_provider_proof.py
          --protected --artifacts-dir .artifacts/kaji-release
          --expected-commit "$KAJI_RELEASE_COMMIT"
      - name: Normalize terminal provider evidence
        if: ${{ always() }}
        shell: bash
        env:
          KAJI_INITIAL_PROVIDER_STATUS_FILE: ${{ runner.temp }}/provider-evidence.initial.json
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_SETUP_OUTCOME: ${{ steps.setup_node.outcome }}
          BUN_SETUP_OUTCOME: ${{ steps.setup_bun.outcome }}
          PYTHON_SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
          PROVIDER_OUTCOME: ${{ steps.provider.outcome }}
        run: |
          set -euo pipefail
          temporary="$RUNNER_TEMP/provider-evidence.tmp.json"
          if [ "$CHECKOUT_OUTCOME" != success ]; then
            failure_code=checkout_not_completed
          elif [ "$NODE_SETUP_OUTCOME" != success ] || [ "$BUN_SETUP_OUTCOME" != success ] || \
            [ "$PYTHON_SETUP_OUTCOME" != success ]; then
            failure_code=runtime_setup_not_completed
          elif [ "$DOWNLOAD_OUTCOME" != success ]; then
            failure_code=artifact_download_not_completed
          elif [ "$VERIFICATION_OUTCOME" != success ]; then
            failure_code=artifact_verification_not_completed
          elif [ "$PROVIDER_OUTCOME" != success ]; then
            failure_code=provider_proof_not_completed
          else
            failure_code=provider_receipt_not_terminal
          fi
          if [ "$CHECKOUT_OUTCOME" = success ] && [ "$NODE_SETUP_OUTCOME" = success ] && \
            [ "$BUN_SETUP_OUTCOME" = success ] && [ "$PYTHON_SETUP_OUTCOME" = success ] && \
            [ "$DOWNLOAD_OUTCOME" = success ] && [ "$VERIFICATION_OUTCOME" = success ] && \
            [ "$PROVIDER_OUTCOME" = success ] && jq -e --arg commit "$KAJI_RELEASE_COMMIT" \
              '.schemaVersion == 1 and .commit == $commit and .conclusion == "passed" and
               .failureCode == null and
               (.proofs | length == 2 and all(.[]; .status == "passed") and
                (map(.sdk + "/" + .provider) | sort ==
                 ["python/openai", "typescript/openai"]))' \
              "$KAJI_PROVIDER_STATUS_FILE" >/dev/null; then
            jq --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg releaseArtifactId "$KAJI_RELEASE_ARTIFACT_ID" \
              --arg releaseArtifactDigest "$KAJI_RELEASE_ARTIFACT_DIGEST" \
              '. + {workflowRun: $workflowRun, workflowRunAttempt: $workflowRunAttempt,
                    releaseArtifactId: $releaseArtifactId,
                    releaseArtifactDigest: $releaseArtifactDigest}' \
              "$KAJI_PROVIDER_STATUS_FILE" >"$temporary"
            mv "$temporary" "$KAJI_PROVIDER_STATUS_FILE"
            exit 0
          fi
          if [ ! -f "$KAJI_PROVIDER_STATUS_FILE" ]; then
            cp "$KAJI_INITIAL_PROVIDER_STATUS_FILE" "$KAJI_PROVIDER_STATUS_FILE"
          fi
          jq --arg failureCode "$failure_code" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg releaseArtifactId "$KAJI_RELEASE_ARTIFACT_ID" \
            --arg releaseArtifactDigest "$KAJI_RELEASE_ARTIFACT_DIGEST" \
            '. + {conclusion: "failed", failureCode: $failureCode,
                  workflowRun: $workflowRun, workflowRunAttempt: $workflowRunAttempt,
                  releaseArtifactId: $releaseArtifactId,
                  releaseArtifactDigest: $releaseArtifactDigest}' \
            "$KAJI_PROVIDER_STATUS_FILE" >"$temporary"
          mv "$temporary" "$KAJI_PROVIDER_STATUS_FILE"
          if [ "$PROVIDER_OUTCOME" = success ]; then
            echo "provider proof succeeded without a passed terminal receipt" >&2
            exit 1
          fi
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-provider-evidence
          path: provider-evidence.json
          if-no-files-found: error

  supply-chain:
    name: supply-chain evidence
    needs: [verify-tag, offline-gates, performance, typescript-onboarding-evidence, keyed-proof, python-compat, node-compat]
    if: ${{ github.run_attempt == 1 && !cancelled() && needs.verify-tag.result == 'success' && needs.offline-gates.result == 'success' && needs.performance.result == 'success' && needs.typescript-onboarding-evidence.result == 'success' && needs.keyed-proof.result == 'success' && needs.python-compat.result == 'success' && needs.node-compat.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      carrier-artifact-id: ${{ needs.offline-gates.outputs.artifact-id }}
      carrier-artifact-digest: ${{ needs.offline-gates.outputs.artifact-digest }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji
          python-version: "3.14"
          sync-args: --frozen
      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts
          bun-version: "1.3.11"
          install-args: --frozen-lockfile
      - name: Authenticate exact onboarding artifact bindings before downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
          EXPECTED_EVENT: push
          EXPECTED_HEAD_BRANCH: kaji-v0.2.0-beta.10
          EXPECTED_WORKFLOW_PATH: .github/workflows/kaji.publish.yml
          PRODUCER_ID: ${{ needs.typescript-onboarding-evidence.outputs.producer-artifact-id }}
          PRODUCER_DIGEST: ${{ needs.typescript-onboarding-evidence.outputs.producer-artifact-digest }}
          ONBOARDING_ID: ${{ needs.typescript-onboarding-evidence.outputs.onboarding-artifact-id }}
          ONBOARDING_DIGEST: ${{ needs.typescript-onboarding-evidence.outputs.onboarding-artifact-digest }}
          NODE22_ID: ${{ needs.typescript-onboarding-evidence.outputs.node22-source-artifact-id }}
          NODE22_DIGEST: ${{ needs.typescript-onboarding-evidence.outputs.node22-source-artifact-digest }}
          NODE24_ID: ${{ needs.typescript-onboarding-evidence.outputs.node24-source-artifact-id }}
          NODE24_DIGEST: ${{ needs.typescript-onboarding-evidence.outputs.node24-source-artifact-digest }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [ "$GITHUB_RUN_ID" -le 9007199254740991 ] || exit 1
          [ "$GITHUB_RUN_ATTEMPT" = 1 ] || exit 1
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          ids=()
          for binding in \
            "$PRODUCER_ID|$PRODUCER_DIGEST" \
            "$ONBOARDING_ID|$ONBOARDING_DIGEST" \
            "$NODE22_ID|$NODE22_DIGEST" \
            "$NODE24_ID|$NODE24_DIGEST"; do
            IFS='|' read -r artifact_id digest <<<"$binding"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || exit 1
            [ "$artifact_id" -le 9007199254740991 ] || exit 1
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            ids+=("$artifact_id")
          done
          [ "$(printf '%s\n' "${ids[@]}" | sort -u | wc -l | tr -d ' ')" = 4 ] || exit 1
          api() {
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$@"
          }
          run_metadata="$RUNNER_TEMP/kaji-onboarding-consumer-run.json"
          api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >"$run_metadata" 2>/dev/null
          jq --exit-status \
            --argjson id "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$EXPECTED_EVENT" \
            --arg path "$EXPECTED_WORKFLOW_PATH" \
            --arg branch "$EXPECTED_HEAD_BRANCH" \
            --arg commit "$EXPECTED_COMMIT" \
            '.id == $id and .run_attempt == $attempt and .event == $event and
             .path == $path and .head_branch == $branch and .head_sha == $commit' \
            "$run_metadata" >/dev/null
          for binding in \
            "producer|$PRODUCER_ID|$PRODUCER_DIGEST|kaji-beta-artifacts" \
            "onboarding|$ONBOARDING_ID|$ONBOARDING_DIGEST|kaji-typescript-onboarding-evidence" \
            "node22|$NODE22_ID|$NODE22_DIGEST|kaji-node-compat-22" \
            "node24|$NODE24_ID|$NODE24_DIGEST|kaji-node-compat-24"; do
            IFS='|' read -r key artifact_id digest name <<<"$binding"
            metadata="$RUNNER_TEMP/kaji-onboarding-consumer-$key.json"
            api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              >"$metadata" 2>/dev/null
            jq --exit-status \
              --argjson id "$artifact_id" \
              --arg name "$name" \
              --arg digest "$digest" \
              --argjson runId "$GITHUB_RUN_ID" \
              --arg branch "$EXPECTED_HEAD_BRANCH" \
              --arg commit "$EXPECTED_COMMIT" \
              --arg url "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --arg archive "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              '.id == $id and .name == $name and .digest == $digest and
               .expired == false and
               (.size_in_bytes | type == "number" and floor == . and
                 . > 0 and . <= 9007199254740991) and
               .url == $url and .archive_download_url == $archive and
               .workflow_run.id == $runId and
               .workflow_run.head_branch == $branch and
               .workflow_run.head_sha == $commit' \
              "$metadata" >/dev/null
          done
      - name: Download and authenticate current validator raw source archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_ID: ${{ needs.typescript-onboarding-evidence.outputs.producer-artifact-id }}
          PRODUCER_DIGEST: ${{ needs.typescript-onboarding-evidence.outputs.producer-artifact-digest }}
          ONBOARDING_ID: ${{ needs.typescript-onboarding-evidence.outputs.onboarding-artifact-id }}
          ONBOARDING_DIGEST: ${{ needs.typescript-onboarding-evidence.outputs.onboarding-artifact-digest }}
          NODE22_ID: ${{ needs.typescript-onboarding-evidence.outputs.node22-source-artifact-id }}
          NODE22_DIGEST: ${{ needs.typescript-onboarding-evidence.outputs.node22-source-artifact-digest }}
          NODE24_ID: ${{ needs.typescript-onboarding-evidence.outputs.node24-source-artifact-id }}
          NODE24_DIGEST: ${{ needs.typescript-onboarding-evidence.outputs.node24-source-artifact-digest }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .artifacts/kaji-raw
          for binding in \
            "producer|$PRODUCER_ID|$PRODUCER_DIGEST" \
            "onboarding|$ONBOARDING_ID|$ONBOARDING_DIGEST" \
            "node22|$NODE22_ID|$NODE22_DIGEST" \
            "node24|$NODE24_ID|$NODE24_DIGEST"; do
            IFS='|' read -r key artifact_id digest <<<"$binding"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            [ "$artifact_id" -le 9007199254740991 ]
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            archive=".artifacts/kaji-raw/$key.zip"
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              >"$archive" 2>/dev/null
            observed="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
            [ "$observed" = "$digest" ]
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.typescript-onboarding-evidence.outputs.producer-artifact-id }}
          path: .artifacts/kaji-release
          merge-multiple: true
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-offline-evidence
          path: .artifacts/kaji-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-provider-evidence
          path: .artifacts/kaji-evidence
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.typescript-onboarding-evidence.outputs.onboarding-artifact-id }}
          path: .artifacts/kaji-evidence/typescript-onboarding
          merge-multiple: true
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-performance-evidence
          path: .artifacts/kaji-evidence
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-python-compat-3.11
          path: .artifacts/kaji-compat/python-3.11
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-python-compat-3.14
          path: .artifacts/kaji-compat/python-3.14
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.typescript-onboarding-evidence.outputs.node22-source-artifact-id }}
          path: .artifacts/kaji-compat/node-22
          merge-multiple: true
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.typescript-onboarding-evidence.outputs.node24-source-artifact-id }}
          path: .artifacts/kaji-compat/node-24
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Revalidate current signed-source proof identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PROOF_ID: ${{ needs.offline-gates.outputs.source-proof-artifact-id }}
          SOURCE_PROOF_ACTION_DIGEST: ${{ needs.offline-gates.outputs.source-proof-artifact-digest }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_PROOF_ID" =~ ^[1-9][0-9]*$ ]]
          [ "$SOURCE_PROOF_ID" -le 9007199254740991 ]
          [[ "$SOURCE_PROOF_ACTION_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          metadata="$RUNNER_TEMP/kaji-signed-source-proof.json"
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_PROOF_ID" \
            >"$metadata" 2>/dev/null
          jq --exit-status \
            --argjson id "$SOURCE_PROOF_ID" \
            --arg digest "sha256:$SOURCE_PROOF_ACTION_DIGEST" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$RELEASE_COMMIT" \
            '.id == $id and .name == "kaji-authorized-rehearsal-source" and
             .digest == $digest and .expired == false and .size_in_bytes > 0 and
             .workflow_run.id == $runId and .workflow_run.head_branch == $branch and
             .workflow_run.head_sha == $commit' "$metadata" >/dev/null
      - name: Download authenticated signed-source proof by exact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.offline-gates.outputs.source-proof-artifact-id }}
          path: .artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Uniquely name final compatibility receipts
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p .artifacts/kaji-evidence
          copy_receipt() {
            source=$1
            destination=$2
            if [ -f "$source" ]; then
              cp "$source" ".artifacts/kaji-evidence/$destination"
            fi
          }
          copy_receipt .artifacts/kaji-compat/python-3.11/compatibility-receipt.json compat-python-3.11.json
          copy_receipt .artifacts/kaji-compat/python-3.14/compatibility-receipt.json compat-python-3.14.json
          copy_receipt .artifacts/kaji-compat/node-22/compatibility-receipt.json compat-node-22.json
          copy_receipt .artifacts/kaji-compat/node-24/compatibility-receipt.json compat-node-24.json
      - name: Revalidate downloaded filenames, sizes, hashes, and commit
        env:
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: >-
          python kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$EXPECTED_COMMIT"
      - name: Rebuild and verify exact package contents against the clean checkout
        run: |
          bun run --cwd kaji/ts build
          python kaji/scripts/verify_npm_package.py \
            .artifacts/kaji-release/kaji-sdk-0.2.0-beta.10.tgz
          python3 kaji/scripts/verify_archives.py \
            .artifacts/kaji-release
      - name: Validate one canonical current-run evidence set
        id: evidence-validation
        env:
          KAJI_RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: >-
          uv run --project kaji --no-sync python kaji/scripts/validate_release_evidence.py
          --mode publish
          --artifacts-dir .artifacts/kaji-release
          --producer-archive .artifacts/kaji-raw/producer.zip
          --node22-source-archive .artifacts/kaji-raw/node22.zip
          --node24-source-archive .artifacts/kaji-raw/node24.zip
          --expected-commit "$KAJI_RELEASE_COMMIT"
          --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
          --release-artifact-id "${{ needs.offline-gates.outputs.artifact-id }}"
          --release-artifact-digest "sha256:${{ needs.offline-gates.outputs.artifact-digest }}"
          --node22-source-artifact-id "${{ needs.typescript-onboarding-evidence.outputs.node22-source-artifact-id }}"
          --node22-source-artifact-digest "${{ needs.typescript-onboarding-evidence.outputs.node22-source-artifact-digest }}"
          --node24-source-artifact-id "${{ needs.typescript-onboarding-evidence.outputs.node24-source-artifact-id }}"
          --node24-source-artifact-digest "${{ needs.typescript-onboarding-evidence.outputs.node24-source-artifact-digest }}"
          --onboarding-status .artifacts/kaji-evidence/typescript-onboarding/status.json
          --onboarding-evidence .artifacts/kaji-evidence/typescript-onboarding/typescript-onboarding-evidence.json
          --python-compat-311 .artifacts/kaji-evidence/compat-python-3.11.json
          --python-compat-314 .artifacts/kaji-evidence/compat-python-3.14.json
          --node-compat-22 .artifacts/kaji-evidence/compat-node-22.json
          --node-compat-24 .artifacts/kaji-evidence/compat-node-24.json
          --performance-status .artifacts/kaji-evidence/performance-status.json
          --benchmark-results .artifacts/kaji-evidence/paired-benchmark-results.json
          --soak-results .artifacts/kaji-evidence/soak-results.json
          --performance-image-data .artifacts/kaji-evidence/performance-imagedata.json
          --provider-evidence .artifacts/kaji-evidence/provider-evidence.json
          --authorization-sha256 "${{ needs.verify-tag.outputs.authorization-sha256 }}"
          --rehearsal-run-id "${{ needs.verify-tag.outputs.rehearsal-run-id }}"
          --rehearsal-run-attempt "${{ needs.verify-tag.outputs.rehearsal-run-attempt }}"
          --rehearsal-workflow-path "${{ needs.verify-tag.outputs.rehearsal-workflow-path }}"
          --rehearsal-workflow-sha "${{ needs.verify-tag.outputs.rehearsal-workflow-sha }}"
          --signed-candidate-archive .artifacts/kaji-authorized-rehearsal/source.zip
          --signed-candidate-artifact-id "${{ needs.verify-tag.outputs.candidate-artifact-id }}"
          --signed-candidate-artifact-digest "${{ needs.verify-tag.outputs.candidate-artifact-digest }}"
          --signed-evidence-archive .artifacts/kaji-authorized-rehearsal-evidence/source.zip
          --signed-evidence-artifact-id "${{ needs.verify-tag.outputs.evidence-artifact-id }}"
          --signed-evidence-artifact-digest "${{ needs.verify-tag.outputs.evidence-artifact-digest }}"
          --signed-node22-source-artifact-id "${{ needs.offline-gates.outputs.signed-node22-artifact-id }}"
          --signed-node22-source-artifact-digest "${{ needs.offline-gates.outputs.signed-node22-artifact-digest }}"
          --signed-node24-source-artifact-id "${{ needs.offline-gates.outputs.signed-node24-artifact-id }}"
          --signed-node24-source-artifact-digest "${{ needs.offline-gates.outputs.signed-node24-artifact-digest }}"
          --signed-release-manifest-sha256 "${{ needs.verify-tag.outputs.release-manifest-sha256 }}"
          --signed-npm-tarball-name "${{ needs.verify-tag.outputs.npm-tarball-name }}"
          --signed-npm-tarball-sha256 "${{ needs.verify-tag.outputs.npm-tarball-sha256 }}"
          --signed-npm-tarball .artifacts/kaji-authorized-rehearsal/kaji-sdk-0.2.0-beta.10.tgz
          --rebuilt-npm-tarball .artifacts/kaji-rebuilt/kaji-sdk-0.2.0-beta.10.tgz
          --workspace "$GITHUB_WORKSPACE"
          --output .artifacts/kaji-evidence/release-evidence-validation.json
      - name: Generate SBOM
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          path: .artifacts/kaji-release
          format: spdx-json
          output-file: .artifacts/kaji-evidence/sbom.spdx.json
          upload-artifact: false
      - name: Attest exact artifacts and retained evidence
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            .artifacts/kaji-release/kaji_sdk-0.2.0b1-py3-none-any.whl
            .artifacts/kaji-release/kaji_sdk-0.2.0b1.tar.gz
            .artifacts/kaji-release/kaji-sdk-0.2.0-beta.10.tgz
            .artifacts/kaji-release/manifest.json
            .artifacts/kaji-release/SHA256SUMS
            .artifacts/kaji-evidence/offline-gates.log
            .artifacts/kaji-evidence/offline-gate-summary.json
            .artifacts/kaji-evidence/provider-evidence.json
            .artifacts/kaji-evidence/typescript-onboarding/status.json
            .artifacts/kaji-evidence/typescript-onboarding/validation.log
            .artifacts/kaji-evidence/typescript-onboarding/typescript-onboarding-evidence.json
            .artifacts/kaji-evidence/paired-benchmark-results.json
            .artifacts/kaji-evidence/soak-results.json
            .artifacts/kaji-evidence/performance-status.json
            .artifacts/kaji-evidence/performance-imagedata.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-1.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-1-imagedata.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-2.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-2-imagedata.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-3.json
            .artifacts/kaji-evidence/raw/benchmarks/replica-3-imagedata.json
            .artifacts/kaji-evidence/raw/soak/python.json
            .artifacts/kaji-evidence/raw/soak/typescript.json
            .artifacts/kaji-evidence/raw/soak/results.json
            .artifacts/kaji-evidence/compat-python-3.11.json
            .artifacts/kaji-evidence/compat-python-3.14.json
            .artifacts/kaji-evidence/compat-node-22.json
            .artifacts/kaji-evidence/compat-node-24.json
            .artifacts/kaji-evidence/release-evidence-validation.json
            .artifacts/kaji-evidence/sbom.spdx.json
      - name: Retain provenance bundle and attestation identity
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          test -n "$ATTESTATION_BUNDLE"
          test -f "$ATTESTATION_BUNDLE"
          test -n "$ATTESTATION_ID"
          test -n "$ATTESTATION_URL"
          cp "$ATTESTATION_BUNDLE" .artifacts/kaji-evidence/provenance.bundle.jsonl
          jq --null-input \
            --arg id "$ATTESTATION_ID" \
            --arg url "$ATTESTATION_URL" \
            --arg bundle "provenance.bundle.jsonl" \
            '{schemaVersion: 1, attestationId: $id, attestationUrl: $url, bundle: $bundle}' \
            >.artifacts/kaji-evidence/provenance.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-supply-chain-evidence
          path: .artifacts/kaji-evidence
          if-no-files-found: error

  registry-preflight:
    name: registry preflight
    needs: [verify-tag, supply-chain]
    if: ${{ always() && needs.verify-tag.result == 'success' && needs.supply-chain.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Forbid resuming a partial publication by rerunning the workflow
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "A publish workflow rerun may not resume immutable registry versions." >&2
            echo "Yank/deprecate any partial publication and create a new beta version." >&2
            exit 1
          fi
      - name: Require PyPI beta absence and exact npm beta absence
        run: |
          set -euo pipefail
          PYPI_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://pypi.org/pypi/kaji-sdk/0.2.0b1/json)"
          case "$PYPI_STATUS" in
            404) ;;
            200) echo "PyPI beta 0.2.0b1 must remain absent; aborting npm publication" >&2; exit 1 ;;
            *) echo "PyPI absence check failed with HTTP $PYPI_STATUS; aborting npm publication" >&2; exit 1 ;;
          esac
          fetch_registry_json() {
            local url="$1"
            local body="$2"
            local metadata="$3"
            local maximum_bytes="$4"
            set +e
            curl --silent --show-error --max-time 30 --connect-timeout 10 \
              --proto '=https' --tlsv1.2 --max-filesize "$maximum_bytes" \
              --header "Accept: application/json" \
              --output "$body" \
              --write-out '%{http_code}\t%{content_type}\t%{url_effective}\t%{num_redirects}\t%{size_download}\n' \
              "$url" >"$metadata"
            local transport_status=$?
            set -e
            [ "$transport_status" -eq 0 ] || {
              echo "npm registry transport failed closed" >&2
              exit 1
            }
            [ "$(wc -l <"$metadata")" -eq 1 ] || {
              echo "npm registry response metadata was not singular" >&2
              exit 1
            }
            local http_status content_type effective_url redirects reported_size
            IFS=$'\t' read -r http_status content_type effective_url redirects reported_size \
              <"$metadata"
            [ "$effective_url" = "$url" ] && [ "$redirects" = 0 ] || {
              echo "npm registry response redirected or changed endpoint" >&2
              exit 1
            }
            case "$content_type" in
              application/json|"application/json; charset=utf-8") ;;
              *) echo "npm registry response content type was not JSON" >&2; exit 1 ;;
            esac
            [[ "$reported_size" =~ ^[1-9][0-9]*$ ]] && \
              [ "$reported_size" -le "$maximum_bytes" ] && \
              [ "$(wc -c <"$body")" -eq "$reported_size" ] || {
                echo "npm registry response size was invalid" >&2
                exit 1
              }
            FETCH_HTTP_STATUS="$http_status"
          }
          CONTROL_BODY="$RUNNER_TEMP/kaji-npm-control.json"
          CONTROL_METADATA="$RUNNER_TEMP/kaji-npm-control.metadata"
          fetch_registry_json \
            https://registry.npmjs.org/tiny-tarball/1.0.0 \
            "$CONTROL_BODY" "$CONTROL_METADATA" 262144
          [ "$FETCH_HTTP_STATUS" = 200 ]
          jq --exit-status \
            'type == "object" and .name == "tiny-tarball" and .version == "1.0.0"' \
            "$CONTROL_BODY" >/dev/null
          PACKUMENT_BODY="$RUNNER_TEMP/kaji-npm-packument.json"
          PACKUMENT_METADATA="$RUNNER_TEMP/kaji-npm-packument.metadata"
          fetch_registry_json \
            https://registry.npmjs.org/kaji-sdk \
            "$PACKUMENT_BODY" "$PACKUMENT_METADATA" 65536
          PACKUMENT_HTTP="$FETCH_HTTP_STATUS"
          case "$PACKUMENT_HTTP" in
            404)
              jq --exit-status \
                'type == "object" and keys == ["error"] and .error == "Not found"' \
                "$PACKUMENT_BODY" >/dev/null
              ;;
            200)
              echo "npm package kaji-sdk already exists; aborting first publication" >&2
              exit 1
              ;;
            *)
              echo "npm packument absence check failed with HTTP $PACKUMENT_HTTP" >&2
              exit 1
              ;;
          esac
          TARGET_BODY="$RUNNER_TEMP/kaji-npm-target.json"
          TARGET_METADATA="$RUNNER_TEMP/kaji-npm-target.metadata"
          fetch_registry_json \
            https://registry.npmjs.org/kaji-sdk/0.2.0-beta.10 \
            "$TARGET_BODY" "$TARGET_METADATA" 65536
          TARGET_HTTP="$FETCH_HTTP_STATUS"
          case "$TARGET_HTTP" in
            200)
              echo "npm beta 0.2.0-beta.10 already exists; aborting publication" >&2
              exit 1
              ;;
            404)
              jq --exit-status 'type == "string" and . == "Not Found"' \
                "$TARGET_BODY" >/dev/null
              ;;
            *)
              echo "npm exact-version absence check failed with HTTP $TARGET_HTTP" >&2
              exit 1
              ;;
          esac
          [ "$PACKUMENT_HTTP/$TARGET_HTTP" = 404/404 ]

  publish-npm:
    name: publish npm package
    needs: [verify-tag, supply-chain, registry-preflight]
    if: ${{ github.run_attempt == 1 && !cancelled() && needs.verify-tag.result == 'success' && needs.supply-chain.result == 'success' && needs.registry-preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kaji-beta-publish
    outputs:
      expected-publisher: ${{ steps.publisher-identity-init.outputs.expected-publisher }}
      publisher-artifact-id: ${{ steps.publisher-identity-upload.outputs.artifact-id }}
      publisher-artifact-digest: ${{ steps.publisher-identity-upload.outputs.artifact-digest }}
      publisher-artifact-name: ${{ steps.publisher-identity-init.outputs.artifact-name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Initialize fail-closed publisher identity receipt
        id: publisher-identity-init
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag-name }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_NPM_PUBLISHER: ${{ vars.KAJI_NPM_PUBLISHER }}
        run: |
          set -euo pipefail
          umask 077
          receipt_directory="$RUNNER_TEMP/kaji-publisher-identity"
          receipt="$receipt_directory/publisher-identity-receipt.json"
          mkdir -p "$receipt_directory"
          artifact_name="kaji-publisher-identity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "artifact-name=$artifact_name" >>"$GITHUB_OUTPUT"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [ "$RELEASE_TAG" = "kaji-v0.2.0-beta.10" ]
          [ "$GITHUB_SERVER_URL" = "https://github.com" ]
          [ "$GITHUB_REPOSITORY" = "enkyuan/alloy" ]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          [ "$GITHUB_RUN_ATTEMPT" = 1 ]
          [ "$WORKFLOW_SHA" = "$RELEASE_COMMIT" ]
          workflow_run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          expected_json=null
          failure_code=identity_check_incomplete
          initial_exit=null
          initial_status=0
          if [ -z "$EXPECTED_NPM_PUBLISHER" ]; then
            failure_code=expected_publisher_missing
            initial_exit=1
            initial_status=1
          elif [[ ! "$EXPECTED_NPM_PUBLISHER" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]] || \
            [[ "$EXPECTED_NPM_PUBLISHER" =~ ^(npm_|github_pat_|gh[oprsu]_) ]] || \
            [[ "$EXPECTED_NPM_PUBLISHER" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            failure_code=expected_publisher_invalid
            initial_exit=1
            initial_status=1
          else
            expected_json="$(jq --null-input --compact-output \
              --arg value "$EXPECTED_NPM_PUBLISHER" '$value')"
            echo "expected-publisher=$EXPECTED_NPM_PUBLISHER" >>"$GITHUB_OUTPUT"
          fi
          temporary="$receipt_directory/.publisher-identity-receipt.json.tmp"
          jq --sort-keys --indent 2 --null-input \
            --arg schemaVersion "1.0.0" \
            --arg commit "$RELEASE_COMMIT" \
            --arg tag "$RELEASE_TAG" \
            --arg workflowRun "$workflow_run" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflowPath ".github/workflows/kaji.publish.yml" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --argjson expectedPublisher "$expected_json" \
            --argjson actualPublisher null \
            --arg conclusion failed \
            --argjson exitCode "$initial_exit" \
            --arg failureCode "$failure_code" \
            '{schemaVersion: $schemaVersion, commit: $commit, tag: $tag,
              workflowRun: $workflowRun, workflowRunAttempt: $workflowRunAttempt,
              workflowPath: $workflowPath, workflowSha: $workflowSha,
              expectedPublisher: $expectedPublisher, actualPublisher: $actualPublisher,
              conclusion: $conclusion, exitCode: $exitCode, failureCode: $failureCode}' \
            >"$temporary"
          [ "$(wc -c <"$temporary")" -le 65536 ]
          mv -- "$temporary" "$receipt"
          if [ "$failure_code" = expected_publisher_missing ]; then
            echo "KAJI_NPM_PUBLISHER must name the approved npm identity" >&2
          elif [ "$failure_code" = expected_publisher_invalid ]; then
            echo "KAJI_NPM_PUBLISHER does not match the closed npm identity format" >&2
          fi
          exit "$initial_status"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Remove deprecated setup-node npm always-auth setting
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$NPM_CONFIG_USERCONFIG" ]
          [ ! -L "$NPM_CONFIG_USERCONFIG" ]
          [ "$(wc -c <"$NPM_CONFIG_USERCONFIG")" -le 4096 ]
          [ "$(grep -c '^always-auth=false$' "$NPM_CONFIG_USERCONFIG")" -eq 1 ]
          [ "$(grep -c '^always-auth=' "$NPM_CONFIG_USERCONFIG")" -eq 1 ]
          temporary="$(mktemp "$RUNNER_TEMP/kaji-npmrc.XXXXXX")"
          chmod 600 "$temporary"
          cleanup_npm_config() {
            rm -f "$temporary"
          }
          trap cleanup_npm_config EXIT
          awk '$0 != "always-auth=false" { print }' \
            "$NPM_CONFIG_USERCONFIG" >"$temporary"
          [ "$(wc -c <"$temporary")" -le 4096 ]
          if grep --quiet '^always-auth=' "$temporary"; then
            exit 1
          fi
          mv "$temporary" "$NPM_CONFIG_USERCONFIG"
          trap - EXIT
          if grep --quiet '^always-auth=' "$NPM_CONFIG_USERCONFIG"; then
            exit 1
          fi
      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: kaji/ts
          bun-version: "1.3.11"
          install-args: --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.supply-chain.outputs.carrier-artifact-id }}
          path: .artifacts/kaji-release
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Revalidate downloaded filenames, sizes, hashes, and commit
        env:
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: >-
          python kaji/scripts/verify_release_artifacts.py
          --artifacts-dir .artifacts/kaji-release
          --expected-commit "$EXPECTED_COMMIT"
      - name: Rebuild and verify npm archive contents against the clean checkout
        run: |
          bun run --cwd kaji/ts build
          python kaji/scripts/verify_npm_package.py \
            .artifacts/kaji-release/kaji-sdk-0.2.0-beta.10.tgz
      - name: Verify exact npm publisher identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_NPM_PUBLISHER: ${{ vars.KAJI_NPM_PUBLISHER }}
        run: |
          set -euo pipefail
          umask 077
          receipt_directory="$RUNNER_TEMP/kaji-publisher-identity"
          receipt="$receipt_directory/publisher-identity-receipt.json"
          [ -f "$receipt" ] && [ ! -L "$receipt" ]
          [ "$(wc -c <"$receipt")" -le 65536 ]
          jq --exit-status --arg expected "$EXPECTED_NPM_PUBLISHER" \
            '.schemaVersion == "1.0.0" and .expectedPublisher == $expected and
             .actualPublisher == null and .conclusion == "failed" and
             .exitCode == null and .failureCode == "identity_check_incomplete"' \
            "$receipt" >/dev/null
          normalize_failed() {
            local actual_json="$1"
            local exit_code="$2"
            local failure_code="$3"
            local temporary="$receipt_directory/.publisher-identity-receipt.json.tmp"
            jq --sort-keys --indent 2 \
              --argjson actualPublisher "$actual_json" \
              --argjson exitCode "$exit_code" \
              --arg failureCode "$failure_code" \
              '.actualPublisher = $actualPublisher |
               .conclusion = "failed" |
               .exitCode = $exitCode |
               .failureCode = $failureCode' \
              "$receipt" >"$temporary"
            [ "$(wc -c <"$temporary")" -le 65536 ]
            mv -- "$temporary" "$receipt"
          }
          normalize_passed() {
            local actual="$1"
            local temporary="$receipt_directory/.publisher-identity-receipt.json.tmp"
            jq --sort-keys --indent 2 \
              --arg actualPublisher "$actual" \
              '.actualPublisher = $actualPublisher |
               .conclusion = "passed" |
               .exitCode = 0 |
               .failureCode = null' \
              "$receipt" >"$temporary"
            [ "$(wc -c <"$temporary")" -le 65536 ]
            mv -- "$temporary" "$receipt"
          }
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            normalize_failed null 1 token_missing
            echo "NPM_TOKEN is required in the protected publisher environment" >&2
            exit 1
          fi
          private_directory="$(mktemp -d "$RUNNER_TEMP/kaji-npm-whoami.XXXXXX")"
          chmod 700 "$private_directory"
          stdout_file="$private_directory/stdout"
          stderr_file="$private_directory/stderr"
          cleanup_private_output() {
            : >"$stdout_file" 2>/dev/null || true
            : >"$stderr_file" 2>/dev/null || true
            rm -rf -- "$private_directory"
          }
          trap cleanup_private_output EXIT
          set +e
          (
            ulimit -f 16
            timeout --signal=TERM --kill-after=5s 30s \
              npm whoami --registry=https://registry.npmjs.org/
          ) >"$stdout_file" 2>"$stderr_file"
          whoami_status=$?
          set -e
          if [ "$whoami_status" -ne 0 ]; then
            if [ "$whoami_status" -lt 1 ] || [ "$whoami_status" -gt 255 ]; then
              whoami_status=1
            fi
            normalize_failed null "$whoami_status" npm_whoami_failed
            echo "Registry identity check failed; raw output was discarded" >&2
            exit 1
          fi
          stdout_size="$(wc -c <"$stdout_file")"
          stderr_size="$(wc -c <"$stderr_file")"
          if [ "$stdout_size" -lt 2 ] || [ "$stdout_size" -gt 65 ] || \
            [ "$stderr_size" -ne 0 ] || \
            [ "$(wc -l <"$stdout_file")" -ne 1 ]; then
            normalize_failed null 1 npm_whoami_output_invalid
            echo "Registry identity output did not match the closed format" >&2
            exit 1
          fi
          last_byte="$(od -An -t x1 -j "$((stdout_size - 1))" -N 1 "$stdout_file" |
            tr -d '[:space:]')"
          identity="$(head -c "$((stdout_size - 1))" "$stdout_file")"
          if [ "$last_byte" != 0a ] || \
            ! printf '%s\n' "$identity" | cmp --silent - "$stdout_file" || \
            [[ ! "$identity" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]] || \
            [[ "$identity" =~ ^(npm_|github_pat_|gh[oprsu]_) ]] || \
            [[ "$identity" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            normalize_failed null 1 npm_whoami_output_invalid
            echo "Registry identity output did not match the closed format" >&2
            exit 1
          fi
          if ! [ "$identity" = "$EXPECTED_NPM_PUBLISHER" ]; then
            actual_json="$(jq --null-input --compact-output --arg value "$identity" '$value')"
            normalize_failed "$actual_json" 1 publisher_mismatch
            echo "npm identity does not match KAJI_NPM_PUBLISHER" >&2
            exit 1
          fi
          normalize_passed "$identity"
      - name: Upload exact publisher identity receipt
        id: publisher-identity-upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.publisher-identity-init.outputs.artifact-name }}
          path: ${{ runner.temp }}/kaji-publisher-identity/publisher-identity-receipt.json
          if-no-files-found: error
      - name: Revalidate current carrier immediately before npm publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARRIER_ID: ${{ needs.supply-chain.outputs.carrier-artifact-id }}
          CARRIER_ACTION_DIGEST: ${{ needs.supply-chain.outputs.carrier-artifact-digest }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
          SIGNED_MANIFEST_SHA256: ${{ needs.verify-tag.outputs.release-manifest-sha256 }}
          SIGNED_NPM_TARBALL_NAME: ${{ needs.verify-tag.outputs.npm-tarball-name }}
          SIGNED_NPM_TARBALL_SHA256: ${{ needs.verify-tag.outputs.npm-tarball-sha256 }}
        run: |
          set -euo pipefail
          [[ "$CARRIER_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CARRIER_ACTION_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          metadata="$RUNNER_TEMP/kaji-current-carrier.json"
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$CARRIER_ID" \
            >"$metadata" 2>/dev/null
          jq --exit-status \
            --argjson id "$CARRIER_ID" \
            --arg digest "sha256:$CARRIER_ACTION_DIGEST" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$RELEASE_COMMIT" \
            '.id == $id and .name == "kaji-beta-artifacts" and
             .digest == $digest and .expired == false and .size_in_bytes > 0 and
             .workflow_run.id == $runId and .workflow_run.head_branch == $branch and
             .workflow_run.head_sha == $commit' "$metadata" >/dev/null
          [ "$(sha256sum .artifacts/kaji-release/manifest.json | cut -d' ' -f1)" = \
            "$SIGNED_MANIFEST_SHA256" ]
          [ "$(sha256sum ".artifacts/kaji-release/$SIGNED_NPM_TARBALL_NAME" | cut -d' ' -f1)" = \
            "$SIGNED_NPM_TARBALL_SHA256" ]
      - name: Reverify signed tag immediately before npm publication
        uses: ./.github/actions/verify-kaji-beta-tag
        with:
          token: ${{ github.token }}
          tag: ${{ needs.verify-tag.outputs.tag-name }}
          tag_object: ${{ needs.verify-tag.outputs.tag-object }}
          commit: ${{ needs.verify-tag.outputs.commit }}
          tagger_email: ${{ vars.KAJI_RELEASE_SIGNER_EMAIL }}
          authorization_sha256: ${{ needs.verify-tag.outputs.authorization-sha256 }}
          rehearsal_run_id: ${{ needs.verify-tag.outputs.rehearsal-run-id }}
          rehearsal_run_attempt: ${{ needs.verify-tag.outputs.rehearsal-run-attempt }}
          rehearsal_workflow_path: ${{ needs.verify-tag.outputs.rehearsal-workflow-path }}
          rehearsal_workflow_sha: ${{ needs.verify-tag.outputs.rehearsal-workflow-sha }}
          candidate_artifact_id: ${{ needs.verify-tag.outputs.candidate-artifact-id }}
          candidate_artifact_name: ${{ needs.verify-tag.outputs.candidate-artifact-name }}
          candidate_artifact_digest: ${{ needs.verify-tag.outputs.candidate-artifact-digest }}
          evidence_artifact_id: ${{ needs.verify-tag.outputs.evidence-artifact-id }}
          evidence_artifact_name: ${{ needs.verify-tag.outputs.evidence-artifact-name }}
          evidence_artifact_digest: ${{ needs.verify-tag.outputs.evidence-artifact-digest }}
          release_manifest_sha256: ${{ needs.verify-tag.outputs.release-manifest-sha256 }}
          npm_tarball_name: ${{ needs.verify-tag.outputs.npm-tarball-name }}
          npm_tarball_sha256: ${{ needs.verify-tag.outputs.npm-tarball-sha256 }}
      - name: Recheck exact registry absence immediately before npm publication
        run: |
          set -euo pipefail
          PYPI_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://pypi.org/pypi/kaji-sdk/0.2.0b1/json)"
          case "$PYPI_STATUS" in
            404) ;;
            200) echo "PyPI beta 0.2.0b1 must remain absent; aborting npm publication" >&2; exit 1 ;;
            *) echo "PyPI absence check failed with HTTP $PYPI_STATUS; aborting npm publication" >&2; exit 1 ;;
          esac
          fetch_registry_json() {
            local url="$1"
            local body="$2"
            local metadata="$3"
            local maximum_bytes="$4"
            set +e
            curl --silent --show-error --max-time 30 --connect-timeout 10 \
              --proto '=https' --tlsv1.2 --max-filesize "$maximum_bytes" \
              --header "Accept: application/json" \
              --output "$body" \
              --write-out '%{http_code}\t%{content_type}\t%{url_effective}\t%{num_redirects}\t%{size_download}\n' \
              "$url" >"$metadata"
            local transport_status=$?
            set -e
            [ "$transport_status" -eq 0 ] || {
              echo "npm registry transport failed closed" >&2
              exit 1
            }
            [ "$(wc -l <"$metadata")" -eq 1 ] || {
              echo "npm registry response metadata was not singular" >&2
              exit 1
            }
            local http_status content_type effective_url redirects reported_size
            IFS=$'\t' read -r http_status content_type effective_url redirects reported_size \
              <"$metadata"
            [ "$effective_url" = "$url" ] && [ "$redirects" = 0 ] || {
              echo "npm registry response redirected or changed endpoint" >&2
              exit 1
            }
            case "$content_type" in
              application/json|"application/json; charset=utf-8") ;;
              *) echo "npm registry response content type was not JSON" >&2; exit 1 ;;
            esac
            [[ "$reported_size" =~ ^[1-9][0-9]*$ ]] && \
              [ "$reported_size" -le "$maximum_bytes" ] && \
              [ "$(wc -c <"$body")" -eq "$reported_size" ] || {
                echo "npm registry response size was invalid" >&2
                exit 1
              }
            FETCH_HTTP_STATUS="$http_status"
          }
          CONTROL_BODY="$RUNNER_TEMP/kaji-npm-control.json"
          CONTROL_METADATA="$RUNNER_TEMP/kaji-npm-control.metadata"
          fetch_registry_json \
            https://registry.npmjs.org/tiny-tarball/1.0.0 \
            "$CONTROL_BODY" "$CONTROL_METADATA" 262144
          [ "$FETCH_HTTP_STATUS" = 200 ]
          jq --exit-status \
            'type == "object" and .name == "tiny-tarball" and .version == "1.0.0"' \
            "$CONTROL_BODY" >/dev/null
          PACKUMENT_BODY="$RUNNER_TEMP/kaji-npm-packument.json"
          PACKUMENT_METADATA="$RUNNER_TEMP/kaji-npm-packument.metadata"
          fetch_registry_json \
            https://registry.npmjs.org/kaji-sdk \
            "$PACKUMENT_BODY" "$PACKUMENT_METADATA" 65536
          PACKUMENT_HTTP="$FETCH_HTTP_STATUS"
          case "$PACKUMENT_HTTP" in
            404)
              jq --exit-status \
                'type == "object" and keys == ["error"] and .error == "Not found"' \
                "$PACKUMENT_BODY" >/dev/null
              ;;
            200)
              echo "npm package kaji-sdk already exists; aborting first publication" >&2
              exit 1
              ;;
            *)
              echo "npm packument absence check failed with HTTP $PACKUMENT_HTTP" >&2
              exit 1
              ;;
          esac
          TARGET_BODY="$RUNNER_TEMP/kaji-npm-target.json"
          TARGET_METADATA="$RUNNER_TEMP/kaji-npm-target.metadata"
          fetch_registry_json \
            https://registry.npmjs.org/kaji-sdk/0.2.0-beta.10 \
            "$TARGET_BODY" "$TARGET_METADATA" 65536
          TARGET_HTTP="$FETCH_HTTP_STATUS"
          case "$TARGET_HTTP" in
            200)
              echo "npm beta 0.2.0-beta.10 already exists; aborting publication" >&2
              exit 1
              ;;
            404)
              jq --exit-status 'type == "string" and . == "Not Found"' \
                "$TARGET_BODY" >/dev/null
              ;;
            *)
              echo "npm exact-version absence check failed with HTTP $TARGET_HTTP" >&2
              exit 1
              ;;
          esac
          [ "$PACKUMENT_HTTP/$TARGET_HTTP" = 404/404 ]
      - name: Publish exact npm beta with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          npm publish .artifacts/kaji-release/kaji-sdk-0.2.0-beta.10.tgz --provenance --access public --tag beta --registry=https://registry.npmjs.org/

  publication-status:
    name: verify publication
    needs: [verify-tag, supply-chain, registry-preflight, publish-npm]
    if: ${{ always() }}
    outputs:
      state: ${{ steps.classify.outputs.publication-state || steps.initial-status.outputs.publication-state }}
      incident: ${{ steps.classify.outputs.incident || steps.initial-status.outputs.incident }}
      expected-publisher: ${{ steps.classify.outputs.expected-publisher }}
    runs-on: ubuntu-latest
    # Registry polling is capped at 20 minutes, preserving the full propagation
    # window and two bounded verification paths before classification and upload.
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Initialize fail-closed publication status before setup
        id: initial-status
        env:
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit || github.sha }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag-name || 'kaji-v0.2.0-beta.10' }}
          NPM_PUBLISH_RESULT: ${{ needs.publish-npm.result }}
          PUBLISHER_OUTPUT: ${{ needs.publish-npm.outputs.expected-publisher }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/kaji-publication-status
          expected_publisher_json=null
          publisher_reason=receipt_outputs_missing
          if [ "$NPM_PUBLISH_RESULT" = skipped ]; then
            publisher_reason=publish_job_not_started
          fi
          if [[ "$PUBLISHER_OUTPUT" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]] && \
            [[ ! "$PUBLISHER_OUTPUT" =~ ^(npm_|github_pat_|gh[oprsu]_) ]] && \
            [[ ! "$PUBLISHER_OUTPUT" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            expected_publisher_json="$(jq --null-input --compact-output \
              --arg value "$PUBLISHER_OUTPUT" '$value')"
          fi
          jq --null-input \
            --arg commit "$RELEASE_COMMIT" \
            --arg tag "$RELEASE_TAG" \
            --arg npmPublish "$NPM_PUBLISH_RESULT" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflowPath ".github/workflows/kaji.publish.yml" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --argjson expectedPublisher "$expected_publisher_json" \
            --arg publisherReason "$publisher_reason" \
            '{schemaVersion: 1, target: "npm", commit: $commit, tag: $tag,
              workflowRunAttempt: $workflowRunAttempt,
              workflowPath: $workflowPath, workflowSha: $workflowSha,
              expectedPublisher: $expectedPublisher, state: "unpublished",
              previousState: "unpublished", releaseReady: false,
              installRecommendation: false,
              registries: {pypi: "unknown", npm: "unknown"},
              publishJobs: {pypi: "skipped", npm: $npmPublish},
              registryVerification: "not_run",
              incident: {code: "classification_pending", recovery: "fix_forward_next_beta"},
              publisherIdentity: {conclusion: "not_run",
                reason: $publisherReason, artifact: null,
                receiptSha256: null, identity: null},
              workflowRun: $workflowRun}' \
            >.artifacts/kaji-publication-status/publication-status.json
          {
            echo "# Kaji beta publication status"
            echo
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- State: **unpublished**"
            echo "- Retained evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Installation recommendation: WITHHELD: do not publish installation recommendations."
            echo "- Incident: classification pending; preserve this workflow evidence."
          } >.artifacts/kaji-publication-status/publication-status.md
          echo "publication-state=unpublished" >>"$GITHUB_OUTPUT"
          echo "incident=true" >>"$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/kaji-publication-status-initial"
          cp .artifacts/kaji-publication-status/publication-status.json \
            "$RUNNER_TEMP/kaji-publication-status-initial/"
          cp .artifacts/kaji-publication-status/publication-status.md \
            "$RUNNER_TEMP/kaji-publication-status-initial/"
      - name: Classify publisher identity receipt outputs before setup
        id: publisher-receipt-binding
        continue-on-error: true
        env:
          PUBLISHER_ARTIFACT_ID: ${{ needs.publish-npm.outputs.publisher-artifact-id }}
          PUBLISHER_ARTIFACT_NAME: ${{ needs.publish-npm.outputs.publisher-artifact-name }}
          PUBLISHER_ARTIFACT_DIGEST: ${{ needs.publish-npm.outputs.publisher-artifact-digest }}
          PUBLISHER_OUTPUT: ${{ needs.publish-npm.outputs.expected-publisher }}
          PUBLISH_RESULT: ${{ needs.publish-npm.result }}
        run: |
          set -euo pipefail
          populated=0
          for value in \
            "$PUBLISHER_ARTIFACT_ID" \
            "$PUBLISHER_ARTIFACT_NAME" \
            "$PUBLISHER_ARTIFACT_DIGEST"; do
            if [ -n "$value" ]; then
              populated=$((populated + 1))
            fi
          done
          if [ -n "$PUBLISHER_OUTPUT" ] && {
            [[ ! "$PUBLISHER_OUTPUT" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]] ||
            [[ "$PUBLISHER_OUTPUT" =~ ^(npm_|github_pat_|gh[oprsu]_) ]] ||
            [[ "$PUBLISHER_OUTPUT" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]];
          }; then
            echo "mode=no-receipt" >>"$GITHUB_OUTPUT"
            echo "reason=receipt_artifact_metadata_mismatch" >>"$GITHUB_OUTPUT"
            echo "publisher output identity is invalid" >&2
            exit 1
          fi
          if [ "$populated" -eq 0 ]; then
            echo "mode=no-receipt" >>"$GITHUB_OUTPUT"
            if [ "$PUBLISH_RESULT" = skipped ] && [ -z "$PUBLISHER_OUTPUT" ]; then
              echo "reason=publish_job_not_started" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "reason=receipt_outputs_missing" >>"$GITHUB_OUTPUT"
            echo "publisher job started but receipt outputs are missing" >&2
            exit 1
          fi
          if [ "$populated" -ne 3 ]; then
            echo "mode=no-receipt" >>"$GITHUB_OUTPUT"
            echo "reason=receipt_outputs_missing" >>"$GITHUB_OUTPUT"
            echo "publisher receipt outputs must be all present or all absent" >&2
            exit 1
          fi
          if [[ ! "$PUBLISHER_ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ ]] || \
            [ "$PUBLISHER_ARTIFACT_ID" -gt 9007199254740991 ] || \
            [[ ! "$PUBLISHER_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || \
            [ "$PUBLISHER_ARTIFACT_NAME" != \
              "kaji-publisher-identity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]; then
            echo "mode=no-receipt" >>"$GITHUB_OUTPUT"
            echo "reason=receipt_artifact_metadata_mismatch" >>"$GITHUB_OUTPUT"
            echo "publisher receipt output binding is invalid" >&2
            exit 1
          fi
          echo "mode=receipt" >>"$GITHUB_OUTPUT"
          echo "reason=" >>"$GITHUB_OUTPUT"
      - name: Retain initial fail-closed publication status before setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-publication-status-initial
          path: ${{ runner.temp }}/kaji-publication-status-initial
          if-no-files-found: error
      # The first attempt is the only attempt allowed to transition from the
      # unpublished baseline. Reruns retain evidence but never query registries,
      # reduce state, or mutate the existing prerelease.
      - name: Guard workflow reruns before registry classification
        if: ${{ always() && github.run_attempt != 1 }}
        run: |
          jq --exit-status \
            '.state == "unpublished" and .releaseReady == false and
             .installRecommendation == false and
             .incident.code == "classification_pending" and
             .publishJobs.pypi == "skipped" and .publishJobs.npm == "skipped"' \
            .artifacts/kaji-publication-status/publication-status.json >/dev/null
          echo "Workflow reruns cannot create a publication transition or edit the prerelease." \
            >>"$GITHUB_STEP_SUMMARY"
      - name: Authenticate exact publisher identity artifact before download
        id: publisher-artifact-metadata
        if: ${{ always() && github.run_attempt == 1 && steps.publisher-receipt-binding.outcome == 'success' && steps.publisher-receipt-binding.outputs.mode == 'receipt' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_ARTIFACT_ID: ${{ needs.publish-npm.outputs.publisher-artifact-id }}
          PUBLISHER_ARTIFACT_NAME: ${{ needs.publish-npm.outputs.publisher-artifact-name }}
          PUBLISHER_ARTIFACT_DIGEST: ${{ needs.publish-npm.outputs.publisher-artifact-digest }}
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit || github.sha }}
          EXPECTED_TAG: ${{ needs.verify-tag.outputs.tag-name || 'kaji-v0.2.0-beta.10' }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/kaji.publish.yml
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_ARTIFACT_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          [ "$PUBLISHER_ARTIFACT_ID" -le 9007199254740991 ]
          [[ "$PUBLISHER_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [ "$PUBLISHER_ARTIFACT_NAME" = \
            "kaji-publisher-identity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]
          [ "$EXPECTED_TAG" = "kaji-v0.2.0-beta.10" ]
          [ "$EXPECTED_WORKFLOW_PATH" = ".github/workflows/kaji.publish.yml" ]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          run_metadata="$RUNNER_TEMP/kaji-publisher-workflow-run.json"
          artifact_metadata="$RUNNER_TEMP/kaji-publisher-artifact.json"
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >"$run_metadata" 2>/dev/null
          jq --exit-status \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg commit "$EXPECTED_COMMIT" \
            '.id == $runId and .run_attempt == 1 and .event == "push" and
             .path == ".github/workflows/kaji.publish.yml" and
             .head_branch == "kaji-v0.2.0-beta.10" and .head_sha == $commit' \
            "$run_metadata" >/dev/null
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLISHER_ARTIFACT_ID" \
            >"$artifact_metadata" 2>/dev/null
          jq --exit-status \
            --argjson id "$PUBLISHER_ARTIFACT_ID" \
            --arg name "$PUBLISHER_ARTIFACT_NAME" \
            --arg digest "sha256:$PUBLISHER_ARTIFACT_DIGEST" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg commit "$EXPECTED_COMMIT" \
            --arg apiUrl "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLISHER_ARTIFACT_ID" \
            '.id == $id and .name == $name and .digest == $digest and
             .expired == false and .size_in_bytes > 0 and .url == $apiUrl and
             .archive_download_url == ($apiUrl + "/zip") and
             .workflow_run.id == $runId and
             .workflow_run.head_branch == "kaji-v0.2.0-beta.10" and
             .workflow_run.head_sha == $commit' \
            "$artifact_metadata" >/dev/null
      - name: Download exact publisher identity artifact
        id: publisher-receipt-download
        if: ${{ always() && github.run_attempt == 1 && steps.publisher-artifact-metadata.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.publish-npm.outputs.publisher-artifact-id }}
          path: ${{ runner.temp }}/kaji-publisher-identity-download
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Validate exact publisher receipt inventory
        id: publisher-receipt-inventory
        if: ${{ always() && github.run_attempt == 1 && steps.publisher-receipt-download.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kaji-publisher-identity-download"
          observed_count="$(find "$root" -mindepth 1 -maxdepth 1 | wc -l |
            tr -d '[:space:]')"
          [ "$observed_count" = 1 ]
          receipt="$root/publisher-identity-receipt.json"
          [ -f "$receipt" ]
          [ ! -L "$receipt" ]
          [ "$(wc -c <"$receipt")" -le 65536 ]
      - id: checkout
        if: ${{ always() && github.run_attempt == 1 }}
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit || github.sha }}
          persist-credentials: false
      - name: Restore fail-closed publication status after checkout
        if: ${{ always() && github.run_attempt == 1 }}
        run: |
          mkdir -p .artifacts/kaji-publication-status
          cp "$RUNNER_TEMP/kaji-publication-status-initial/publication-status.json" \
            .artifacts/kaji-publication-status/
          cp "$RUNNER_TEMP/kaji-publication-status-initial/publication-status.md" \
            .artifacts/kaji-publication-status/
      - id: setup-node
        if: ${{ always() && github.run_attempt == 1 }}
        continue-on-error: true
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - id: setup-python
        if: ${{ always() && github.run_attempt == 1 }}
        continue-on-error: true
        uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji
          python-version: "3.14"
      - name: Install pinned npm registry verifier
        id: verifiers
        if: ${{ always() && github.run_attempt == 1 }}
        continue-on-error: true
        run: |
          npm install --global npm@11.16.0
      - id: artifacts
        if: ${{ always() && github.run_attempt == 1 }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.supply-chain.outputs.carrier-artifact-id }}
          path: .artifacts/kaji-release
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Revalidate artifacts before published-byte verification
        id: artifact-check
        if: ${{ always() && github.run_attempt == 1 && steps.checkout.outcome == 'success' && steps.artifacts.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit || github.sha }}
          CARRIER_ID: ${{ needs.supply-chain.outputs.carrier-artifact-id }}
          CARRIER_ACTION_DIGEST: ${{ needs.supply-chain.outputs.carrier-artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$CARRIER_ID" =~ ^[1-9][0-9]*$ ]]
          [ "$CARRIER_ID" -le 9007199254740991 ]
          [[ "$CARRIER_ACTION_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          python3 kaji/scripts/verify_release_artifacts.py \
            --artifacts-dir .artifacts/kaji-release \
            --expected-commit "$EXPECTED_COMMIT"
          metadata="$RUNNER_TEMP/kaji-publication-carrier.json"
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$CARRIER_ID" \
            >"$metadata" 2>/dev/null
          jq --exit-status \
            --argjson id "$CARRIER_ID" \
            --arg digest "sha256:$CARRIER_ACTION_DIGEST" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$EXPECTED_COMMIT" \
            '.id == $id and .name == "kaji-beta-artifacts" and
             .digest == $digest and .expired == false and .size_in_bytes > 0 and
             .workflow_run.id == $runId and .workflow_run.head_branch == $branch and
             .workflow_run.head_sha == $commit' "$metadata" >/dev/null
      - name: Poll bounded npm propagation and verify published bytes
        id: registry
        if: ${{ always() && github.run_attempt == 1 && needs.publish-npm.result == 'success' && steps.verifiers.outcome == 'success' && steps.artifact-check.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout --signal=TERM --kill-after=10s 20m \
            python3 kaji/scripts/verify_published_packages.py \
            --target npm \
            --artifacts-dir .artifacts/kaji-release \
            --output .artifacts/kaji-publication-status/registry-verification.json \
            --downloads-dir .artifacts/kaji-publication-status/downloaded \
            --repository "$GITHUB_REPOSITORY" \
            --tag "${{ needs.verify-tag.outputs.tag-name }}" \
            --workflow-path .github/workflows/kaji.publish.yml \
            --workflow-sha "${{ github.workflow_sha }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt 1 \
            --attempts 45 --initial-delay 2 --max-delay 20
      - name: Reduce monotonic publication state
        id: classify
        if: ${{ always() && github.run_attempt == 1 }}
        env:
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit || github.sha }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag-name || 'kaji-v0.2.0-beta.10' }}
          NPM_PUBLISH_RESULT: ${{ needs.publish-npm.result }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          PUBLISHER_OUTPUT: ${{ needs.publish-npm.outputs.expected-publisher }}
          PUBLISHER_ARTIFACT_ID: ${{ needs.publish-npm.outputs.publisher-artifact-id }}
          PUBLISHER_ARTIFACT_NAME: ${{ needs.publish-npm.outputs.publisher-artifact-name }}
          PUBLISHER_ARTIFACT_DIGEST: ${{ needs.publish-npm.outputs.publisher-artifact-digest }}
          PUBLISHER_BINDING_MODE: ${{ steps.publisher-receipt-binding.outputs.mode }}
          PUBLISHER_BINDING_REASON: ${{ steps.publisher-receipt-binding.outputs.reason }}
          PUBLISHER_METADATA_OUTCOME: ${{ steps.publisher-artifact-metadata.outcome }}
          PUBLISHER_DOWNLOAD_OUTCOME: ${{ steps.publisher-receipt-download.outcome }}
          PUBLISHER_INVENTORY_OUTCOME: ${{ steps.publisher-receipt-inventory.outcome }}
        run: |
          set +e
          mkdir -p .artifacts/kaji-publication-status
          PYPI_HTTP="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' https://pypi.org/pypi/kaji-sdk/0.2.0b1/json)"
          case "$PYPI_HTTP" in
            200) PYPI_STATE=present ;;
            404) PYPI_STATE=absent ;;
            *) PYPI_STATE=unknown ;;
          esac
          NPM_STATE=unknown
          fetch_classification_json() {
            local url="$1"
            local body="$2"
            local metadata="$3"
            local maximum_bytes="$4"
            curl --silent --show-error --max-time 30 --connect-timeout 10 \
              --proto '=https' --tlsv1.2 --max-filesize "$maximum_bytes" \
              --header "Accept: application/json" \
              --output "$body" \
              --write-out '%{http_code}\t%{content_type}\t%{url_effective}\t%{num_redirects}\t%{size_download}\n' \
              "$url" >"$metadata"
            local transport_status=$?
            [ "$transport_status" -eq 0 ] || return 1
            [ "$(wc -l <"$metadata")" -eq 1 ] || return 1
            local http_status content_type effective_url redirects reported_size
            IFS=$'\t' read -r http_status content_type effective_url redirects reported_size \
              <"$metadata"
            [ "$effective_url" = "$url" ] && [ "$redirects" = 0 ] || return 1
            case "$content_type" in
              application/json|"application/json; charset=utf-8") ;;
              *) return 1 ;;
            esac
            [[ "$reported_size" =~ ^[1-9][0-9]*$ ]] && \
              [ "$reported_size" -le "$maximum_bytes" ] && \
              [ "$(wc -c <"$body")" -eq "$reported_size" ] || return 1
            FETCH_HTTP_STATUS="$http_status"
          }
          CONTROL_BODY="$RUNNER_TEMP/kaji-npm-classification-control.json"
          CONTROL_METADATA="$RUNNER_TEMP/kaji-npm-classification-control.metadata"
          if fetch_classification_json \
            https://registry.npmjs.org/tiny-tarball/1.0.0 \
            "$CONTROL_BODY" "$CONTROL_METADATA" 262144 && \
            [ "$FETCH_HTTP_STATUS" = 200 ] && \
            jq --exit-status \
              'type == "object" and .name == "tiny-tarball" and .version == "1.0.0"' \
              "$CONTROL_BODY" >/dev/null 2>&1; then
            NPM_BODY="$RUNNER_TEMP/kaji-npm-classification.json"
            NPM_METADATA="$RUNNER_TEMP/kaji-npm-classification.metadata"
            if fetch_classification_json \
              https://registry.npmjs.org/kaji-sdk/0.2.0-beta.10 \
              "$NPM_BODY" "$NPM_METADATA" 262144; then
              case "$FETCH_HTTP_STATUS" in
                200)
                  if jq --exit-status \
                    'type == "object" and .name == "kaji-sdk" and
                     .version == "0.2.0-beta.10"' \
                    "$NPM_BODY" >/dev/null 2>&1; then
                    NPM_STATE=present
                  fi
                  ;;
                404)
                  if jq --exit-status \
                    'type == "string" and . == "Not Found"' \
                    "$NPM_BODY" >/dev/null 2>&1; then
                    NPM_STATE=absent
                  fi
                  ;;
              esac
            fi
          fi
          if [ -f .artifacts/kaji-publication-status/registry-verification.json ]; then
            REGISTRY_VERIFICATION="$(jq --raw-output .status \
              .artifacts/kaji-publication-status/registry-verification.json 2>/dev/null)"
            if [ "$REGISTRY_VERIFICATION" != npm_byte_verified ]; then
              REGISTRY_VERIFICATION=failed
            fi
          else
            REGISTRY_VERIFICATION=not_run
          fi
          PUBLISHER_REASON="$PUBLISHER_BINDING_REASON"
          PUBLISHER_ARGS=()
          if [ "$PUBLISHER_BINDING_MODE" = receipt ] && \
            [ "$PUBLISHER_METADATA_OUTCOME" = success ] && \
            [ "$PUBLISHER_DOWNLOAD_OUTCOME" = success ] && \
            [ "$PUBLISHER_INVENTORY_OUTCOME" = success ]; then
            PUBLISHER_ARGS=(
              --publisher-receipt
              "$RUNNER_TEMP/kaji-publisher-identity-download/publisher-identity-receipt.json"
              --publisher-artifact-name "$PUBLISHER_ARTIFACT_NAME"
              --publisher-artifact-id "$PUBLISHER_ARTIFACT_ID"
              --publisher-artifact-digest "sha256:$PUBLISHER_ARTIFACT_DIGEST"
            )
            if [ -n "$PUBLISHER_OUTPUT" ]; then
              PUBLISHER_ARGS+=(--expected-publisher "$PUBLISHER_OUTPUT")
            fi
          else
            if [ "$PUBLISHER_BINDING_MODE" = receipt ]; then
              if [ "$PUBLISHER_METADATA_OUTCOME" != success ]; then
                PUBLISHER_REASON=receipt_artifact_metadata_mismatch
              else
                PUBLISHER_REASON=receipt_download_failed
              fi
            fi
            case "$PUBLISHER_REASON" in
              publish_job_not_started|receipt_outputs_missing|receipt_artifact_metadata_mismatch|receipt_download_failed) ;;
              *) PUBLISHER_REASON=receipt_outputs_missing ;;
            esac
            PUBLISHER_ARGS=(--publisher-no-receipt-reason "$PUBLISHER_REASON")
          fi
          CLASSIFY_STATUS=127
          if [ -f kaji/scripts/verify_published_packages.py ]; then
            python3 kaji/scripts/verify_published_packages.py state \
              --target npm \
              --previous-state unpublished \
              --pypi "$PYPI_STATE" \
              --npm "$NPM_STATE" \
              --registry-verification "$REGISTRY_VERIFICATION" \
              --pypi-publish-result skipped \
              --npm-publish-result "$NPM_PUBLISH_RESULT" \
              --commit "$RELEASE_COMMIT" \
              --tag "$RELEASE_TAG" \
              --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-path .github/workflows/kaji.publish.yml \
              --workflow-sha "$WORKFLOW_SHA" \
              "${PUBLISHER_ARGS[@]}" \
              --output .artifacts/kaji-publication-status/publication-status.json \
              --markdown .artifacts/kaji-publication-status/publication-status.md
            CLASSIFY_STATUS=$?
          fi
          if [ "$CLASSIFY_STATUS" -ne 0 ]; then
            case "$PYPI_STATE/$NPM_STATE" in
              present/present) FALLBACK_STATE=both_published ;;
              present/absent) FALLBACK_STATE=pypi_only ;;
              absent/present) FALLBACK_STATE=npm_only ;;
              *) FALLBACK_STATE=unpublished ;;
            esac
            if [ "$FALLBACK_STATE" = unpublished ] && \
              [ "$PYPI_STATE" = absent ] && \
              [ "$NPM_STATE" = absent ] && \
              [ "$REGISTRY_VERIFICATION" = not_run ] && \
              [ "$NPM_PUBLISH_RESULT" = skipped ] && \
              [ "$PUBLISHER_REASON" = publish_job_not_started ]; then
              FALLBACK_INCIDENT=false
            else
              FALLBACK_INCIDENT=true
            fi
            FALLBACK_PUBLISHER_REASON="$PUBLISHER_REASON"
            if [ "$PUBLISHER_BINDING_MODE" = receipt ] && \
              [ "$PUBLISHER_METADATA_OUTCOME" = success ] && \
              [ "$PUBLISHER_DOWNLOAD_OUTCOME" = success ] && \
              [ "$PUBLISHER_INVENTORY_OUTCOME" = success ]; then
              FALLBACK_PUBLISHER_REASON=receipt_invalid
            fi
            case "$FALLBACK_PUBLISHER_REASON" in
              publish_job_not_started|receipt_outputs_missing|receipt_artifact_metadata_mismatch|receipt_download_failed|receipt_invalid|identity_check_failed) ;;
              *) FALLBACK_PUBLISHER_REASON=receipt_outputs_missing ;;
            esac
            jq --null-input \
              --arg commit "$RELEASE_COMMIT" \
              --arg tag "$RELEASE_TAG" \
              --arg state "$FALLBACK_STATE" \
              --arg pypi "$PYPI_STATE" --arg npm "$NPM_STATE" \
              --arg npmPublish "$NPM_PUBLISH_RESULT" \
              --arg verification "$REGISTRY_VERIFICATION" \
              --argjson hasIncident "$FALLBACK_INCIDENT" \
              --arg publisherReason "$FALLBACK_PUBLISHER_REASON" \
              --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg workflowPath ".github/workflows/kaji.publish.yml" \
              --arg workflowSha "$WORKFLOW_SHA" \
              '{schemaVersion: 1, target: "npm", commit: $commit, tag: $tag,
                workflowRunAttempt: $workflowRunAttempt,
                workflowPath: $workflowPath, workflowSha: $workflowSha,
                expectedPublisher: null, state: $state,
                previousState: "unpublished", releaseReady: false,
                installRecommendation: false,
                registries: {pypi: $pypi, npm: $npm},
                publishJobs: {pypi: "skipped", npm: $npmPublish},
                registryVerification: $verification,
                publisherIdentity: {conclusion: "not_run",
                  reason: $publisherReason, artifact: null,
                  receiptSha256: null, identity: null},
                incident: (if $hasIncident
                  then {code: "status_classifier_unavailable", recovery: "fix_forward_next_beta"}
                  else null
                  end),
                workflowRun: $workflowRun}' \
              >.artifacts/kaji-publication-status/publication-status.json
            {
              echo "# Kaji beta publication status"
              echo
              echo "- Commit: \`$RELEASE_COMMIT\`"
              echo "- State: **$FALLBACK_STATE**"
              echo "- PyPI/npm: \`$PYPI_STATE\` / \`$NPM_STATE\`"
              echo "- Publish jobs: \`skipped\` / \`$NPM_PUBLISH_RESULT\`"
              echo "- Retained evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "- Installation recommendation: WITHHELD: do not publish installation recommendations."
              if [ "$FALLBACK_INCIDENT" = true ]; then
                echo "- Incident: status_classifier_unavailable; preserve evidence and fix forward."
              else
                echo "- Incident: None; no publish job was attempted."
              fi
            } >.artifacts/kaji-publication-status/publication-status.md
          fi
          cat .artifacts/kaji-publication-status/publication-status.md >>"$GITHUB_STEP_SUMMARY" || true
          PUBLICATION_STATE="$(jq --raw-output .state .artifacts/kaji-publication-status/publication-status.json 2>/dev/null)"
          case "$PUBLICATION_STATE" in
            unpublished|pypi_only|npm_only|both_published|npm_byte_verified) ;;
            *) PUBLICATION_STATE=unpublished ;;
          esac
          PUBLISHER_REASON_OBSERVED="$(jq --raw-output '.publisherIdentity.reason' \
            .artifacts/kaji-publication-status/publication-status.json 2>/dev/null)"
          case "$PUBLISHER_REASON_OBSERVED" in
            null|publish_job_not_started|receipt_outputs_missing|receipt_artifact_metadata_mismatch|receipt_download_failed|receipt_invalid|identity_check_failed) ;;
            *) PUBLICATION_STATE=unpublished ;;
          esac
          echo "publication-state=$PUBLICATION_STATE" >>"$GITHUB_OUTPUT"
          if [ "$PUBLICATION_STATE" = npm_byte_verified ]; then
            if jq --exit-status \
              '.publisherIdentity.conclusion == "passed" and
               .publisherIdentity.reason == null and
               (.publisherIdentity.receiptSha256 | type == "string") and
               (.publisherIdentity.receiptSha256 | test("^[0-9a-f]{64}$")) and
               .publisherIdentity.identity.expectedPublisher == .expectedPublisher and
               .publisherIdentity.identity.actualPublisher == .expectedPublisher' \
              .artifacts/kaji-publication-status/publication-status.json >/dev/null 2>&1; then
              TERMINAL_EXPECTED_PUBLISHER="$(jq --raw-output .expectedPublisher \
                .artifacts/kaji-publication-status/publication-status.json)"
              if [ -n "$TERMINAL_EXPECTED_PUBLISHER" ] && \
                [ "$TERMINAL_EXPECTED_PUBLISHER" = "$PUBLISHER_OUTPUT" ]; then
                echo "expected-publisher=$TERMINAL_EXPECTED_PUBLISHER" >>"$GITHUB_OUTPUT"
              fi
            fi
          fi
          if jq --exit-status '.incident != null' \
            .artifacts/kaji-publication-status/publication-status.json >/dev/null 2>&1; then
            echo "incident=true" >>"$GITHUB_OUTPUT"
          else
            echo "incident=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Preserve publication outcome and recovery directions
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaji-publication-status
          path: .artifacts/kaji-publication-status
          if-no-files-found: error
      - name: Require exact npm byte-verified publication state
        if: ${{ always() }}
        env:
          EXPECTED_PUBLISHER: ${{ steps.classify.outputs.expected-publisher }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_PUBLISHER"
          jq --exit-status --arg expected "$EXPECTED_PUBLISHER" \
            '.state == "npm_byte_verified" and .releaseReady == true and
             .installRecommendation == true and .expectedPublisher == $expected and
             .publisherIdentity.conclusion == "passed" and
             .publisherIdentity.reason == null and
             .publisherIdentity.identity.expectedPublisher == .expectedPublisher and
             .publisherIdentity.identity.actualPublisher == .expectedPublisher and
             .publisherIdentity.receiptSha256 != null and
             (.publisherIdentity.receiptSha256 | test("^[0-9a-f]{64}$"))' \
            .artifacts/kaji-publication-status/publication-status.json >/dev/null || {
              echo "Publication lacks terminal byte and publisher identity verification; installation recommendations remain withheld." >&2
              exit 1
            }

  publication-incident:
    name: publication incident
    needs: [verify-tag, publication-status]
    if: ${{ always() && github.run_attempt == 1 && needs.verify-tag.result == 'success' && needs.publication-status.outputs.state != 'npm_byte_verified' && needs.publication-status.outputs.incident == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-publication-status
          path: .artifacts/kaji-publication-status
      - name: Create or update fail-closed incident prerelease status
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ needs.verify-tag.outputs.tag-name }}
        run: |
          STATUS_JSON=.artifacts/kaji-publication-status/publication-status.json
          STATUS_MD=.artifacts/kaji-publication-status/publication-status.md
          jq --exit-status \
            '.state != "npm_byte_verified" and .releaseReady == false and
             .installRecommendation == false and (.incident.code | type == "string")' \
            "$STATUS_JSON" >/dev/null
          grep --fixed-strings "Installation recommendation: WITHHELD" "$STATUS_MD" >/dev/null
          ENCODED_TAG="$(jq --null-input --raw-output --arg tag "$EXPECTED_TAG" '$tag | @uri')"
          RELEASE_JSON="$RUNNER_TEMP/kaji-incident-release.json"
          HTTP_STATUS="$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$RELEASE_JSON" --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$ENCODED_TAG")"
          case "$HTTP_STATUS" in
            200)
              jq --exit-status --arg tag "$EXPECTED_TAG" \
                '.tag_name == $tag and .name == ("Kaji " + $tag) and
                 .prerelease == true and .draft == false' \
                "$RELEASE_JSON" >/dev/null
              gh release edit "$EXPECTED_TAG" --repo "$GITHUB_REPOSITORY" \
                --prerelease --title "Kaji $EXPECTED_TAG" --notes-file "$STATUS_MD"
              ;;
            404)
              gh release create "$EXPECTED_TAG" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --prerelease --title "Kaji $EXPECTED_TAG" \
                --notes-file "$STATUS_MD"
              ;;
            *)
              echo "GitHub prerelease lookup failed with HTTP $HTTP_STATUS" >&2
              exit 1
              ;;
          esac

  release-evidence:
    name: release evidence
    needs: [verify-tag, typescript-onboarding-evidence, supply-chain, publication-status]
    if: ${{ github.run_attempt == 1 && !cancelled() && needs.verify-tag.result == 'success' && needs.typescript-onboarding-evidence.result == 'success' && needs.supply-chain.result == 'success' && needs.publication-status.result == 'success' && needs.publication-status.outputs.state == 'npm_byte_verified' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
        with:
          working-directory: kaji
          python-version: "3.14"
          sync-args: --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.supply-chain.outputs.carrier-artifact-id }}
          path: .artifacts/kaji-release
          merge-multiple: true
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-supply-chain-evidence
          path: .artifacts/kaji-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kaji-publication-status
          path: .artifacts/kaji-publication-status
      - name: Validate terminal publication status before release attachment
        env:
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
          EXPECTED_TAG: ${{ needs.verify-tag.outputs.tag-name }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_PUBLISHER: ${{ needs.publication-status.outputs.expected-publisher }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_PUBLISHER"
          uv run --project kaji --no-sync python \
            kaji/scripts/validate_release_evidence.py publication-status \
            --publication-status .artifacts/kaji-publication-status/publication-status.json \
            --expected-commit "$EXPECTED_COMMIT" \
            --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --workflow-run-attempt 1 \
            --expected-tag "$EXPECTED_TAG" \
            --expected-workflow-path .github/workflows/kaji.publish.yml \
            --expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
            --expected-publisher "$EXPECTED_PUBLISHER" \
            --output "$RUNNER_TEMP/kaji-publication-status-validation.json"
      - name: Revalidate exact artifacts before release attachment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.verify-tag.outputs.commit }}
          CARRIER_ID: ${{ needs.supply-chain.outputs.carrier-artifact-id }}
          CARRIER_ACTION_DIGEST: ${{ needs.supply-chain.outputs.carrier-artifact-digest }}
          SIGNED_MANIFEST_SHA256: ${{ needs.verify-tag.outputs.release-manifest-sha256 }}
          SIGNED_NPM_TARBALL_NAME: ${{ needs.verify-tag.outputs.npm-tarball-name }}
          SIGNED_NPM_TARBALL_SHA256: ${{ needs.verify-tag.outputs.npm-tarball-sha256 }}
        run: |
          set -euo pipefail
          python kaji/scripts/verify_release_artifacts.py \
            --artifacts-dir .artifacts/kaji-release \
            --expected-commit "$EXPECTED_COMMIT"
          metadata="$RUNNER_TEMP/kaji-release-carrier.json"
          gh api \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$CARRIER_ID" \
            >"$metadata" 2>/dev/null
          jq --exit-status \
            --argjson id "$CARRIER_ID" \
            --arg digest "sha256:$CARRIER_ACTION_DIGEST" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$EXPECTED_COMMIT" \
            '.id == $id and .name == "kaji-beta-artifacts" and
             .digest == $digest and .expired == false and .size_in_bytes > 0 and
             .workflow_run.id == $runId and .workflow_run.head_branch == $branch and
             .workflow_run.head_sha == $commit' "$metadata" >/dev/null
          [ "$(sha256sum .artifacts/kaji-release/manifest.json | cut -d' ' -f1)" = \
            "$SIGNED_MANIFEST_SHA256" ]
          [ "$(sha256sum ".artifacts/kaji-release/$SIGNED_NPM_TARBALL_NAME" | cut -d' ' -f1)" = \
            "$SIGNED_NPM_TARBALL_SHA256" ]
      - name: Reverify signed tag immediately before release attachment
        uses: ./.github/actions/verify-kaji-beta-tag
        with:
          token: ${{ github.token }}
          tag: ${{ needs.verify-tag.outputs.tag-name }}
          tag_object: ${{ needs.verify-tag.outputs.tag-object }}
          commit: ${{ needs.verify-tag.outputs.commit }}
          tagger_email: ${{ vars.KAJI_RELEASE_SIGNER_EMAIL }}
          authorization_sha256: ${{ needs.verify-tag.outputs.authorization-sha256 }}
          rehearsal_run_id: ${{ needs.verify-tag.outputs.rehearsal-run-id }}
          rehearsal_run_attempt: ${{ needs.verify-tag.outputs.rehearsal-run-attempt }}
          rehearsal_workflow_path: ${{ needs.verify-tag.outputs.rehearsal-workflow-path }}
          rehearsal_workflow_sha: ${{ needs.verify-tag.outputs.rehearsal-workflow-sha }}
          candidate_artifact_id: ${{ needs.verify-tag.outputs.candidate-artifact-id }}
          candidate_artifact_name: ${{ needs.verify-tag.outputs.candidate-artifact-name }}
          candidate_artifact_digest: ${{ needs.verify-tag.outputs.candidate-artifact-digest }}
          evidence_artifact_id: ${{ needs.verify-tag.outputs.evidence-artifact-id }}
          evidence_artifact_name: ${{ needs.verify-tag.outputs.evidence-artifact-name }}
          evidence_artifact_digest: ${{ needs.verify-tag.outputs.evidence-artifact-digest }}
          release_manifest_sha256: ${{ needs.verify-tag.outputs.release-manifest-sha256 }}
          npm_tarball_name: ${{ needs.verify-tag.outputs.npm-tarball-name }}
          npm_tarball_sha256: ${{ needs.verify-tag.outputs.npm-tarball-sha256 }}
      - name: Create or verify prerelease and attach only missing digest-matched assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ needs.verify-tag.outputs.tag-name }}
        run: >-
          python kaji/scripts/attach_release_assets.py
          --repo "$GITHUB_REPOSITORY"
          --tag "$EXPECTED_TAG"
          --title "Kaji $EXPECTED_TAG"
          .artifacts/kaji-release/kaji-sdk-0.2.0-beta.10.tgz
          .artifacts/kaji-release/manifest.json
          .artifacts/kaji-release/SHA256SUMS
          .artifacts/kaji-evidence/offline-gates.log
          .artifacts/kaji-evidence/offline-gate-summary.json
          .artifacts/kaji-evidence/provider-evidence.json
          .artifacts/kaji-evidence/typescript-onboarding/status.json
          .artifacts/kaji-evidence/typescript-onboarding/validation.log
          .artifacts/kaji-evidence/typescript-onboarding/typescript-onboarding-evidence.json
          .artifacts/kaji-evidence/paired-benchmark-results.json
          .artifacts/kaji-evidence/soak-results.json
          .artifacts/kaji-evidence/performance-status.json
          .artifacts/kaji-evidence/performance-imagedata.json
          .artifacts/kaji-evidence/compat-python-3.11.json
          .artifacts/kaji-evidence/compat-python-3.14.json
          .artifacts/kaji-evidence/compat-node-22.json
          .artifacts/kaji-evidence/compat-node-24.json
          .artifacts/kaji-evidence/release-evidence-validation.json
          .artifacts/kaji-evidence/sbom.spdx.json
          .artifacts/kaji-evidence/provenance.bundle.jsonl
          .artifacts/kaji-evidence/provenance.json
          .artifacts/kaji-publication-status/registry-verification.json
          .artifacts/kaji-publication-status/publication-status.json
          .artifacts/kaji-publication-status/publication-status.md
          .artifacts/kaji-publication-status/downloaded/registry-kaji-sdk-0.2.0-beta.10.tgz
          .artifacts/kaji-publication-status/downloaded/registry-kaji-sdk-0.2.0-beta.10.tgz.github-attestation.json
          .artifacts/kaji-publication-status/downloaded/npm-signature-audit.json
