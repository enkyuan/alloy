name: test / ast-grep

on:
  push:
    branches: [main]
    paths:
      - "kaji/**"
      - "tools/ast-grep/**"
      - "sgconfig.yml"
      - "package.json"
      - "bun.lock"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ast-grep.test.yml"
  pull_request:
    paths:
      - "kaji/**"
      - "tools/ast-grep/**"
      - "sgconfig.yml"
      - "package.json"
      - "bun.lock"
      - ".github/actions/setup-bun-cache/**"
      - ".github/workflows/ast-grep.test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structural-guards:
    name: ast-grep structural guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun-cache
        with:
          working-directory: .
          bun-version: 1.3.11
          install-args: --frozen-lockfile

      - name: Test structural rules
        run: bun run ast-grep:test

      - name: Scan Kaji sources
        run: bun run ast-grep:scan
