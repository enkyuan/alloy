[tool.poetry]
name = "agentkit"
version = "0.1.0"
description = "An embeddable SDK for building agentic platforms (text + voice)."
authors = ["enkyuan <yuan.enkng@gmail.com>"]
readme = "agentkit/README.md"
packages = [{ include = "agentkit" }]
include = [
    { path = "agentkit/py.typed", format = ["sdist", "wheel"] },
    { path = "agentkit/integrations/registry/**/*.json", format = ["sdist", "wheel"] },
    { path = "agentkit/integrations/registry/**/*.py", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.11"
# Core SDK deps only. The FastAPI server, Postgres drivers, and auth deps live
# in the separate `agentkit-serve` distribution.
pydantic = {extras = ["email"], version = "^2.12.0"}
pydantic-settings = ">=2.11.0,<3.0.0"
httpx = ">=0.27.0,<0.28.0"
redis = {extras = ["asyncio"], version = "^6.4.0", optional = true}
google-api-python-client = {version = ">=2.108.0,<3.0.0", optional = true}
google-auth = {version = ">=2.25.0,<3.0.0", optional = true}
google-auth-oauthlib = {version = ">=1.2.0,<2.0.0", optional = true}
google-auth-httplib2 = {version = ">=0.2.0,<1.0.0", optional = true}
google-genai = {version = ">=1.0.0,<2.0.0", optional = true}
openai = {version = ">=2.0.0,<3.0.0", optional = true}
anthropic = {version = ">=0.40.0,<1.0.0", optional = true}
rich = {version = ">=13.0.0,<14.0.0", optional = true}
msgpack = "^1.1.2"

[tool.poetry.scripts]
agentkit = "agentkit.cli:main"

[tool.poetry.extras]
anthropic = ["anthropic"]
dev-ui = ["rich"]
gemini = ["google-genai"]
google-tools = [
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]
openai = ["openai"]
providers = ["anthropic", "google-genai", "openai"]
realtime = ["redis"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.poetry.group.dev.dependencies]
pyrefly = "^0.45.1"
ruff = "^0.11.0"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
fakeredis = "^2.33.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = ["agentkit"]
branch = true
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
