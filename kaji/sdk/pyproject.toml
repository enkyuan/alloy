[project]
name = "kaji"
version = "0.1.0"
description = "An embeddable SDK for building agentic platforms (text + voice)."
readme = "README.md"
requires-python = ">=3.11,<4"
authors = [
    { name = "enkyuan", email = "yuan.enkng@gmail.com" },
]
dependencies = [
    "pydantic[email]>=2.12.0,<3",
    "pydantic-settings>=2.11.0,<3",
    "httpx>=0.27.0,<0.28",
    "msgpack>=1.1.2,<2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0,<1"]
dev-ui = ["rich>=13.0.0,<14"]
gemini = ["google-genai>=1.0.0,<2"]
google-tools = [
    "google-api-python-client>=2.108.0,<3",
    "google-auth>=2.25.0,<3",
    "google-auth-oauthlib>=1.2.0,<2",
    "google-auth-httplib2>=0.2.0,<1",
]
oauth-keyring = ["keyring>=24.0.0,<26"]
openai = ["openai>=2.0.0,<3"]
providers = ["anthropic>=0.40.0,<1", "google-genai>=1.0.0,<2", "openai>=2.0.0,<3"]
realtime = ["redis[asyncio]>=6.4.0,<7"]

[project.scripts]
kaji = "kaji.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "kaji"

# The integrations registry holds dual-language manifest assets that
# install_integration() loads at runtime. Hatchling includes all file types
# within the packages scope (not Python-only), so .ts/.md/.json files under
# src/integrations/registry/ ship automatically via the sources remap.
# py.typed is also within src/ and ships without explicit force-include.

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
    "scripts/",
]

[dependency-groups]
dev = [
    "pyrefly>=0.45.1,<0.46",
    "ruff>=0.11.0,<0.12",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.0.0,<8",
    "fakeredis>=2.33.0,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--cov=kaji",
    "--cov-report=term-missing",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: tests that call real LLM APIs (skipped if API keys absent)",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.coverage.run]
source = ["kaji"]
branch = true
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
