[project]
name = "kaji-sdk"
version = "0.2.0b1"
description = "An embeddable SDK for building agentic platforms (text + voice)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4"
authors = [
    { name = "enkyuan", email = "yuan.enkng@gmail.com" },
]
urls = { Documentation = "https://github.com/enkyuan/alloy/blob/main/docs/kaji/README.md", Issues = "https://github.com/enkyuan/alloy/issues", Repository = "https://github.com/enkyuan/alloy" }
dependencies = [
    "pydantic[email]>=2.12.0,<3",
    "pydantic-settings>=2.11.0,<3",
    "httpx>=0.27.0,<0.28",
    "jsonschema[format]>=4.26,<5",
    "msgpack>=1.1.2,<2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0,<1"]
dev-ui = ["rich>=13.0.0,<14"]
gemini = ["google-genai>=1.0.0,<2"]
google-tools = [
    "google-api-python-client>=2.108.0,<3",
    "google-auth>=2.25.0,<3",
    "google-auth-oauthlib>=1.2.0,<2",
    "google-auth-httplib2>=0.2.0,<1",
]
oauth-keyring = ["keyring>=24.0.0,<26"]
openai = ["openai>=2.0.0,<3"]
providers = ["anthropic>=0.40.0,<1", "google-genai>=1.0.0,<2", "openai>=2.0.0,<3"]
realtime = ["redis[asyncio]>=6.4.0,<7"]

[project.scripts]
kaji = "kaji.cli:main"

[build-system]
requires = ["setuptools==83.0.0", "editables==0.6"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

# src/ IS the kaji package root (no src/kaji/ subdirectory exists).
# We enumerate all packages explicitly with kaji.* names so setuptools
# knows to remap src/ → kaji at install time. The pinned editables backend
# then implements the prefix-change case via a runtime MetaPathFinder.
packages = [
    "kaji",
    "kaji.cli",
    "kaji.contracts",
    "kaji.contracts.errors",
    "kaji.contracts.events",
    "kaji.contracts.integrations",
    "kaji.contracts.parity",
    "kaji.contracts.providers",
    "kaji.contracts.tools",
    "kaji.core",
    "kaji.infra",
    "kaji.infra.events",
    "kaji.infra.events.store",
    "kaji.infra.observability",
    "kaji.infra.realtime",
    "kaji.integrations",
    "kaji.integrations.registry",
    "kaji.integrations.registry.echo",
    "kaji.integrations.registry.github",
    "kaji.knowledge",
    "kaji.modalities",
    "kaji.modalities.text",
    "kaji.modalities.voice",
    "kaji.modalities.voice.tts",
    "kaji.modalities.voice.utils",
    "kaji.runtime",
    "kaji.runtime.agents",
    "kaji.runtime.integrations",
    "kaji.runtime.providers",
    "kaji.runtime.sessions",
    "kaji.runtime.tools",
    "kaji.runtime.workflows",
]

[tool.setuptools.package-dir]
kaji = "src"
"kaji.cli" = "src/cli"
"kaji.contracts" = "src/contracts"
"kaji.contracts.errors" = "src/contracts/errors"
"kaji.contracts.events" = "src/contracts/events"
"kaji.contracts.integrations" = "src/contracts/integrations"
"kaji.contracts.parity" = "src/contracts/parity"
"kaji.contracts.providers" = "src/contracts/providers"
"kaji.contracts.tools" = "src/contracts/tools"
"kaji.core" = "src/core"
"kaji.infra" = "src/infra"
"kaji.infra.events" = "src/infra/events"
"kaji.infra.events.store" = "src/infra/events/store"
"kaji.infra.observability" = "src/infra/observability"
"kaji.infra.realtime" = "src/infra/realtime"
"kaji.integrations" = "src/integrations"
"kaji.integrations.registry" = "src/integrations/registry"
"kaji.integrations.registry.echo" = "src/integrations/registry/echo"
"kaji.integrations.registry.github" = "src/integrations/registry/github"
"kaji.knowledge" = "src/knowledge"
"kaji.modalities" = "src/modalities"
"kaji.modalities.text" = "src/modalities/text"
"kaji.modalities.voice" = "src/modalities/voice"
"kaji.modalities.voice.tts" = "src/modalities/voice/tts"
"kaji.modalities.voice.utils" = "src/modalities/voice/utils"
"kaji.runtime" = "src/runtime"
"kaji.runtime.agents" = "src/runtime/agents"
"kaji.runtime.integrations" = "src/runtime/integrations"
"kaji.runtime.providers" = "src/runtime/providers"
"kaji.runtime.sessions" = "src/runtime/sessions"
"kaji.runtime.tools" = "src/runtime/tools"
"kaji.runtime.workflows" = "src/runtime/workflows"

[tool.setuptools.package-data]
kaji = [
    "py.typed",
    "integrations/registry/**/*.json",
    "integrations/registry/**/*.py",
    "integrations/registry/**/*.ts",
    "integrations/registry/**/LICENSE",
]
"kaji.contracts" = ["*.json", "*.md"]
"kaji.contracts.errors" = ["*.json"]
"kaji.contracts.events" = ["*.json"]
"kaji.contracts.integrations" = ["*.json"]
"kaji.contracts.parity" = ["*.json"]
"kaji.contracts.providers" = ["*.json"]
"kaji.contracts.tools" = ["*.json"]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "ty",
    "ruff>=0.11.0,<0.12",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.0.0,<8",
    "fakeredis>=2.33.0,<3",
    "twine==6.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--cov=kaji",
    "--cov-report=term-missing",
    "--import-mode=importlib",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: tests that call real LLM APIs (skipped if API keys absent)",
]

[tool.ty.src]
include = ["src", "tests"]

[tool.coverage.run]
source = ["kaji"]
branch = true
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
