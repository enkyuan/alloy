[tool.poetry]
name = "kaji-serve"
version = "0.1.0"
description = "FastAPI + workers reference service for the Kaji SDK."
authors = ["enkyuan <yuan.enkng@gmail.com>"]
readme = "README.md"
packages = [{ include = "kaji_serve" }]

[tool.poetry.dependencies]
python = "^3.11"
# The core SDK. Path dependency (editable) for local monorepo development;
# switch to a version constraint when publishing.
kaji = { path = "../sdk", develop = true, extras = ["realtime", "providers"] }
# Service-only deps: FastAPI server, Postgres drivers, auth.
fastapi = ">=0.119.0,<0.120.0"
uvicorn = ">=0.37.0,<0.38.0"
websockets = ">=13.0,<16.0"
sqlalchemy = ">=2.0.44,<3.0.0"
alembic = ">=1.17.0,<2.0.0"
psycopg2-binary = ">=2.9.11,<3.0.0"
python-jose = ">=3.5.0,<4.0.0"
passlib = ">=1.7.4,<2.0.0"
asyncpg = ">=0.30.0,<0.31.0"
python-multipart = ">=0.0.9,<0.1.0"
taskiq = "^0.11.20"
taskiq-redis = "^1.1.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.0"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
fakeredis = "^2.33.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Tests and fixtures here are written for pytest-asyncio's auto mode (async
# fixtures use a plain @pytest.fixture, async tests carry no marker), matching
# the SDK's pytest.ini. Without this, pytest-asyncio defaults to strict mode and
# every async test/fixture errors.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["kaji_serve"]
branch = true
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
