[project]
name = "kaji-serve"
version = "0.1.0"
description = "FastAPI + Soniox STT reference service for the Kaji SDK."
readme = "README.md"
requires-python = ">=3.11,<4"
authors = [
    { name = "enkyuan", email = "yuan.enkng@gmail.com" },
]
dependencies = [
    # Shape A: extras live on the project dep; uv.sources is path-only.
    "kaji-sdk[providers]",
    "fastapi>=0.119.0,<0.120",
    "uvicorn>=0.37.0,<0.38",
    "websockets>=13.0,<16",
    "sqlalchemy>=2.0.44,<3",
    "alembic>=1.17.0,<2",
    "psycopg2-binary>=2.9.11,<3",
    "python-jose>=3.5.0,<4",
    "passlib>=1.7.4,<2",
    "asyncpg>=0.30.0,<0.31",
    "python-multipart>=0.0.9,<0.1",
]

[tool.uv.sources]
kaji-sdk = { path = "../sdk", editable = true }

[build-system]
requires = ["setuptools>=68", "editables>=0.5"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["kaji_serve", "kaji_serve.*"]
namespaces = false

[dependency-groups]
dev = [
    "ruff>=0.11.0,<0.12",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.0.0,<8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: requires a live local Postgres test database",
]
addopts = [
    "--cov=kaji_serve",
    "--cov-report=term-missing",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["kaji_serve"]
branch = true
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
