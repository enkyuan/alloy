[project]
name = "kaji-sdk"
version = "0.2.0b1"
description = "An embeddable SDK for building agentic platforms (text + voice)."
readme = "README.md"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4"
authors = [
    { name = "enkyuan", email = "yuan.enkng@gmail.com" },
]
urls = { Documentation = "https://github.com/enkyuan/alloy/blob/main/docs/kaji/README.md", Issues = "https://github.com/enkyuan/alloy/issues", Repository = "https://github.com/enkyuan/alloy" }
dependencies = [
    "pydantic>=2.12.0,<3",
    "pydantic-settings>=2.11.0,<3",
    "httpx>=0.27.0,<0.28",
    "jsonschema[format]>=4.26,<5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0,<1"]
dev-ui = ["rich>=13.0.0,<14"]
gemini = ["google-genai>=1.0.0,<2"]
openai = ["openai>=2.0.0,<3"]
providers = ["anthropic>=0.40.0,<1", "google-genai>=1.0.0,<2", "openai>=2.0.0,<3"]
realtime = ["msgpack>=1.1.2,<2", "redis>=6.4.0,<7"]

[project.scripts]
kaji = "kaji.cli:main"

[build-system]
requires = ["setuptools==83.0.0", "editables==0.6"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["kaji", "kaji.*"]
namespaces = false

[tool.setuptools.package-data]
kaji = [
    "py.typed",
    "integrations/registry/**/*.json",
    "integrations/registry/**/*.py",
    "integrations/registry/**/LICENSE",
]
"kaji.contracts" = ["*.json", "*.md", "cli/*.json", "release/*.json"]
"kaji.contracts.errors" = ["*.json"]
"kaji.contracts.events" = ["*.json"]
"kaji.contracts.integrations" = ["*.json"]
"kaji.contracts.parity" = ["*.json"]
"kaji.contracts.providers" = ["*.json"]
"kaji.contracts.tools" = ["*.json"]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "ty",
    "ruff>=0.11.0,<0.12",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.0.0,<8",
    "fakeredis>=2.33.0,<3",
    "msgpack>=1.1.2,<2",
    "twine==6.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--cov=kaji",
    "--cov-report=term-missing",
    "--import-mode=importlib",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: tests that call real LLM APIs (skipped if API keys absent)",
]

[tool.ruff]
target-version = "py311"

[tool.ty.src]
include = ["src", "tests"]

[tool.coverage.run]
source = ["kaji"]
branch = true
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
